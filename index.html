<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Almacén de Flotas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 rx=%222%22 fill=%22%23E2A400%22/%3E%3C/svg%3E">
<meta name="description" content="Web de estudio del parcial de Gestión y Operación de Flotas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Minimalista: papel claro, tinta oscura y un solo acento ámbar (el del larguero de estantería). */
:root{
  --bg:#F6F6F3;--surface:#FFFFFF;--surface-2:#F1F1EC;--ink:#1B1E20;--muted:#6A7073;--line:#E1E1DA;
  --yellow:#E2A400;--yellow-soft:#FBF1D2;--on-yellow:#1B1E20;
  --blue:#2457A0;--blue-soft:#E7EEF8;
  --ok:#2C7A4B;--ok-soft:#E3F1E7;--bad:#B3392C;--bad-soft:#F8E4E0;--jh:#7A4BC2;--jh-soft:#EFE7FA;
  --shadow:none;--bar:#1B1E20;--bar-ink:#F3F3EF;--btn:#1B1E20;--btn-ink:#F6F6F3;
  --f-display:"Inter","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141617;--surface:#1B1E20;--surface-2:#212528;--ink:#E8E9E5;--muted:#9AA1A3;--line:#2E3336;
  --yellow:#F0B72A;--yellow-soft:#352C14;--on-yellow:#141617;--blue:#86AEEA;--blue-soft:#1C2738;
  --ok:#6CC892;--ok-soft:#16301F;--bad:#F08A7C;--bad-soft:#3A1E1A;--jh:#B79AF0;--jh-soft:#2A2140;
  --bar:#0E1011;--bar-ink:#EDEEEA;--btn:#E8E9E5;--btn-ink:#141617;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141617;--surface:#1B1E20;--surface-2:#212528;--ink:#E8E9E5;--muted:#9AA1A3;--line:#2E3336;
  --yellow:#F0B72A;--yellow-soft:#352C14;--on-yellow:#141617;--blue:#86AEEA;--blue-soft:#1C2738;
  --ok:#6CC892;--ok-soft:#16301F;--bad:#F08A7C;--bad-soft:#3A1E1A;--jh:#B79AF0;--jh-soft:#2A2140;
  --bar:#0E1011;--bar-ink:#EDEEEA;--btn:#E8E9E5;--btn-ink:#141617;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--blue)}
h1,h2,h3,h4{text-wrap:balance;line-height:1.2;margin:0;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:1.08rem;font-weight:600}
h4{font-size:.98rem;font-weight:600}
p{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;font-weight:700;letter-spacing:-.01em}
.brand i{width:10px;height:10px;background:var(--yellow);border-radius:2px;display:inline-block}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-size:.88rem;font-weight:500;padding:5px 10px;border-radius:6px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2);font-weight:600}
@media (max-width:640px){.nav{margin-left:-8px;width:calc(100% + 8px)}.nav a{padding:5px 8px}.top .wrap{gap:6px}}

main{padding-block:32px 80px}
.view{display:grid;gap:24px}

/* ---------- inicio ---------- */
.home{display:grid;gap:28px;max-width:760px}
.home h1{font-size:clamp(1.7rem,4vw,2.2rem);font-weight:700;letter-spacing:-.02em}
.home .lead{color:var(--muted);margin-top:6px}
.tlist{display:grid;border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) 120px;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.trow:hover{background:var(--surface)}
.trow .c{font-family:var(--f-mono);font-weight:600;font-size:.95rem}
.trow h3{font-size:1rem}
.trow p{color:var(--muted);font-size:.86rem;margin-top:2px}
.trow .pg{display:grid;gap:4px;justify-items:end}
@media (max-width:560px){.trow{grid-template-columns:40px minmax(0,1fr)}.trow .pg{grid-column:2;justify-items:start}}
.meter{height:4px;width:100%;background:var(--surface-2);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--yellow)}
.meterlabel{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.simrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:inherit}
.simrow:hover{border-color:var(--ink)}
.simrow p{color:var(--muted);font-size:.88rem}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sectionhead p{color:var(--muted);font-size:.88rem}
footer.foot{color:var(--muted);font-size:.78rem}

/* ---------- página de tema ---------- */
.topichead{display:grid;gap:4px}
.topichead .c{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.topichead h1{font-size:clamp(1.5rem,3.6vw,2rem);font-weight:700;letter-spacing:-.02em}
.topichead p{color:var(--muted);max-width:70ch}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,52px));background:var(--bg);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;font-weight:500;font-size:.92rem;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow);font-weight:600}
.tabs button .n{font-family:var(--f-mono);font-size:.7rem;font-weight:400;margin-left:5px;color:var(--muted)}
.subhead{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.subhead h2{font-size:1rem}
.subhead span{color:var(--muted);font-size:.85rem}
/* estudio */
.study{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.study{grid-template-columns:1fr}.toc{position:static!important}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,52px) + 56px);display:grid;gap:2px;font-size:.88rem;border-left:3px solid var(--line);padding-left:10px}
.toc a{text-decoration:none;color:var(--muted);padding:3px 0}
.toc a:hover{color:var(--ink)}
.toc .lg{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:10px;display:grid;gap:4px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:grid;gap:12px;scroll-margin-top:130px}
@media (max-width:520px){.sec{padding:16px 14px}}
.sec + .sec{margin-top:16px}
.sec h3{display:flex;gap:10px;align-items:baseline;font-size:1.25rem}
.sec h3 .k{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:400}
.sec p,.sec li{max-width:75ch}
.sec ul,.sec ol{margin:0;padding-left:1.25em;display:grid;gap:4px}
.src{display:inline-block;font-family:var(--f-mono);font-size:.66rem;font-weight:600;letter-spacing:.05em;padding:1px 6px;border-radius:2px;vertical-align:2px;margin-right:4px;white-space:nowrap}
.src.jh{background:var(--jh-soft);color:var(--jh);border:1px solid var(--jh)}
.src.pr{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue)}
.src.xl{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.call{border-left:4px solid var(--blue);background:var(--blue-soft);padding:10px 14px;border-radius:0 3px 3px 0;font-size:.95rem}
.call > b:first-child{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.call.ojo{border-color:var(--yellow);background:var(--yellow-soft)}
.call.contra{border-color:var(--jh);background:var(--jh-soft)}
.call.porque{border-color:var(--ok);background:var(--ok-soft)}
.call.mal{border-color:var(--bad);background:var(--bad-soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.mini{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface-2)}
.mini h4{margin-bottom:4px}
.formula{font-family:var(--f-mono);background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font-size:.95rem;white-space:nowrap}
.formula .y{color:var(--blue);font-weight:600}
.steps{counter-reset:s;display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps > li{counter-increment:s;position:relative;padding-left:34px}
.steps > li::before{content:counter(s);position:absolute;left:0;top:2px;font-family:var(--f-mono);font-size:.72rem;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);width:22px;height:22px;display:grid;place-items:center;border-radius:6px}

/* mapa mental */
.map{display:grid;gap:18px}
.maphint{color:var(--muted);font-size:.9rem}
.mroot{justify-self:center;background:var(--surface);border:1px solid var(--ink);font-weight:700;font-size:1.15rem;padding:10px 22px;border-radius:10px;text-align:center}
.mbranches{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 40px}
.mbranches::before{content:"";position:absolute;left:50%;top:-18px;bottom:0;border-left:3px dashed var(--line);transform:translateX(-1px)}
@media (max-width:760px){.mbranches{grid-template-columns:1fr}.mbranches::before{left:12px}.mbranch{margin-left:28px}}
.mbranch{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.mbranch > header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.mbranch > header .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.mnodes{list-style:none;margin:0;padding:8px 12px 12px;display:grid;gap:4px}
.mnodes .mnodes{padding:4px 0 2px 16px;border-left:2px solid var(--line);margin-left:6px}
.mnode > button{all:unset;cursor:pointer;display:block;padding:3px 6px;border-radius:2px;font-size:.92rem}
.mnode > button:hover{background:var(--surface-2)}
.mnode > button:focus-visible{outline:2px solid var(--blue)}
.mnode > button .t{font-weight:600}
.mnode > button .car{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-left:4px}
.mnode .det{font-size:.85rem;color:var(--muted);padding:2px 6px 4px 6px}

/* ejercicios */
.exlist{display:grid;gap:16px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ex > summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:baseline}
.ex > summary::-webkit-details-marker{display:none}
.ex > summary .tag{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:999px;white-space:nowrap}
.ex > summary h3{font-size:1.08rem;flex:1}
.ex > summary .chev{font-family:var(--f-mono);color:var(--muted)}
.ex[open] > summary .chev{transform:rotate(90deg)}
.ex .exb{padding:0 18px 18px;display:grid;gap:14px}
@media (max-width:520px){.ex > summary,.ex .exb{padding-left:12px;padding-right:12px}}
.enun{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:.95rem}
.enun b.lbl,.lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.calc{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.calc > header{background:var(--surface-2);color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;flex-wrap:wrap}
.calc > header button{background:var(--yellow);color:#16191B;border:0;border-radius:2px;padding:3px 9px;font-family:var(--f-mono);font-size:.72rem;font-weight:600}
.inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.inputs label{display:grid;gap:3px;font-size:.78rem;color:var(--muted)}
.inputs input,.inputs select{font:inherit;font-family:var(--f-mono);font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.inputs input:focus{border-color:var(--blue)}
.calcout{padding:12px;display:grid;gap:8px}
.cstep{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.cstep:last-child{border-bottom:0}
.cstep .i{font-family:var(--f-mono);font-size:.72rem;background:var(--surface-2);color:var(--ink);width:22px;height:22px;display:grid;place-items:center;border-radius:2px}
.cstep .l{font-weight:600}
.cstep .r{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cstep .f{grid-column:2 / 4;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);overflow-x:auto;white-space:nowrap}
.cstep .why{grid-column:2 / 4;font-size:.86rem;color:var(--muted)}
.final{background:var(--yellow-soft);border:1px solid var(--yellow);border-radius:6px;padding:10px 12px;font-weight:600}
.final .mono{font-weight:600}
.optable input{width:80px}
.optable td{white-space:nowrap}

/* test */
.qtoolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:.85rem;background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:6px}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600;font-size:.92rem}
.btn.y{background:var(--yellow);color:#16191B}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qlist{display:grid;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px}
@media (max-width:520px){.q{padding:14px 12px}}
.q .qh{display:flex;gap:10px;align-items:baseline}
.q .qn{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.q .qt{font-weight:600}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .lt{font-family:var(--f-mono);font-size:.75rem;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.expl{font-size:.92rem;border-left:4px solid var(--ok);padding:6px 12px;background:var(--surface-2)}
.expl.ko{border-color:var(--bad)}
.timer{font-family:var(--f-mono);font-size:1.8rem;font-weight:600;line-height:1}
.simbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,52px));z-index:9;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.result{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px}
.result .big{font-size:2.6rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;max-width:720px}
.setup .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

/* desarrollo */
.open{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px}
.open textarea{font:inherit;font-size:.95rem;width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface-2);color:var(--ink);resize:vertical}
.model{border-top:2px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.keys{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.keys label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.keys input{margin-top:4px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px}
footer.foot{color:var(--muted);font-size:.8rem;font-family:var(--f-mono);border-top:1px solid var(--line);padding-top:12px;margin-top:20px}

/* repaso */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.card .f{font-weight:600;font-size:.93rem}
.card .b{font-family:var(--f-mono);font-size:.85rem}
.card .st{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card .acts button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:.8rem}
.card.ok{border-color:var(--ok)}
.traps{margin:0;padding:0;list-style:none;display:grid;gap:0;border-top:1px solid var(--line)}
.traps li{padding:10px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
details.fx{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.fx > summary{cursor:pointer;padding:12px 16px;font-weight:600}
.maphint{margin-block:4px}
details.fx > div{padding:0 16px 16px;display:grid;gap:12px}
details.fx .sec{border:0;padding:0;background:none}

/* v3: formato */
.open .qn{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.open > b{font-size:1.02rem}
.open textarea{min-height:120px;background:var(--surface)}

const JH='<b class="src jh">JH</b>', PR='<b class="src pr">PROF</b>', XL='<b class="src xl">EXCEL</b>';
const TOPICS=[];

TOPICS.push({
id:'ud1a',code:'1A',loc:'PASILLO 1 · NIVEL A',color:'#E07A2E',
title:'Organización y clasificación de flotas',
blurb:'Departamento de tráfico, organigrama, tamaños de flota, categorías M/N/O, RGV, mercancías, masas y dimensiones, viajeros.',
study:[
{id:'trafico',h:'Departamento de tráfico',html:`
<p>${JH}${PR} Es la sección de la empresa donde <b>se inicia la contratación</b> de los servicios de transporte entre cliente y empresa, y su ejecución. Lo que hace se llama <b>gestión del transporte</b> y tiene cinco etapas en este orden:</p>
<ol class="steps"><li>Recepción de pedidos.</li><li>Planificación de rutas.</li><li>Asignación de vehículos.</li><li>Preparación de la documentación que acompaña al transporte.</li><li>Realización del servicio.</li></ol>
<div class="call porque"><b>Por qué este orden</b>No puedes asignar un vehículo sin saber la ruta (la ruta fija distancias, tiempos y carga), y no puedes hacer la documentación sin saber qué vehículo y conductor van (permiso, autorización, matrícula). Si te desordenan las etapas en el test, razona con esta dependencia.</div>
<p>${PR} El transporte tiene tres ámbitos en la asignatura: <b>mercancías por carretera</b>, <b>viajeros</b> y <b>elementos de manutención</b>. Toda la unidad 1 (clasificación y documentación) se repite para los tres.</p>`},
{id:'organigrama',h:'Organigrama y funciones',html:`
<p>${PR} Dirección → departamentos (tráfico, producción, logística, administración…). Dentro de tráfico, el <b>jefe de tráfico</b> manda sobre el auxiliar de tráfico, los chóferes y el mozo de almacén. El director de transporte está por encima, en el nivel estratégico.</p>
<div class="tw"><table><thead><tr><th>Puesto</th><th>Nivel</th><th>Qué hace</th><th>Documentos que maneja</th></tr></thead><tbody>
<tr><td><b>Director de transporte</b></td><td>Estratégico</td><td>No lleva el día a día. Define la política comercial, decide <b>flota propia o subcontratar</b>, selecciona proveedores para rutas largas o especiales, recibe el feedback de calidad, capta clientes, analiza indicadores, colabora en presupuestos y responde del cumplimiento de la legislación.</td><td>Tarifas de proveedores, presupuestos, pólizas de seguro, ofertas a clientes</td></tr>
<tr><td><b>Jefe de tráfico</b></td><td>Operativo (puente)</td><td>Responsable del departamento: <b>resuelve las incidencias</b> en la contratación de servicios. Contrata servicios (propios y subcontratados), los asigna, vigila el estado de los vehículos (ITV, mantenimiento), sigue el servicio en contacto con los chóferes, informa al cliente de incidencias y supervisa trabajo y gastos del personal (vacaciones, bajas, dietas, peajes, combustible).</td><td>Órdenes de transporte, tarifas, mapas de carretera</td></tr>
<tr><td><b>Auxiliar de tráfico</b></td><td>Administrativo</td><td>Apoyo, <b>no toma decisiones</b>. Recibe los pedidos, llama al cliente para verificar datos, comprueba los albaranes, <b>factura</b>, informa de problemas y archiva.</td><td>Nota de recogida, albaranes, facturas</td></tr>
<tr><td><b>Mozo de almacén</b></td><td>Logística interna</td><td>Recibe y coloca mercancía, controla la llegada del equipo, vigila los elementos de aseguramiento de la carga (cinchas, barras) y los lleva al muelle o al chófer. Informa al jefe de tráfico.</td><td>Listados de equipo</td></tr>
<tr><td><b>Chófer</b></td><td>Ejecución</td><td>Carga, descarga y transporta. Porta la documentación y hace firmar al cliente, se responsabiliza del mantenimiento de su vehículo, comprueba que la carga coincide con la documentación y comunica incidencias.</td><td>Mapa, albaranes, justificantes de entrega</td></tr>
</tbody></table></div>
<div class="call ojo"><b>Ojo examen</b>La pregunta típica es "¿quién…?". Decide subcontratar → director. Resuelve incidencias de contratación y asigna servicios → jefe de tráfico. Factura y verifica albaranes → auxiliar. Elementos de aseguramiento → mozo. Revisar que la carga coincide con el albarán → chófer. Vigilar ITV y mantenimiento de la flota → jefe de tráfico (el chófer solo cuida <i>su</i> vehículo).</div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes coinciden en lo esencial. Añade dos cosas de la profesora: el director también <b>analiza KPIs y colabora en presupuestos</b>, y el jefe de tráfico es "el puente entre la estrategia del director y el trabajo del personal".</div>`},
{id:'tamano',h:'Flota y tamaño de flota',html:`
<p>${JH}${PR} <b>Flota</b>: conjunto de vehículos destinados a transportar mercancías o personas que <b>dependen económicamente de la misma empresa</b>.</p>
<div class="tw"><table><thead><tr><th>Tamaño</th><th>Vehículos</th><th>Rasgos (profesora)</th></tr></thead><tbody>
<tr><td>Pequeña</td><td class="n">5 – 6</td><td>Empresa familiar: un autónomo con algunos conductores familiares o asalariados. Trabaja sobre todo para <b>un cliente o una gran empresa</b>. El responsable de tráfico suele ser <b>el propietario</b>.</td></tr>
<tr><td>Mediana</td><td class="n">6 – 30</td><td>Familiares que han crecido a nuevos mercados, clientes nacionales e internacionales. Tráfico lo lleva una <b>persona de confianza de la dirección</b>. Pueden tener talleres propios, almacenes y depósitos de carburante.</td></tr>
<tr><td>Grande</td><td class="n">elevado</td><td>Vehículos propios o subcontratados, <b>varias delegaciones</b> por el país, vehículos de distintos tipos según el servicio. Las de vehículos industriales suelen especializarse en un servicio.</td></tr>
</tbody></table></div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes dicen que las medianas "pueden hacer incluso el mantenimiento"; la profesora lo formula como "pueden llegar a tener sus propios talleres de reparación, almacenes y depósitos de carburante". Fíjate también en que 6 vehículos aparece en los dos rangos: el criterio no es solo el número, sino el tipo de empresa y de clientes.</div>`},
{id:'ue',h:'Reglamento (UE) 2018/858: categorías M, N y O',html:`
<p>${PR} Regula qué vehículos pueden <b>fabricarse y venderse</b> en la UE (homologación y vigilancia del mercado). Es el "<b>nacimiento</b>" del vehículo: diseño, seguridad, emisiones, conformidad de producción.</p>
<div class="grid2">
<div class="mini"><h4>M · personas y equipaje</h4><p><b>M1</b>: máx. 8 plazas + conductor, sin pasajeros de pie.<br><b>M2</b>: más de 8 + conductor, MMA ≤ 5 t, puede llevar de pie.<br><b>M3</b>: como M2 pero MMA &gt; 5 t.</p></div>
<div class="mini"><h4>N · mercancías</h4><p><b>N1</b>: MMA ≤ 3,5 t.<br><b>N2</b>: 3,5 t &lt; MMA ≤ 12 t.<br><b>N3</b>: MMA &gt; 12 t.</p></div>
<div class="mini"><h4>O · remolques</h4><p><b>O1</b>: ≤ 0,75 t · <b>O2</b>: 0,75–3,5 t · <b>O3</b>: 3,5–10 t · <b>O4</b>: &gt; 10 t.</p></div>
<div class="mini"><h4>Truco de memoria</h4><p>Los cortes de N y O comparten 3,5 t. N añade 12 t; O añade 0,75 t y 10 t. M usa plazas (8) y 5 t.</p></div>
</div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes solo dan M, N y O. En el test pueden pedirte la subcategoría (N2, O3, M2…), así que apréndete la tabla de cortes.</div>`},
{id:'rgv',h:'RD 2822/1998, Reglamento General de Vehículos (RGV)',html:`
<p>${JH}${PR} Regula cómo se <b>usan</b> los vehículos en España: su "<b>vida técnica</b>" (matriculación, ITV, impuestos, permisos). En su <b>Anexo II</b> los clasifica por cuatro criterios:</p>
<div class="tw"><table><thead><tr><th>Apartado</th><th>Criterio</th><th>Cómo aparece en el código</th></tr></thead><tbody>
<tr><td>A</td><td>Definición</td><td>Camión, furgón, tractocamión, remolque…</td></tr>
<tr><td>B</td><td>Construcción</td><td><b>Primer grupo de dos cifras</b></td></tr>
<tr><td>C</td><td>Utilización</td><td><b>Segundo grupo de dos cifras</b></td></tr>
<tr><td>D</td><td>Servicio</td><td>Una <b>letra</b> (A público / B privado) + <b>dos cifras</b></td></tr>
</tbody></table></div>
<h4>B · Construcción (los que salen en clase)</h4>
<div class="tw"><table><tbody>
<tr><td class="n">20</td><td>Camión MMA ≤ 3.500 kg</td><td class="n">24</td><td>Furgón MMA ≤ 3.500 kg</td></tr>
<tr><td class="n">21</td><td>Camión 3.500 &lt; MMA ≤ 12.000</td><td class="n">25</td><td>Furgón 3.500 &lt; MMA ≤ 12.000</td></tr>
<tr><td class="n">22</td><td>Camión MMA &gt; 12.000</td><td class="n">26</td><td>Furgón MMA &gt; 12.000</td></tr>
<tr><td class="n">23</td><td>Tractocamión</td><td class="n">40–43</td><td>Remolque/semirremolque: 40 ≤ 750 · 41 750–3.500 · 42 3.500–10.000 · 43 &gt; 10.000</td></tr>
</tbody></table></div>
<p>Camión = cabina <b>no integrada</b> en la carrocería (hasta 9 plazas). Furgón = cabina <b>integrada</b>.</p>
<h4>C · Utilización (ejemplos de la diapositiva)</h4>
<p><b>24</b> refrigerante (isotermo con fuente de frío no mecánica) · <b>25</b> frigorífico (isotermo con equipo de frío propio, mantiene temperatura de forma permanente) · <b>26</b> calorífico · <b>27</b> cisterna (granel líquido o gas licuado). En total 79 tipos, 14 de mercancías.</p>
<h4>D · Servicio</h4>
<div class="tw"><table><thead><tr><th>Letra</th><th>Tipo</th><th>Ejemplos</th></tr></thead><tbody>
<tr><td><b>A · Público</b><br><small>por cuenta ajena, con autorización administrativa, cobra</small></td><td>Regular (itinerario y calendario fijos) / Discrecional (sin horario fijo)</td><td>Autobús de línea, escolar, tren / taxi, excursión, camión contratado para una carga</td></tr>
<tr><td><b>B · Privado</b><br><small>por cuenta propia</small></td><td>Particular / Complementario (empresa cuya actividad principal no es el transporte)</td><td>Tu coche / autobús de fábrica para trabajadores, furgonetas de fontanería, reparto de un supermercado con flota propia</td></tr>
</tbody></table></div>
<p>Dos cifras de servicio vistas: <b>07</b> ambulancia · <b>08</b> funerario · <b>09</b> obras · <b>10</b> mercancías peligrosas · <b>11</b> basurero · <b>12</b> transporte escolar · <b>18</b> actividad económica (≤ 3.500 kg afecto a una actividad económica).</p>
<div class="call ojo"><b>Ojo examen</b>"Mercancías peligrosas" y "escolar" se marcan en el <b>servicio (D)</b>, aunque no sea exclusivo. "Cisterna" o "frigorífico" van en <b>utilización (C)</b>. Un supermercado que reparte lo suyo es <b>privado complementario</b>, no público, aunque mueva mucha mercancía.</div>`},
{id:'merc',h:'Vehículos de mercancías',html:`
<p><b>A. Por definición</b> ${JH}${PR}</p>
<ul>
<li><b>Camión</b>: ≥ 4 ruedas, cabina <b>no integrada</b>, máx. 9 plazas. Rígido o articulado.</li>
<li><b>Furgón/furgoneta</b>: cabina <b>integrada</b> en la carrocería, máx. 9 plazas.</li>
<li><b>Tractocamión</b> (cabeza tractora): hecho para arrastrar un semirremolque.</li>
<li><b>Remolque</b>: no autopropulsado, <b>no apoya</b> peso en el tractor.</li>
<li><b>Semirremolque</b>: no autopropulsado, <b>apoya parte sustancial de su masa</b> en el tractor.</li>
<li><b>Camión rígido</b>: cabina y caja forman un conjunto rígido, pero separadas físicamente (eso lo distingue del furgón).</li>
<li><b>Vehículo articulado / tráiler</b>: vehículo de motor + <b>semirremolque</b>.</li>
<li><b>Tren de carretera</b>: vehículo de motor + <b>remolque</b>. Habitual 18,75 m y 36–40 t.</li>
<li><b>Euro-modular</b> (Orden PJC/780/2025): más de 6 líneas de ejes o al menos 3 módulos que por separado cumplen los límites. Hasta 32 m y 72 t (datos de la norma antigua). Solo por itinerarios designados; ya no necesita autorización especial, basta cumplir requisitos técnicos (Resolución DGT 21/10/2025).</li>
</ul>
<div class="call ojo"><b>Ojo examen</b>Articulado = <b>semi</b>rremolque. Tren de carretera = <b>remolque</b>. Es la confusión más típica.</div>
<p><b>B. Por la forma de organizar la carga</b>: <b>general</b> (se cuentan bultos: con embalaje, suelta sin embalaje como tubos o planchas, o unitarizada en un solo bulto), <b>granel</b> (sin embalaje: sólido, líquido, gas) y <b>especial</b> (por condiciones, propiedades o peligrosidad: maquinaria industrial, explosivos).</p>
<p><b>C. Por su utilización</b>: el RGV recoge 79 tipos (14 de mercancías: botellero, portacontenedores, jaula, cisterna, silo, isotermo, frigorífico…). El Reglamento UE recoge 32 (plataforma, caja cerrada, volquete, hormigonera…). Silo = granel sólido pulverulento o granuloso; cisterna = granel líquido o gas licuado; isotermo = paredes aislantes; frigorífico = isotermo que además baja y mantiene la temperatura.</p>
<p><b>D. Masas y dimensiones</b> (Anexo IX RGV, modificado por la Orden PJC/780/2025)</p>
<ul><li><b>Tara</b>: masa en vacío con equipo fijo, depósitos llenos, herramientas y repuestos, <b>sin personal, pasajeros ni carga</b>.</li><li><b>MMA</b>: masa máxima para circular con carga por vías públicas.</li><li><b>Dimensiones máximas autorizadas</b>: las del anexo, medidas según la homologación.</li></ul>
<div class="tw"><table><thead><tr><th>Masas máximas</th><th class="n">t</th><th>Dimensiones</th><th class="n">m</th></tr></thead><tbody>
<tr><td>Motor 2 ejes</td><td class="n">18</td><td>Longitud vehículo de motor</td><td class="n">12</td></tr>
<tr><td>Motor 3 ejes</td><td class="n">25 (26)</td><td>Articulado</td><td class="n">16,50</td></tr>
<tr><td>Rígido 4 ejes</td><td class="n">32 (31)</td><td>Tren de carretera</td><td class="n">18,75</td></tr>
<tr><td>Articulado 4 ejes</td><td class="n">36 (38)</td><td>Euro-modular</td><td class="n">32</td></tr>
<tr><td>Articulado 5 o más ejes</td><td class="n">44</td><td>Anchura general</td><td class="n">2,55 (2,60)</td></tr>
<tr><td>Tren de carretera 5+ ejes</td><td class="n">42/44</td><td>Altura general</td><td class="n">4,00 (4,50)</td></tr>
<tr><td>Euro-modular</td><td class="n">72</td><td>Autobús rígido 2 ejes / &gt;2 / articulado</td><td class="n">13,5 / 15 / 18,75</td></tr>
</tbody></table></div>
<p>Novedades PJC/780/2025: altura hasta <b>4,5 m</b> para transportes concretos (animales vivos, paja…), hasta <b>44 t</b> en ciertos articulados y trenes, <b>+1–2 t</b> de MMA para vehículos cero emisiones, y euro-modulares sin autorización especial. Entre paréntesis: valores con suspensión neumática/ruedas gemelas o vehículos acondicionados.</p>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes dejan las masas en definiciones. La profesora añade cifras y la orden de 2025; en un test de cifras te pueden preguntar 16,50 / 18,75 / 44 t / 4,5 m.</div>`},
{id:'viaj',h:'Transporte de viajeros',html:`
<p>${JH}${PR} Ley 16/1987 (LOTT) y Ley 1/2014. Cuatro criterios + tipos de autobús:</p>
<div class="tw"><table><thead><tr><th>Criterio</th><th>Clases</th></tr></thead><tbody>
<tr><td>Naturaleza</td><td><b>Público</b> (por cuenta ajena, con contraprestación) / <b>privado</b> (cuenta propia: particular o complementario)</td></tr>
<tr><td>Ámbito</td><td><b>Urbano</b> (dentro de un término municipal) / <b>interurbano</b> (más de uno)</td></tr>
<tr><td>Continuidad</td><td><b>Regular</b> (itinerario, calendario y horario fijos; permanente o temporal) / <b>discrecional</b> (sin sujeción) / <b>a la demanda</b> (contratación por plaza y cobro individual)</td></tr>
<tr><td>Utilización</td><td><b>Uso general</b> (cualquier persona) / <b>uso especial</b> (grupo homogéneo: escolares, trabajadores, dependientes) / <b>turístico</b> (parte de un viaje organizado)</td></tr>
</tbody></table></div>
<p><b>Autobús</b>: más de 9 plazas incluido el conductor (categoría M3 en la diapositiva). Tipos: <b>articulado</b> (dos secciones rígidas unidas, "gusano"), <b>dos pisos</b> (en el piso superior todas las plazas son sentadas), <b>mixto</b> (personas y mercancías en dos compartimentos, p. ej. equipos ciclistas).</p>
<div class="call porque"><b>Por qué importa</b>Esta clasificación decide después la documentación de 1C: regular de uso general necesita libro de reclamaciones y no hoja de ruta; discrecional necesita autorización VD y hoja de ruta.</div>`}
],

{id:'1a-sp1',tag:'SP 1 · PROF',title:'Clasificar cuatro vehículos con el RGV',
enun:`Tomando como base el RD 2822/1998, clasifica:<ol><li>Rígido de 3 ejes, MMA 26.000 kg, cisterna, combustibles líquidos (MMPP). Empresa transportista que sirve a terceros.</li><li>3.200 kg de MMA, cabina integrada, 2 plazas. Reparto de paquetes en ciudad por una empresa de mensajería.</li><li>Autobús de 45 plazas, carrocería rígida, rutas fijas escolares. Empresa con autorización administrativa.</li><li>Tractocamión (2 ejes) + semirremolque frigorífico MMA 33 t. Fruta propia de una cooperativa del campo a centros logísticos.</li></ol>`,
plan:`Método en cinco preguntas para cada vehículo: (1) ¿cabina integrada? → camión o furgón; ¿arrastra un semi? → tractocamión. (2) Tramo de MMA → cifra de construcción. (3) Carrocería → cifra de utilización. (4) ¿Cobra a terceros con autorización? → A público; ¿mueve lo suyo? → B privado. (5) ¿Servicio específico? → 10 MMPP, 12 escolar, 18 actividad económica.`,
sol:`<div class="tw"><table><thead><tr><th>#</th><th>Construcción</th><th>Utilización</th><th>Servicio</th><th>Razonamiento</th></tr></thead><tbody>
<tr><td>1</td><td class="n">22</td><td class="n">27</td><td>A · 10</td><td>Camión de &gt; 12 t (cabina no integrada en un rígido) → 22. Cisterna → 27. Sirve a terceros → público (discrecional). Combustible → mercancías peligrosas, código 10. UE: N3.</td></tr>
<tr><td>2</td><td class="n">24</td><td>caja (cerrada)</td><td>A · 18</td><td>Cabina integrada y ≤ 3.500 kg → furgón 24. Mensajería cobra a terceros → público. Al ser ≤ 3.500 kg y estar afecto a una actividad económica encaja en el 18. UE: N1.</td></tr>
<tr><td>3</td><td>autobús (M3)</td><td>—</td><td>A · 12</td><td>Más de 9 plazas → autobús, categoría M3 en la UE. Rutas fijas con autorización → público regular de uso especial. Escolar → código 12.</td></tr>
<tr><td>4</td><td class="n">23 + 43</td><td class="n">25</td><td>B · complementario</td><td>Tractocamión 23; semirremolque &gt; 10 t → 43; frigorífico → 25. Fruta propia de la cooperativa (su actividad no es el transporte) → privado complementario. UE: N3 + O4.</td></tr>
</tbody></table></div>
<div class="call ojo"><b>Lo que no dan las diapositivas</b>Las tablas de clase no muestran el código de construcción del autobús ni la cifra de utilización de "caja", así que en esos dos casos razona con palabras (M3, caja cerrada) en vez de inventar un número. Las cifras 22, 23, 24, 25, 27, 43, 10, 12 y 18 sí salen en las diapositivas.</div>`,
calc:{id:'clasif',preset:{tipo:'merc',mma:26000,cab:'no',plazas:3}}},

open:[
{q:'Explica la diferencia entre el Reglamento (UE) 2018/858 y el RD 2822/1998 y para qué sirve cada uno.',keys:['UE 2018/858 = homologación: qué puede fabricarse y venderse en la UE ("nacimiento")','Clasifica en M, N, O con subcategorías por plazas o MMA','RD 2822/1998 = RGV: uso en España ("vida técnica": matrícula, ITV, impuestos, permisos)','Anexo II: definición, construcción (1.ª cifra), utilización (2.ª cifra), servicio (letra + 2 cifras)'],
a:`El Reglamento europeo regula el <b>nacimiento</b> del vehículo: cómo debe diseñarse, fabricarse y homologarse para poder venderse en la UE (seguridad, emisiones, conformidad de producción), y lo clasifica en categorías M (personas), N (mercancías) y O (remolques) con cortes de plazas y MMA. El RD 2822/1998 es el Reglamento General de Vehículos y regula su <b>vida técnica en España</b>: matriculación, ITV, impuestos y permisos. En su anexo II clasifica por definición, construcción (primer par de cifras), utilización (segundo par) y servicio (letra A público / B privado más dos cifras). Uno dice si el vehículo puede existir en el mercado; el otro, cómo se usa y controla aquí.`},
{q:'Una cadena de supermercados reparte a sus tiendas con camiones propios y conductores en plantilla. ¿Qué tipo de servicio es según el RGV y por qué no es público?',keys:['Privado complementario (B)','La actividad principal de la empresa no es el transporte','Transporta mercancía propia, sin cobrar a terceros','Público exige transportar para otros con autorización y cobrar'],
a:`Es <b>servicio privado complementario (B)</b>. El servicio público consiste en transportar para otros con autorización administrativa y a cambio de precio. El supermercado mueve su propia mercancía, con vehículo, conductor y carga de la misma empresa, y su actividad principal es vender, no transportar. Que mueva mucho volumen no lo convierte en público. En 1C esto se traduce en una autorización MPC, no MDP/MDL.`},
{q:'Compara las funciones del director de transporte y del jefe de tráfico. ¿Quién decide externalizar una ruta y quién gestiona que un camión no ha pasado la ITV?',keys:['Director: nivel estratégico, no día a día','Director decide flota propia o subcontratar y elige proveedores','Jefe de tráfico: responsable operativo y puente con el personal','Jefe de tráfico vigila ITV/mantenimiento y reasigna el servicio'],
a:`El director trabaja a nivel <b>estratégico</b>: política comercial, flota propia o subcontratación, selección de proveedores, presupuestos, KPIs y cumplimiento legal. El jefe de tráfico es el <b>responsable operativo</b> del departamento: contrata y asigna servicios, resuelve incidencias, vigila el estado de los vehículos y supervisa al personal. Externalizar una ruta es una decisión del director; un camión sin ITV es un problema operativo del jefe de tráfico, que tiene que retirarlo y reasignar el servicio.`}
]

id:'ud1b',code:'1B',loc:'PASILLO 1 · NIVEL B',color:'#2E8B7A',
title:'Medios de manutención',
blurb:'Transpaletas, apiladores, carretillas, preparadoras, transelevador, miniload, 3D shuttle, AGV y AMR, y cómo elegir.',
study:[
{id:'clas',h:'Clasificación de los medios de manutención',html:`
<p>${PR} Primer corte: ¿el equipo se desplaza por el almacén o trabaja fijo?</p>
<div class="grid2">
<div class="mini"><h4>1. Se mueven pero no se trasladan</h4><p>Cintas transportadoras, transporte aéreo, puentes grúa y elementos auxiliares (polipastos, cabrestantes).</p></div>
<div class="mini"><h4>2. Se mueven y se trasladan</h4><p><b>Interno</b>: transpaleta, apilador, carretillas (contrapesada, retráctil, retráctil doble profundidad, bilateral, trilateral, remolcadora), preparadoras de pedidos, carros de picking, sistemas automáticos (transelevador, miniload, 3D shuttle) y autoguiados (AGV, AMR).<br><b>Externo</b>: carretillas elevadoras y maquinaria de contenedores (reach stacker).</p></div>
</div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes empiezan directamente por la transpaleta; no tienen esta clasificación ni los equipos "que no se trasladan". Es una pregunta de test fácil de fallar.</div>`},
{id:'conv',h:'Equipos con operario: datos clave',html:`
<div class="tw"><table><thead><tr><th>Equipo</th><th>Capacidad</th><th>Altura</th><th>Pasillo / clave</th><th>Cuándo usarlo</th></tr></thead><tbody>
<tr><td><b>Transpaleta manual</b></td><td class="n">≤ 2.000 kg</td><td class="n">≤ 200 mm</td><td>Giro ~1,35 m, cabe dentro del camión. Bomba hidráulica + timón</td><td>Carga/descarga, uso esporádico, distancias &lt; 40 m, apoyo al picking. Límite: fatiga y baja eficiencia continua</td></tr>
<tr><td><b>Transpaleta eléctrica</b></td><td class="n">≤ 2.000 kg</td><td>—</td><td>4–12 km/h. Acompañante, plataforma o sentado</td><td>Ciclos constantes, distancias medias/largas (40–50 m), alta frecuencia</td></tr>
<tr><td><b>Apilador</b></td><td class="n">≤ 2.000 kg</td><td class="n">≤ 5,5 m</td><td>Transpaleta eléctrica con mástil, 6–9 km/h</td><td>Apilar a media altura en almacenes con poca planta</td></tr>
<tr><td><b>Contrapesada</b></td><td class="n">2,5 t eléctr. · 6 t+ térmica</td><td class="n">6–7 m</td><td>Horquillas en voladizo, contrapeso trasero. Ruedas neumáticas (exterior), macizas (interior liso, precisión), superelásticas (intermedio)</td><td>Muelles, carga/descarga intensiva, interior y exterior. No en plantas superiores (pesa mucho)</td></tr>
<tr><td><b>Retráctil</b></td><td class="n">≤ 2,5 t</td><td class="n">≤ 14 m</td><td>Pasillo ~<b>2,8 m</b>. El mástil retrocede entre los largueros. Eléctrica, interior, ruedas macizas</td><td>Almacenes de altura con productividad</td></tr>
<tr><td><b>Retráctil doble profundidad</b></td><td>—</td><td>—</td><td>Horquillas telescópicas, 2.º palé en profundidad, frontal. Requiere precisión y cámaras</td><td>Más densidad, menos pasillos</td></tr>
<tr><td><b>Bilateral</b></td><td>—</td><td>—</td><td>Cabezal gira 90°, ambos lados sin maniobrar</td><td>Alta densidad, pasillos muy estrechos</td></tr>
<tr><td><b>Trilateral</b></td><td>—</td><td class="n">≤ 18 m</td><td>Pasillo <b>1,5–2,2 m</b> (hasta 1,60). Deja a izquierda, derecha y frente. <b>Hombre abajo</b> (torre) u <b>hombre arriba</b> (combi: apila y hace picking)</td><td>Máxima densidad con operario</td></tr>
<tr><td><b>Remolcadora</b></td><td>&gt; 25 t de arrastre</td><td>sin mástil</td><td>No eleva, arrastra carros</td><td>Trenes logísticos / milk-run, automoción, aeropuertos, hospitales</td></tr>
<tr><td><b>Preparadora de pedidos</b></td><td>—</td><td>bajo ≤ 3 · medio ≤ 6 · alto ≤ 12 m</td><td>El operario sube con la cabina en las de nivel medio y alto. Las de 12 m (combi) son alternativa a la trilateral en picking</td><td>Picking de producto suelto</td></tr>
<tr><td><b>Carros de picking</b></td><td>—</td><td>a pie</td><td>Sustituyen a la preparadora si el operario llega a pie a todas las alturas</td><td>Picking manual ligero</td></tr>
</tbody></table></div>
<div class="call porque"><b>Por qué la retráctil gana a la contrapesada dentro del almacén</b>Al llevar el mástil hacia atrás, el centro de gravedad queda dentro de la máquina: necesita menos contrapeso, es más corta y gira en menos espacio. Eso permite pasillos de ~2,8 m y subir a 14 m. La contrapesada es mejor fuera y en muelles porque es robusta y versátil.</div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes no incluyen: elevación de 200 mm y &lt; 40 m de la transpaleta, el pasillo de 2,8 m de la retráctil, el pasillo de 1,5–2,2 m de la trilateral ni la diferencia hombre abajo/hombre arriba. Todo eso es material de test.</div>`},
{id:'auto',h:'Sistemas automáticos y autoguiados',html:`
<div class="tw"><table><thead><tr><th>Sistema</th><th>Carga</th><th>Altura</th><th>Datos</th><th>Pros / contras</th></tr></thead><tbody>
<tr><td><b>Transelevador (AS/RS)</b></td><td>Palés completos</td><td class="n">40–45 m</td><td>Pasillo 1,5–2 m, hasta 150 m de largo. 200 m/min traslación, 60 m/min elevación. <b>1 pasillo = 1 equipo</b>. Almacenes autoportantes</td><td>Máximo espacio y altura, precisión, menos mano de obra. Poco adaptable a cambios de layout o SKU, no sale de su pasillo, inversión alta y obra civil</td></tr>
<tr><td><b>Miniload</b></td><td>Cajas ≤ <b>250 kg</b></td><td class="n">≤ 20 m</td><td>250 m/min traslación, 100 m/min elevación</td><td>Picking automático de piezas pequeñas, e-commerce, alta rotación de ligeros</td></tr>
<tr><td><b>3D shuttle</b></td><td>Palés o cajas</td><td class="n">20–30 m</td><td>Se mueve en 3 ejes, cambia de pasillo y nivel. Se añaden shuttles cuando crece la demanda</td><td>Máxima flexibilidad y escalabilidad, picos de demanda. Inversión alta, software avanzado (WMS)</td></tr>
<tr><td><b>AGV</b></td><td>Palés/cajas</td><td>—</td><td>Sin conductor, <b>recorrido preprogramado</b>: óptico/magnético (filoguiado) o cable inductivo; el láser permite correcciones</td><td>Barato de operar, fiable en recorridos definidos. Poco flexible si cambia el entorno</td></tr>
<tr><td><b>AMR</b></td><td>Palés/cajas</td><td>—</td><td>Navega con mapas, sensores, cámaras y láser, sin infraestructura</td><td>Esquiva obstáculos, recalcula, entornos cambiantes, integración MES/WMS</td></tr>
</tbody></table></div>
<div class="call ojo"><b>Ojo examen: selectivo vs denso</b>Un transelevador es <b>100 % selectivo</b>: puede sacar cualquier palé en cualquier momento. Un shuttle es <b>denso pero no selectivo</b>: cada canal suele llevar una sola referencia, porque los palés de delante bloquean a los de detrás.</div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes dicen "miniload… para cargas ligeras" sin cifra: son <b>250 kg</b>. Y dicen que el AGV "dispone de un láser"; según la profesora, el láser es un tipo de navegación (abierta) entre otras (óptica, magnética, cable).</div>`},
{id:'elegir',h:'Cómo elegir el equipo (método de examen)',html:`
<p>Los supuestos de esta unidad no son numéricos: te dan un almacén y preguntan qué equipo. Razona por <b>restricciones duras primero</b> y luego por uso:</p>
<ol class="steps">
<li><b>Unidad de carga y peso</b>: palé (≤ 2 t transpaleta/apilador, 2,5 t retráctil) o caja ligera (≤ 250 kg miniload).</li>
<li><b>Altura</b>: ≤ 5,5 apilador · 6–7 contrapesada · ≤ 14 retráctil · ≤ 18 trilateral · 20 miniload · 20–30 shuttle · 40–45 transelevador.</li>
<li><b>Ancho de pasillo</b>: ~2,8 m retráctil · 1,5–2,2 m trilateral / transelevador.</li>
<li><b>Interior o exterior y suelo</b>: exterior y muelles → contrapesada (térmica si es intensivo, ruedas neumáticas).</li>
<li><b>Frecuencia y distancia</b>: &lt; 40 m esporádico → transpaleta manual; ciclos constantes 40–50 m → eléctrica; recorrido horizontal repetitivo → AGV (o AMR si cambia el entorno).</li>
<li><b>Tipo de tarea</b>: picking de suelto → preparadora o carro; alimentación de línea → remolcadora.</li>
</ol>
<div class="call porque"><b>Pensamiento crítico</b>Justifica también lo que descartas. "Retráctil porque el pasillo de 3 m no admite contrapesada y 8 m está dentro de sus 14 m" puntúa más que "retráctil".</div>`}
],

exercises:[
{id:'1b-beb',tag:'SP · PROF',title:'Distribuidor de bebidas',
enun:`Almacén de 3.000 m². Palés de 1.000–1.200 kg, estanterías de 8 m, pasillos de 3 m, alta rotación con mucha carga y descarga de camiones, y picking de cajas pequeñas en niveles bajos.<br>1) ¿Equipo para cargar y descargar en muelles? 2) ¿Equipo para colocar palés en altura en pasillos de 3 m? 3) ¿Tecnología para automatizar el transporte horizontal repetitivo entre muelles y estanterías?`,
plan:`Aplica el método de restricciones: peso (1,2 t, cualquier equipo de palé vale), altura (8 m descarta apilador y contrapesada), pasillo (3 m encaja con la retráctil), y la palabra "repetitivo" que apunta a autoguiados.`,
sol:`<ol><li><b>Muelles</b>: con alta rotación, <b>transpaleta eléctrica</b> (ciclos constantes, entra en el camión) o <b>contrapesada eléctrica</b> si hay que subir a la caja o trabajar en el exterior. La manual se descarta por la intensidad (fatiga, baja eficiencia).</li><li><b>Altura de 8 m en pasillo de 3 m</b>: <b>carretilla retráctil</b>. Llega hasta 14 m, trabaja en pasillos de ~2,8 m y lleva 2,5 t. La contrapesada no llega bien a 8 m (6–7 m) y necesita más pasillo; la trilateral sería sobredimensionar para 3 m de pasillo.</li><li><b>Horizontal repetitivo</b>: <b>AGV</b>, porque el recorrido muelle → estantería es fijo y repetitivo; si el layout cambia a menudo o hay mucho tráfico de personas, <b>AMR</b>.</li></ol><p>Para el picking de cajas en niveles bajos bastaría una <b>preparadora de nivel bajo</b> o carros de picking.</p>`},
{id:'1b-moda',tag:'SP · PROF',title:'Operador de moda online',
enun:`15.000 referencias en cajas ligeras. Picking intensivo y variado, estanterías de hasta 12 m, pasillos de 2 m, mucha preparación en niveles bajos y medios.<br>1) ¿Equipo para picking en niveles bajos y medios? 2) ¿Sistema automático más eficiente para el picking de cajas ligeras?`,
plan:`Cajas ligeras + muchas referencias + picking intensivo = carga pequeña, alta rotación. El pasillo de 2 m descarta la retráctil.`,
sol:`<ol><li><b>Preparadora de pedidos</b> de nivel bajo (≤ 3 m) y medio (≤ 6 m), en la que el operario sube con la cabina. El pasillo de 2 m impide la retráctil (2,8 m); si hiciera falta llegar a 12 m, una preparadora alta tipo combi o una trilateral hombre arriba.</li><li><b>Miniload</b>: diseñado para cajas ≤ 250 kg, hasta 20 m, picking automático, e-commerce y alta rotación. Un <b>3D shuttle</b> sería la alternativa si los pedidos son muy variables y hay picos (escala añadiendo shuttles), a cambio de más inversión y software.</li></ol>`},
{id:'1b-sel',tag:'PRÁCTICA',title:'Selector de equipo',
enun:`Mete las condiciones de un almacén y mira qué equipo encaja y por qué se descartan los demás. Sirve para entrenar el razonamiento de los supuestos.`,
plan:`El selector aplica las cifras de las diapositivas: altura máxima, pasillo, carga y uso.`,
sol:`Si dos equipos encajan, el examen premia elegir el menos sobredimensionado y justificarlo.`,
calc:{id:'selector',preset:{carga:'pale',peso:1200,altura:8,pasillo:3,lugar:'int',tarea:'almacenar'}}}
],
open:[
{q:'Compara transelevador y 3D shuttle: ¿cuándo elegirías cada uno?',keys:['Transelevador: palés, 40–45 m, 1 pasillo = 1 equipo','Transelevador 100 % selectivo, poco flexible, alta inversión y obra civil','Shuttle: 3 ejes, cambia de pasillo y nivel, escalable añadiendo unidades','Shuttle denso pero no selectivo (una referencia por canal)','Elección: demanda estable de palé completo → transelevador; demanda variable/picos y muchas SKU → shuttle'],
a:`El <b>transelevador</b> maneja palés completos a gran altura (40–45 m) en pasillos de 1,5–2 m, con un equipo por pasillo y acceso 100 % selectivo. Es ideal para alta frecuencia de palé completo con un flujo estable, pero es poco adaptable a cambios de layout o de SKU y exige obra civil e inversión altas. El <b>3D shuttle</b> mueve palés o cajas en los tres ejes y cambia de pasillo y nivel, así que la capacidad crece añadiendo shuttles: encaja con demanda variable, picos y muchas referencias. A cambio es denso pero no selectivo (cada canal suele llevar una referencia) y necesita un WMS avanzado. Con flujo estable de palé completo elegiría transelevador; con pedidos variables y crecimiento incierto, shuttle.`},
{q:'¿Por qué una carretilla retráctil permite pasillos más estrechos que una contrapesada? ¿Qué limita a cada una?',keys:['Retráctil: mástil retrocede entre largueros, centro de gravedad dentro','Menos longitud → pasillo ~2,8 m, hasta 14 m, 2,5 t','Contrapesada: horquillas en voladizo y contrapeso trasero, más larga','Contrapesada 6–7 m, interior/exterior, muelles; no plantas superiores','Retráctil solo interior, suelo liso, ruedas macizas'],
a:`En la contrapesada las horquillas van en voladizo por delante de las ruedas, así que necesita un contrapeso trasero que la hace larga y pesada; gira en más espacio y se queda en 6–7 m. En la retráctil el mástil se desplaza hacia atrás entre los largueros y lleva el centro de gravedad al interior de la máquina, con lo que es más corta, gira en ~2,8 m de pasillo y sube hasta 14 m con 2,5 t. A cambio, la retráctil es eléctrica, de ruedas macizas y solo para interior con suelo liso, mientras que la contrapesada trabaja en muelles y exterior (térmica, ruedas neumáticas).`},
{q:'AGV o AMR para llevar palés de producción a expedición en una fábrica que reorganiza su layout cada pocos meses. Justifica.',keys:['AGV sigue recorrido preprogramado (óptico, magnético, cable, láser)','Cambiar layout obliga a reprogramar/reinstalar guiado','AMR navega con mapas y sensores, sin infraestructura','AMR esquiva obstáculos y se adapta a entornos cambiantes','Conclusión: AMR'],
a:`Elegiría <b>AMR</b>. El AGV es fiable y barato en recorridos fijos, pero depende de una guía (banda óptica o magnética, cable enterrado o reflectores láser) y cada cambio de layout obliga a rehacerla. El AMR navega con mapas, cámaras y escáneres, sin infraestructura, recalcula rutas y esquiva obstáculos, así que absorbe los cambios con solo actualizar el mapa. Si el recorrido fuera estable durante años, el AGV sería más simple y barato.`}
]

id:'ud1c',code:'1C',loc:'PASILLO 1 · NIVEL C',color:'#B5486B',
title:'Documentación',
blurb:'Qué papeles lleva el vehículo, el conductor y la carga en mercancías, viajeros y manutención.',
study:[
{id:'mveh',h:'Mercancías: documentación del vehículo',html:`
<ol class="steps">
<li><b>Permiso de circulación</b> ${JH}${PR}: acredita que puede circular. Lo llevan vehículos a motor, ciclomotores y remolques/semirremolques de <b>MMA &gt; 750 kg</b>; los de ≤ 750 kg van con la matrícula del tractor.</li>
<li><b>Tarjeta ITV</b>: acredita las características técnicas. Pueden hacerse inspecciones en carretera (RD 563/2017).
<div class="tw" style="margin-top:6px"><table><thead><tr><th>Ligeros ≤ 3,5 t</th><th>Periodicidad</th><th>Pesados &gt; 3,5 t</th><th>Periodicidad</th></tr></thead><tbody>
<tr><td>Hasta 2 años</td><td>Exento</td><td>Hasta 10 años</td><td>Cada año</td></tr><tr><td>2 a 6 años</td><td>Cada 2 años</td><td>Más de 10 años</td><td>Cada 6 meses</td></tr><tr><td>6 a 10 años</td><td>Cada año</td><td></td><td></td></tr><tr><td>Más de 10</td><td>Cada 6 meses</td><td></td><td></td></tr></tbody></table></div></li>
<li><b>Seguro obligatorio</b>: daños a personas o bienes por la circulación. Vehículos a motor, ciclomotores, remolques &gt; 750 kg y especiales.</li>
<li><b>Autorización de transporte</b> (título habilitante, "licencia de actividad"): sin ella no se puede facturar transporte a terceros.</li>
<li><b>Contrato de transporte</b>: el porteador se obliga a trasladar algo en las condiciones pactadas y bajo custodia a cambio de un precio. Partes: <b>cargador</b> (contrata, remitente), <b>porteador</b> (transportista) y <b>consignatario</b> (destinatario). Justificante: <b>carta de porte</b>, en <b>3 ejemplares</b> (cargador, viaja con la mercancía, porteador).</li>
<li><b>Certificado de aprobación ADR</b>: acredita al <b>vehículo</b> para mercancías peligrosas. Solo obligatorio para cisternas (fijas o desmontables), vehículos batería, EXII, EXIII y MEMU.</li>
</ol>
<div class="tw"><table><thead><tr><th>Autorización</th><th>Para</th><th>Requisitos clave</th></tr></thead><tbody>
<tr><td><b>MDP</b></td><td>Público, pesados &gt; 3,5 t</td><td rowspan="2">Empresa: actividad principal el transporte, al corriente de obligaciones, competencia profesional (título de transportista), inscripción en el Registro General de Transportistas. Vehículo: matriculado en España con ITV, en propiedad o leasing, <b>límite de antigüedad</b>. MDP ≥ 1 pesado; MDL ≥ 1 ligero.</td></tr>
<tr><td><b>MDL</b></td><td>Público, ligeros ≤ 3,5 t</td></tr>
<tr><td><b>MPC</b></td><td>Privado complementario, <b>sin distinción de peso</b></td><td>Actividad principal distinta del transporte; vehículo, conductor y carga de la misma empresa; ≥ 1 vehículo con tracción propia; <b>sin límite de antigüedad</b>; volumen limitado a mercancía propia; puede domiciliarse fuera del domicilio fiscal.</td></tr>
</tbody></table></div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes dicen que la MPC es "para vehículos rígidos o cabezas tractoras que arrastren remolques". La profesora la plantea <b>sin distinción de peso</b>; quédate con eso. Te faltan además la tabla de ITV de mercancías y que el certificado ADR del vehículo <b>solo</b> aplica a cisternas, baterías y explosivos.</div>`},
{id:'mcond',h:'Mercancías: conductor y carga',html:`
<p><b>Conductor</b> ${JH}${PR}: NIF (o pasaporte fuera de la UE), permiso de conducir, tarjeta de tacógrafo, <b>CAP</b> y, si lleva MMPP, <b>autorización ADR del conductor</b>.</p>
<div class="tw"><table><thead><tr><th>Permiso</th><th>Qué permite</th></tr></thead><tbody>
<tr><td><b>C1</b></td><td>Mercancías con 3.500 &lt; MMA &lt; 7.500 kg, máx. 9 plazas, remolque &lt; 750 kg</td></tr>
<tr><td><b>C1+E</b></td><td>C1 + remolque &gt; 750 kg, conjunto ≤ 12.000 kg</td></tr>
<tr><td><b>C</b></td><td>MMA &gt; 3.500 kg (sin tope superior), máx. 9 plazas, remolque &lt; 750 kg</td></tr>
<tr><td><b>C+E</b></td><td>C + remolque &gt; 750 kg</td></tr>
</tbody></table></div>
<p><b>Tacógrafo</b>: vehículos de &gt; 3.500 kg. Analógico: hojas del día y de los <b>56 días anteriores</b>; digital o inteligente: tarjeta de conductor. En nueva matriculación se exige el inteligente <b>G2V2</b>. Desde el <b>1/7/2026</b> también entre 2,5 y 3,5 t en transporte internacional o cabotaje.</p>
<p><b>ADR: vehículo vs conductor</b>. El certificado ADR dice que el <b>vehículo</b> cumple los requisitos técnicos; la autorización ADR dice que la <b>persona</b> está habilitada para conducirlo.</p>
<div class="grid2"><div class="mini"><h4>Carga · nacional</h4><p>Carta de porte · <b>DeCA</b> (documento de control administrativo, electrónico obligatorio desde el 5/10/2026) · instrucciones para el conductor · albarán de entrega (recomendable, no obligatorio).</p></div><div class="mini"><h4>Carga · internacional</h4><p>Carta de porte <b>CMR</b> · factura comercial internacional · packing list (sin importes) · albarán.</p></div></div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes dicen "C: cualquier MMA". Matiz: el C es para MMA <b>superior a 3.500 kg</b> (por debajo vale el B). Tampoco tienes los 56 días, el G2V2 ni la fecha de 2026 del tacógrafo ligero.</div>`},
{id:'viaj',h:'Viajeros',html:`
<p><b>Vehículo</b> ${JH}${PR}</p>
<ul>
<li>Permiso de circulación.</li>
<li><b>ITV</b>: los 5 primeros años, una vez al año; con más de 5 años, cada 6 meses.</li>
<li>Seguro obligatorio (terceros) + <b>SOV</b>, Seguro Obligatorio de Viajeros (ocupantes).</li>
<li>Contrato de transporte de viajeros: transportista, conductor y viajero.</li>
<li><b>Autorización</b>: <b>VD</b> (público discrecional, uso general y especial; al menos un vehículo de ≤ 2 años al pedirla) o <b>VPC</b> (privado complementario, mismas condiciones que MPC). Los regulares van por concesión administrativa.</li>
<li><b>Hoja de ruta</b>: servicios que hace un vehículo de transporte público (origen, destino, fecha, matrícula, conductor, nº de viajeros). Se guarda <b>1 año</b>. Digital desde el 5/10/2026. <b>Exentos</b>: regular de uso general y regular de uso especial.</li>
<li><b>Libro de reclamaciones</b>: lo deben tener el transporte público <b>regular de uso general</b> y las estaciones, con cartel obligatorio. 3 ejemplares (órgano competente, reclamante, empresa).</li>
</ul>
<p><b>Conductor</b>: NIF, permiso, tarjeta de tacógrafo, CAP.</p>
<div class="tw"><table><thead><tr><th>Permiso</th><th>Qué permite</th></tr></thead><tbody>
<tr><td><b>D1</b></td><td>Más de 9 y hasta 17 plazas (conductor incluido), remolque &lt; 750 kg</td></tr>
<tr><td><b>D1+E</b></td><td>D1 + remolque &gt; 750 kg, conjunto ≤ 12 t y el remolque <b>no</b> lleva personas</td></tr>
<tr><td><b>D</b></td><td>Cualquier número de plazas, remolque &lt; 750 kg</td></tr>
<tr><td><b>D+E</b></td><td>D + remolque &gt; 750 kg</td></tr>
</tbody></table></div>
<div class="call ojo"><b>Ojo examen</b>Hoja de ruta y libro de reclamaciones se cruzan: la hoja de ruta la llevan los <b>discrecionales</b> (los regulares están exentos); el libro lo llevan los <b>regulares de uso general</b>. Es la trampa de test más probable de este tema.</div>`},
{id:'manut',h:'Manutención',html:`
<p>${JH}${PR} Para conducir una carretilla hacen falta tres cosas:</p>
<ol class="steps"><li><b>Formación específica</b> adaptada al equipo, con certificado (carné de carretillero renovable; RD 1215/1997, LPRL, UNE 58451:2016).</li><li><b>Aptitud médica</b> (art. 22 LPRL).</li><li><b>Autorización interna</b> de la empresa (NTP 713).</li></ol>
<p>La empresa debe tener inventario y mantenimiento documentado de los equipos, y todos llevan <b>marcado CE</b> y manual (Directiva 2006/42/CE; Reglamento (UE) 2023/1230 desde el 14/1/2027).</p>
<div class="call porque"><b>Por qué no basta el carné</b>El certificado de formación acredita que sabes manejar ese tipo de equipo; la aptitud médica, que puedes hacerlo sin riesgo; y la autorización interna es la empresa asumiendo que tú, en concreto, usas esa máquina en sus instalaciones. Son responsabilidades distintas.</div>`}
],

TOPICS.push({
id:'ud2a',code:'2A',loc:'PASILLO 2 · NIVEL A',color:'#3B6FB6',
title:'Planificación y gestión operativa del transporte',
blurb:'Fases de la gestión de flotas, rutas, tiempos y plazos (forward/backward), proceso operativo en 8 etapas y productividad.',
study:[
{id:'plan',h:'Planificación logística y fases de la gestión de flotas',html:`
<p>${JH}${PR} La logística empresarial planifica, ejecuta y controla el almacenamiento y traslado de materiales. Elementos a decidir: requisitos según el modo de transporte, selección de la solución (velocidad, capacidad, coste), tipo de mercancía, <b>operativa propia o externalizada</b>, programación de rutas y frecuencias, secuenciación de salidas, coste mínimo, gestión de stocks y rapidez de entrega.</p>
<div class="tw"><table><thead><tr><th>#</th><th>Fase</th><th>Pregunta que responde</th><th>Ejemplo de la profesora</th></tr></thead><tbody>
<tr><td>1</td><td>Diseño de rutas</td><td>¿Por dónde va cada vehículo para aprovecharlo al máximo?</td><td>—</td></tr>
<tr><td>2</td><td>Planificación de la <b>oferta</b></td><td>¿Cuántos vehículos y conductores necesito?</td><td>"500 pedidos en Valencia y Castellón: 8 camiones y 8 conductores"</td></tr>
<tr><td>3</td><td>Planificación de los <b>servicios</b></td><td>¿Qué trayecto hace cada vehículo/conductor?</td><td>"Juan: Valencia–Alzira–Xàtiva; María: Valencia–Sagunto–Castellón"</td></tr>
<tr><td>4</td><td>Planificación del <b>personal</b></td><td>¿Qué turnos y condiciones?</td><td>"Juan L–V mañana; María sábados y festivos"</td></tr>
<tr><td>5</td><td>Gestión de la <b>operación</b></td><td>¿Se está ejecutando bien hoy?</td><td>Entregas, recogidas, seguimiento, incidencias</td></tr>
</tbody></table></div>
<div class="call ojo"><b>Ojo examen</b>"Oferta" = cantidad de recursos (cuántos). "Servicios" = asignación de trayectos (quién va dónde). Es fácil confundirlas.</div>`},
{id:'rutas',h:'Rutas',html:`
<p>${JH}${PR} <b>Ruta</b>: itinerario que recorre un vehículo para atender todas las entregas o recogidas asignadas en una jornada. Objetivos: reducir tiempos (tránsito, carga, maniobras), minimizar distancias, bajar costes (combustible, peajes, personal) y <b>ajustar la flota al volumen</b>.</p>
<div class="tw"><table><thead><tr><th>Tipo</th><th>Cómo es</th><th>Ventaja / inconveniente</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td><b>Fija</b></td><td>Mismo ciclo (semanal, mensual…) y mismos destinos</td><td>Un diseño por ciclo, poca gestión diaria, el conductor se la sabe / rígida</td><td>Reparto diario a supermercados</td></tr>
<tr><td><b>Periódica</b></td><td>Se programa en momentos concretos</td><td>Absorbe picos / condiciones muy específicas, se usa poco</td><td>Cítricos en temporada, Navidad, autobuses de refuerzo</td></tr>
<tr><td><b>Diaria</b></td><td>Se rediseña cada día con la demanda real</td><td>Máxima flexibilidad, se reparte todo / mucho tiempo de diseño</td><td>SEUR, DHL, Glovo, Amazon Fresh</td></tr>
</tbody></table></div>
<p><b>Preparación de rutas</b> ${PR}: A) información para el diseño (localización de centros, distancias centro–cliente y entre clientes, datos de cliente y accesos); B) del pedido (días y plazos, <b>ventanas horarias</b>, características especiales); C) de la flota (nº y capacidad, dimensiones y peso máximo, conductores y turnos, tipos de carretera); D) restricciones (cada cliente en una sola ruta, <b>una ruta = un vehículo</b>, suma de cargas ≤ capacidad, visitas predefinidas, horarios, mercancía especial con vehículo adaptado); E) restricciones de tiempo (tránsito + carga + descarga + paradas, plazos, tiempos de conducción y descanso, hora punta); F) cálculo de distancias: <b>línea recta × factor de corrección (~20 %)</b>, poco preciso en montaña, o mapa informatizado (tipo de vía, peajes, áreas, restricciones de gálibo).</p>`},
{id:'tiempos',h:'Tiempos y plazos',html:`
<p>${JH}${PR} Los <b>tiempos</b> son duraciones; los <b>plazos</b> son fechas o hitos. Cada tiempo une dos plazos.</p>
<div class="grid2"><div class="mini"><h4>Tiempos (duración)</h4><ol><li><b>Planificación</b>: organizar la expedición.</li><li><b>Preparación</b>: asignar la mercancía a una entrega, picking y embalaje.</li><li><b>Carga</b>.</li><li><b>Tránsito</b>: de almacén a cliente.</li><li><b>Total disponible</b>: desde que la mercancía está lista; es la suma del <b>camino crítico</b>.</li></ol></div>
<div class="mini"><h4>Plazos (fecha)</h4><ol><li><b>Programación</b> del transporte: empieza la organización.</li><li><b>Disposición</b> del material: empiezan picking y embalaje.</li><li><b>Carga</b>: mercancía y vehículo listos.</li><li><b>Salida</b> de la mercancía.</li><li><b>Entrega</b> al cliente.</li></ol></div></div>
<p><b>Forward (push)</b>: partes de la disposición del material y sumas tiempos hasta la fecha de entrega. <b>Backward (pull)</b>: partes de la fecha de entrega comprometida y restas hacia atrás para saber cuándo debe estar el material.</p>
<p>Ejemplo de clase: disposición <b>lunes</b> → preparación 2 días (lunes→miércoles) con la planificación en paralelo el martes → carga miércoles → salida jueves → tránsito → entrega <b>viernes</b>. Total 4 días. La planificación no suma porque cabe dentro de la preparación: lo que cuenta es el camino crítico.</p>
<p>Ejemplo Zara Home: pedido martes 10:00 → planificación (11:00 decide Zaragoza y transportista) → preparación martes 11–18 h → carga miércoles 22:00 → tránsito nocturno, Valencia jueves 8:00 → última milla, entrega jueves 13:00. <b>51 h</b>.</p>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes tienen las listas pero no forward/backward ni el diagrama, y es justo lo que se usa en los dos supuestos. Ojo también a que en tus apuntes los plazos aparecen como fases ("se inicia el picking"): son <b>fechas</b>, no duraciones.</div>`},
{id:'proceso',h:'Proceso operativo del transporte (8 etapas)',html:`
<ol class="steps">
<li><b>Recepción del pedido y prevalidación</b>: propuesta, revisión de datos (origen, destino, mercancía), viabilidad (plazos, medios), prevalidación y registro en el sistema.</li>
<li><b>Planificación</b>: consolidación de la carga por cliente o destino; asignación del vehículo según tipo de mercancía, tipo de vehículo, localización y disponibilidad, tarifas, conductor y fiabilidad; ruta con aplicaciones de gestión de flotas.</li>
<li><b>Documentación y expediente de viaje</b>: nacional (carta de porte, DeCA, instrucciones, albarán) o internacional (CMR, factura, packing list, instrucciones, albarán). El expediente reúne vehículo, ruta, cliente y carga para seguimiento, incidencias y auditorías.</li>
<li><b>Llegada al punto de carga y controles previos</b>: horario (hora fija, cita previa, franja), acceso al muelle, verificación de limpieza, temperatura y equipo, autorización de carga.</li>
<li><b>Carga</b>: bajo supervisión del transportista; daños externos, cantidades y referencias contra el albarán, temperatura, sujeción (cintas, barras), firma del albarán.</li>
<li><b>Transporte</b>: código de circulación, descansos, conducción eficiente, comunicación de incidencias, registro de tiempos.</li>
<li><b>Destino y descarga</b>: zona, condiciones, albarán contra carga, autorización, descarga supervisada, integridad y bultos, firma "<b>conforme salvo examen de contenido</b>" si hace falta.</li>
<li><b>Incidencias y cierre</b>: registro de no conformidades (deterioro, retrasos, errores de documentación), clasificación, archivo e informes, evaluación de proveedores.</li>
</ol>
<div class="call porque"><b>Por qué "conforme salvo examen de contenido"</b>El receptor firma que recibe los bultos en apariencia correcta, pero se reserva reclamar daños ocultos que descubra al abrirlos. Sin esa coletilla, firmar "conforme" debilita una reclamación posterior.</div>`},
{id:'prod',h:'Productividad e indicadores',html:`
<p>${JH}${PR} <b>Productividad = resultados / recursos consumidos</b>. La planificación decide cómo usar camiones, conductores y horas; la productividad dice si esas decisiones funcionan. Ciclo: <b>medir → comparar → desviación → actuar</b>.</p>
<div class="tw"><table><thead><tr><th>Quiero saber…</th><th>Tipo</th><th>Ejemplos</th></tr></thead><tbody>
<tr><td>¿Saco partido a mis recursos?</td><td><b>Productividad</b> (resultado/recurso)</td><td>Servicios/hora de conductor · servicios/vehículo y día · km/litro</td></tr>
<tr><td>¿Cuánto me cuesta cada servicio?</td><td><b>Coste unitario</b> (coste/resultado)</td><td>€/servicio · €/km · €/palé</td></tr>
<tr><td>¿Aprovecho la capacidad?</td><td><b>Utilización</b> (usado/disponible)</td><td>Horas usadas/disponibles · ocupación en peso y volumen · km en vacío/km totales</td></tr>
<tr><td>¿Cumplo con el cliente?</td><td><b>Nivel de servicio</b> (realizado/comprometido)</td><td>Entregas a tiempo/total · realizados/planificados · incidencias/servicios</td></tr>
</tbody></table></div>
<p>Ejemplo: km en vacío/km totales. Enero 18 %, febrero 24 %, objetivo 15 %. Frente al objetivo, <b>+9 puntos</b>; frente a enero, <b>empeora 6 puntos</b>. Acción: buscar cargas de retorno en las rutas con más vacío.</p>
<div class="call ojo"><b>Ojo examen</b>"Km en vacío / km totales" es un indicador de <b>utilización</b>, no de productividad. Y la desviación se da en <b>puntos porcentuales</b> (24 − 15 = 9 puntos), no en % relativo (que sería un 60 % más).</div>`}
],

{id:'2a-sp1',tag:'SP 1 · PROF',title:'Fecha de entrega con planificación en paralelo',
enun:`Material disponible el 1/9/2025. Tiempos: 1 día de planificación, 1 día de carga, 2 días para asignar, hacer picking y embalar, 2 días de tránsito. Planificación y preparación pueden hacerse en paralelo. Indica qué tiempo es cada uno, la fecha de entrega y la fecha de cada plazo.`,
plan:`Identifica: 1 día planificación, 2 días preparación, 1 día carga, 2 días tránsito. Dibuja la línea como en la diapositiva 9 (forward): la preparación arranca en la disposición; la planificación va en paralelo y debe acabar a la vez que la preparación. El camino crítico es preparación + carga + tránsito.`,
sol:`<div class="tw"><table><thead><tr><th>Plazo</th><th>Fecha</th><th>Por qué</th></tr></thead><tbody>
<tr><td>Disposición del material</td><td>lun 1/9</td><td>Dato</td></tr>
<tr><td>Programación del transporte</td><td>mar 2/9</td><td>La planificación (1 día) tiene que estar acabada al empezar la carga: 3/9 − 1</td></tr>
<tr><td>Carga</td><td>mié 3/9</td><td>1/9 + 2 días de preparación</td></tr>
<tr><td>Salida</td><td>jue 4/9</td><td>3/9 + 1 día de carga</td></tr>
<tr><td>Entrega</td><td>sáb 6/9</td><td>4/9 + 2 días de tránsito</td></tr></tbody></table></div>
<p>Tiempo total disponible = 2 + 1 + 2 = <b>5 días</b>. La planificación no suma porque cabe dentro de la preparación.</p>
<div class="call ojo"><b>Supuesto implícito</b>Se cuentan días naturales. El 6/9/2025 cae en sábado; si el enunciado hablase de días laborables, la entrega pasaría al lunes 8/9. Dilo en el examen: demuestra criterio.</div>`,
calc:{id:'forward',preset:{fecha:'2025-09-01',prep:2,plan:1,carga:1,trans:2}}},
{id:'2a-sp2',tag:'SP 2 · PROF',title:'Duración de cada tiempo a partir de los hitos',
enun:`Fechas: pedido 3/3/25, disposición del material 5/3, planificación del transporte 6/3, carga 7/3, salida 8/3, entrega 10/3. Calcula la duración de cada tiempo logístico.`,
plan:`Cada tiempo es la diferencia entre el plazo en el que empieza y el plazo en el que acaba. Fíjate en que la planificación empieza el 6/3, después de la disposición: va en paralelo con la preparación, igual que en el diagrama de clase.`,
sol:`<div class="tw"><table><thead><tr><th>Tiempo</th><th>Desde → hasta</th><th class="n">Días</th></tr></thead><tbody>
<tr><td>Del pedido a la disposición (gestión del pedido)</td><td>3/3 → 5/3</td><td class="n">2</td></tr>
<tr><td>Preparación (asignar, picking, embalaje)</td><td>5/3 → 7/3</td><td class="n">2</td></tr>
<tr><td>Planificación (en paralelo)</td><td>6/3 → 7/3</td><td class="n">1</td></tr>
<tr><td>Carga</td><td>7/3 → 8/3</td><td class="n">1</td></tr>
<tr><td>Tránsito</td><td>8/3 → 10/3</td><td class="n">2</td></tr>
<tr><td><b>Total disponible</b> (desde la disposición, camino crítico)</td><td>5/3 → 10/3</td><td class="n">5</td></tr></tbody></table></div>
<div class="call porque"><b>Criterio</b>Restar fechas consecutivas en cadena (2, 1, 1, 1, 2) es el error habitual: trataría la planificación como si fuera después de la preparación. Con el esquema de la profesora, la preparación va de la disposición a la carga y la planificación se solapa. Desde el pedido hasta la entrega pasan 7 días.</div>`},

{q:'Explica la diferencia entre planificar forward y backward y en qué entorno se usa cada una.',keys:['Forward = push: desde la disposición del material hacia la entrega','Backward = pull: desde la fecha de entrega comprometida hacia atrás','Forward responde "¿cuándo llegará?"; backward "¿cuándo debo empezar?"','Tareas en paralelo: solo cuenta el camino crítico'],
a:`En <b>forward</b> (entornos push) partes de la fecha en que el material está disponible y vas sumando preparación, carga y tránsito hasta obtener la fecha de entrega: responde a "¿cuándo llegará?". En <b>backward</b> (entornos pull) partes de la fecha de entrega comprometida con el cliente y restas los tiempos hacia atrás para saber cuándo tiene que estar el material y empezar la planificación: responde a "¿cuándo debo empezar?". En ambos casos, si dos tareas van en paralelo (planificación y preparación), solo cuenta la más larga: el tiempo total disponible es la suma del camino crítico.`},
{q:'Una empresa ha pasado de 18 % a 24 % de km en vacío con un objetivo del 15 %. Analiza la situación con el ciclo de productividad.',keys:['Medir: indicador de utilización km vacío/km totales','Comparar con objetivo (+9 puntos) y periodo anterior (+6 puntos)','Desviación: empeora y está lejos del objetivo','Actuar: cargas de retorno, reasignar rutas, ajustar flota'],
