{t:'ud1b',lv:'d',q:'Una transpaleta eléctrica con tracción eléctrica y elevación manual:',o:['Necesita baterías de menor capacidad que una con tracción y elevación eléctricas','Necesita baterías de unos 200 kg','Eleva hasta 5,5 m','No puede llevar más de 1.000 kg'],a:0,e:'Las de tracción y elevación eléctricas son las que necesitan baterías grandes (~200 kg).'},
{t:'ud1b',lv:'d',q:'¿Cuál es una limitación del transelevador?',o:['No puede trabajar fuera del pasillo asignado y se adapta mal a cambios de layout o SKU','Es poco selectivo','No supera los 14 m','Requiere mucha mano de obra directa'],a:0,e:'Es 100 % selectivo, llega a 40–45 m y reduce la mano de obra; su problema es la rigidez y la inversión.'},
{t:'ud1b',lv:'d',q:'¿Qué preparadora de pedidos se considera alternativa a la trilateral?',o:['La de nivel alto (hasta 12 m), tipo combi','La de nivel bajo (hasta 3 m)','La de nivel medio (hasta 6 m)','El carro de picking'],a:0,e:'Las combi de 12 m combinan picking y ubicación de palés.'},
{t:'ud1b',lv:'d',q:'En un AGV, la navegación por láser se distingue de la óptica o magnética porque:',o:['Es navegación abierta y permite correcciones sobre el trayecto','Necesita una banda pintada en el suelo','Permite esquivar obstáculos y recalcular como un AMR','Es un cable inductivo enterrado'],a:0,e:'Óptica, magnética y cable son trayecto fijo. Esquivar y recalcular es propio del AMR.'},
// ---------- 1C ----------
{t:'ud1c',lv:'n',q:'¿Cuántos ejemplares tiene la carta de porte y para quién son?',o:['Tres: cargador, el que viaja con la mercancía y porteador','Dos: cargador y consignatario','Tres: cargador, porteador y administración','Uno, que viaja con la mercancía'],a:0,e:'El libro de reclamaciones también tiene tres, pero son órgano competente, reclamante y empresa.'},
{t:'ud1c',lv:'n',q:'La autorización MDL corresponde a:',o:['Transporte público con vehículos ligeros (≤ 3,5 t)','Transporte privado complementario ligero','Transporte público de viajeros discrecional','Transporte público con vehículos pesados'],a:0,e:'MDP pesados, MDL ligeros, MPC privado complementario, VD/VPC viajeros.'},
{t:'ud1c',lv:'n',q:'Con tacógrafo analógico, el conductor debe llevar las hojas de registro:',o:['Del día en curso y de los 56 días anteriores','De la última semana','De los últimos 28 días','Solo la del día'],a:0,e:'Con tacógrafo digital o inteligente lleva la tarjeta de conductor.'},
{t:'ud1c',lv:'n',q:'Un camión de 18 t con 8 años debe pasar la ITV:',o:['Cada año','Cada 6 meses','Cada 2 años','Está exento'],a:0,e:'Pesados (> 3,5 t): anual hasta 10 años y cada 6 meses después.'},
{t:'ud1c',lv:'n',q:'¿Cuánto tiempo se conserva la hoja de ruta?',o:['1 año desde la realización del servicio','5 años','56 días','Hasta la siguiente ITV'],a:0,e:'Y desde el 5/10/2026 es digital.'},
{t:'ud1c',lv:'n',q:'En transporte internacional de mercancías, la carta de porte es:',o:['El CMR','El DeCA','La hoja de ruta','El packing list'],a:0,e:'El DeCA es nacional. El packing list acompaña, pero no es la carta de porte.'},
{t:'ud1c',lv:'n',q:'El SOV cubre:',o:['A los ocupantes del vehículo en caso de accidente durante el viaje','A terceros ajenos al vehículo','La mercancía transportada','Al conductor frente a sanciones'],a:0,e:'El seguro obligatorio del automóvil cubre a terceros.'},
{t:'ud1c',lv:'n',q:'Para conducir una carretilla elevadora hace falta:',o:['Formación específica, aptitud médica y autorización interna de la empresa','Permiso de conducir B y CAP','Solo el carné de carretillero','Autorización MPC'],a:0,e:'Son tres requisitos independientes.'},
{t:'ud1c',lv:'d',q:'Camión de 7.000 kg con remolque de 2.000 kg. ¿Permiso mínimo?',o:['C1+E','C1','C+E','C'],a:0,e:'7.000 está en el rango C1; el remolque supera 750 kg → +E; el conjunto (9.000) no pasa de 12.000, así que no hace falta C+E.'},
{t:'ud1c',lv:'d',q:'Camión de exactamente 7.500 kg de MMA sin remolque. ¿Permiso?',o:['C','C1','C1+E','B'],a:0,e:'El C1 es para MMA superior a 3.500 y menor de 7.500 kg. Con 7.500 justos ya hace falta el C.'},
{t:'ud1c',lv:'d',q:'Un camión cisterna de gasóleo necesita, en materia ADR:',o:['Certificado de aprobación ADR del vehículo y autorización ADR del conductor','Solo la autorización ADR del conductor','Solo el certificado del vehículo','Ninguno, si el trayecto es nacional'],a:0,e:'Las cisternas sí necesitan certificado del vehículo; con bidones solo haría falta la del conductor.'},
{t:'ud1c',lv:'d',q:'Una furgoneta de 3.000 kg con 4 años pasa la ITV:',o:['Cada 2 años','Cada año','Está exenta','Cada 6 meses'],a:0,e:'Ligeros: exento hasta 2 años, cada 2 años entre 2 y 6, anual de 6 a 10 y cada 6 meses después.'},
{t:'ud1c',lv:'d',q:'Un servicio regular de transporte escolar (uso especial) debe llevar:',o:['Ni hoja de ruta ni libro de reclamaciones obligatorio','Hoja de ruta y libro de reclamaciones','Solo hoja de ruta','Solo libro de reclamaciones'],a:0,e:'Los regulares de uso general y especial están exentos de hoja de ruta; el libro solo es obligatorio en los regulares de uso general (y estaciones).'},
{t:'ud1c',lv:'d',q:'¿Qué requisito NO se exige para la autorización MPC?',o:['Límite de antigüedad del vehículo','Al menos un vehículo con tracción propia','Actividad principal distinta del transporte','Vehículo matriculado en España con ITV en vigor'],a:0,e:'La MPC no tiene límite de antigüedad; la MDP/MDL sí.'},
{t:'ud1c',lv:'d',q:'Un remolque de 700 kg acoplado a un camión:',o:['No necesita permiso de circulación propio: circula con la matrícula del tractor','Necesita permiso de circulación y seguro propios','Necesita ITV propia anual','Obliga a tener C1+E'],a:0,e:'El permiso propio lo llevan remolques de MMA > 750 kg. Con ≤ 750 kg tampoco cambia el permiso de conducir.'},
{t:'ud1c',lv:'d',q:'Para obtener la autorización VD la empresa debe tener:',o:['Al menos un vehículo que no supere los 2 años de antigüedad al solicitarla','Al menos un vehículo de más de 3,5 t','Una concesión administrativa de línea','Un vehículo con menos de 10 años'],a:0,e:'Las líneas regulares van por concesión; la VD es para discrecional.'},
{t:'ud1c',lv:'d',q:'Desde el 1/7/2026, el tacógrafo también es obligatorio en:',o:['Vehículos de 2,5 a 3,5 t en transporte internacional o cabotaje','Todas las furgonetas de reparto urbano','Vehículos de menos de 2,5 t en internacional','Carretillas elevadoras'],a:0,e:'Hasta entonces el umbral general es > 3.500 kg.'},
{t:'ud1c',lv:'d',q:'El permiso D1+E permite remolque de más de 750 kg siempre que:',o:['El conjunto no exceda 12 t y el remolque no transporte personas','El autobús tenga menos de 9 plazas','El remolque sea de mercancías peligrosas','El conjunto no exceda 7,5 t'],a:0,e:'Es la condición que lo distingue del C1+E: el remolque no puede usarse para personas.'},
{t:'ud1c',lv:'d',q:'En transporte nacional de mercancías, ¿qué documento de la carga es recomendable pero no obligatorio?',o:['El albarán de entrega','El DeCA','La carta de porte','Las instrucciones para el conductor'],a:0,e:'Tus apuntes también lo marcan como no obligatorio. El DeCA es electrónico obligatorio desde el 5/10/2026.'},
// ---------- 2A ----------
{t:'ud2a',lv:'n',q:'La "planificación de la oferta" consiste en:',o:['Determinar cuántos vehículos y conductores se necesitan para cubrir la demanda','Decidir qué trayecto hace cada conductor','Organizar los turnos de trabajo','Fijar la tarifa al cliente'],a:0,e:'Trayectos = planificación de servicios; turnos = planificación del personal.'},
{t:'ud2a',lv:'n',q:'¿Qué tipo de ruta usan SEUR, DHL o Amazon Fresh?',o:['Diaria','Fija','Periódica','Regular'],a:0,e:'Se rediseñan cada día con la demanda real.'},
{t:'ud2a',lv:'n',q:'Planificar hacia atrás (backward) corresponde a entornos:',o:['Pull: se parte de la fecha de entrega comprometida','Push: se parte de la disposición del material','Push: se parte del pedido','Pull: se parte de la salida de la mercancía'],a:0,e:'Forward = push, desde la disposición.'},
{t:'ud2a',lv:'n',q:'"Km en vacío / km totales" es un indicador de:',o:['Utilización','Productividad','Coste unitario','Nivel de servicio'],a:0,e:'Mide qué parte de la capacidad recorrida se desaprovecha: usado/disponible.'},
{t:'ud2a',lv:'n',q:'Para estimar distancias en línea recta sobre un mapa se aplica un factor de corrección de aproximadamente:',o:['20 %','5 %','50 %','100 %'],a:0,e:'Para las curvas; es poco preciso en terreno montañoso.'},
{t:'ud2a',lv:'n',q:'"Una ruta = un único vehículo" es, en la preparación de rutas:',o:['Una restricción a considerar','Información de la flota','Información del pedido','Una restricción de tiempo'],a:0,e:'Junto a "cada cliente en una sola ruta" y "carga ≤ capacidad".'},
{t:'ud2a',lv:'n',q:'La firma "conforme salvo examen de contenido" se hace en la etapa de:',o:['Llegada al destino, controles y descarga','Proceso de carga','Recepción del pedido y prevalidación','Registro de incidencias'],a:0,e:'Etapa 7: el receptor se reserva reclamar daños ocultos.'},
{t:'ud2a',lv:'n',q:'El tiempo total disponible es:',o:['La suma del camino crítico de los tiempos de planificación, preparación, carga y tránsito','La suma de todos los tiempos, incluidos los paralelos','El tiempo de tránsito más la carga','El tiempo desde el pedido hasta la planificación'],a:0,e:'Las tareas en paralelo solo cuentan por la más larga.'},
{t:'ud2a',lv:'d',q:'Material disponible el jueves 1. Preparación 2 días con planificación (1 día) en paralelo, carga 1 día y tránsito 1 día, en días naturales. ¿Cuándo se entrega?',o:['Lunes 5','Domingo 4','Martes 6','Sábado 3'],a:0,e:'Carga 1 + 2 = sábado 3 → salida domingo 4 → entrega lunes 5. La planificación no suma.'},
{t:'ud2a',lv:'d',q:'Entregas a tiempo: objetivo 95 %, mes anterior 89 %, mes actual 91 %. ¿Qué es correcto?',o:['Desviación de −4 puntos frente al objetivo y mejora de 2 puntos frente al mes anterior','Desviación de +4 puntos y empeora 2','Desviación de −4 % relativo y mejora del 2 %','Cumple el objetivo porque mejora'],a:0,e:'En nivel de servicio "más es mejor": 91 − 95 = −4 puntos (por debajo) y 91 − 89 = +2 (mejora).'},
{t:'ud2a',lv:'d',q:'Planificación backward: entrega el día 20, tránsito 2 días, carga 1 día, preparación 3 días. ¿Qué día debe estar disponible el material?',o:['Día 14','Día 15','Día 17','Día 13'],a:0,e:'Salida 18 → carga 17 → disposición 17 − 3 = 14.'},
{t:'ud2a',lv:'d',q:'"Disposición del material" es:',o:['Un plazo (fecha en la que empiezan picking y embalaje)','Un tiempo (duración del picking)','Una fase del proceso operativo','Un indicador de productividad'],a:0,e:'Los plazos son fechas; los tiempos, duraciones entre ellos.'},
{t:'ud2a',lv:'d',q:'Las ventanas horarias de carga y descarga forman parte de:',o:['La información del pedido','La información de la flota','Las restricciones de tiempo','La información para el diseño de rutas'],a:0,e:'Apartado B: días y plazos, ventanas horarias, características especiales.'},
{t:'ud2a',lv:'d',q:'Los km en vacío pasan del 18 % al 24 %. El aumento relativo es:',o:['33 %','6 %','24 %','75 %'],a:0,e:'6 puntos sobre 18 = 33 % relativo. Por eso en el examen hay que decir "puntos" si das la diferencia absoluta.'},
{t:'ud2a',lv:'d',q:'"€/palé transportado" es un indicador de:',o:['Coste unitario','Productividad','Utilización','Nivel de servicio'],a:0,e:'Coste / resultado.'},
{t:'ud2a',lv:'d',q:'La consolidación de cargas por cliente o destino pertenece a la etapa:',o:['Planificación y asignación del vehículo','Recepción del pedido y prevalidación','Proceso de carga','Generación de la documentación'],a:0,e:'Etapa 2: consolidación, asignación del vehículo y planificación de la ruta.'},
// ---------- 2B ----------
{t:'ud2b',lv:'n',q:'Con +30 % por preparación de pedidos y +20 % por interferencias, el coeficiente es:',o:['k = 0,5','k = 0,56 (1,3 · 1,2 − 1)','k = 0,2','k = 1,5'],a:0,e:'Los coeficientes se suman. El factor de la fórmula es (1 + k) = 1,5.'},
{t:'ud2b',lv:'n',q:'Si el cálculo da 4,2 carretillas, se necesitan:',o:['5','4','4,2','Depende de la utilización'],a:0,e:'Siempre al alza: con 4 no se hace el trabajo en el plazo.'},
{t:'ud2b',lv:'n',q:'En la fórmula de ciclo combinado en pasillo estrecho, el término de recogidas y descargas es:',o:['4·Trd','2·Trd','Trd','No tiene'],a:0,e:'Dos recogidas y dos descargas. En el simple, 2·Trd.'},
{t:'ud2b',lv:'n',q:'El ciclo combinado puede reducirse un 20 % si:',o:['Se extrae la carga más cercana a la que se acaba de almacenar','Se usan velocidades sin carga','Se trabaja a dos turnos','Se agrupan dos palés por viaje'],a:0,e:'Es la regla de la diapositiva 67.'},
{t:'ud2b',lv:'n',q:'En la preparación de pedidos, el desplazamiento del operario puede llegar a ser:',o:['Hasta el 50 % del tiempo total','Hasta el 10 %','Hasta el 90 %','Despreciable'],a:0,e:'Por eso se ubica lo de más rotación cerca de la zona de expedición.'},
{t:'ud2b',lv:'n',q:'La disgregación de cargas es:',o:['Separar la mercancía recibida con destinos diferentes','Agrupar productos con destino común','Cambiar la presentación sin cambiar el producto','Mover físicamente la mercancía'],a:0,e:'Agrupar = consolidación; cambiar presentación = manipulación; mover = manutención.'},
{t:'ud2b',lv:'n',q:'"Usar velocidades más desfavorables" significa usar:',o:['Las velocidades con carga','Las velocidades sin carga','La media de ambas','La velocidad máxima del fabricante'],a:0,e:'Son las más lentas en horizontal y en elevación.'},
{t:'ud2b',lv:'n',q:'Si un ciclo dura 144 s, la productividad es:',o:['25 movimientos/hora','2,4 movimientos/hora','144 movimientos/hora','60 movimientos/hora'],a:0,e:'3.600 / 144 = 25.'},
{t:'ud2b',lv:'n',q:'En la expedición, la regla de carga secuenciada es:',o:['Lo que se descarga primero se carga al final','Lo más pesado se carga al final','Se carga por orden de referencia','Lo primero que se prepara se carga primero'],a:0,e:'Así queda junto a la puerta en la primera parada.'},
{t:'ud2b',lv:'n',q:'En la recepción, la fase 3 es:',o:['Control de calidad (si hay acuerdo con el proveedor)','Entrada y ubicación','Planificación de recursos antes de la llegada','Descarga'],a:0,e:'1 antes de la llegada, 2 verificación + descarga, 3 calidad, 4 entrada y ubicación.'},
{t:'ud2b',lv:'d',q:'600 movimientos/día, 150 s por movimiento, 7,5 h efectivas, k = 0,3 + 0,1. ¿Cuántas carretillas y con qué utilización?',o:['5 carretillas, 93 %','4 carretillas, 100 %','5 carretillas, 67 %','6 carretillas, 78 %'],a:0,e:'1,4 · 600 · 150 / 27.000 = 4,67 → 5. Utilización 4,67 / 5 = 93 %.'},
{t:'ud2b',lv:'d',q:'900 unidades/día, transporte de 120 s por viaje, manipulación de 180 s por unidad, envíos de 3 en 3, 7,5 h, sin k. ¿Cuántos equipos?',o:['8','7','12','6'],a:0,e:'300 viajes · (120 + 3 · 180) = 300 · 660 = 198.000 s = 55 h → 55 / 7,5 = 7,33 → 8. De uno en uno serían 900 · 300 s = 75 h → 10.'},
{t:'ud2b',lv:'d',q:'Tres almacenes con valores exactos de 1,2, 2,3 y 0,4 carretillas. ¿Cuántas ahorra una flota única?',o:['2','1','0','3'],a:0,e:'Separadas: 2 + 3 + 1 = 6. Única: 3,9 → 4. Diferencia 2.'},
{t:'ud2b',lv:'d',q:'Carga de trabajo equivalente a 4,2 carretillas a un turno. Si se pasa a dos turnos, ¿cuántos conductores hacen falta?',o:['6','5','3','4'],a:0,e:'2 turnos: 2,1 → 3 carretillas × 2 turnos = 6 conductores (frente a 5 a un turno).'},
{t:'ud2b',lv:'d',q:'Ciclo simple en pasillo estrecho con X = 50 m, Z = 10 m, vx = 2,5 m/s, vz = 0,5 m/s, Trd = 8 s:',o:['42,7 s','36,0 s','26,7 s','58,7 s'],a:0,e:'2,5 · 100 / (3 · 0,25 · 50) = 6,67 + 50 / 2,5 = 20 + 16 = 42,67 s → 84 ciclos/h.'},
{t:'ud2b',lv:'d',q:'Un milk-run con 6 paradas en línea (salida y regreso al supermercado) recorre:',o:['7 tramos','6 tramos','12 tramos','5 tramos'],a:0,e:'Supermercado → P1 … P6 → supermercado: n + 1.'},
{t:'ud2b',lv:'d',q:'En el SP 4, ¿cuánto se tarda en elevar 3 m un palé con la retráctil cargada?',o:['8,57 s','6,67 s','7,50 s','1,20 s'],a:0,e:'3 / 0,35 (elevación con carga). 7,5 s es descender 3 m descargada (0,40).'},
{t:'ud2b',lv:'d',q:'Un cálculo da 1,57 carretillas. ¿Cuál es la utilización real de la flota?',o:['78,5 %','57 %','157 %','100 %'],a:0,e:'1,57 / 2 = 0,785.'},
{t:'ud2b',lv:'d',q:'¿Por qué en Datos.xlsx los viajes se redondean al alza por referencia antes de sumar por almacén?',o:['Porque cada referencia tiene su palé en su estación y no se puede enviar una fracción de palé','Porque lo exige SUMAR.SI.CONJUNTO','Porque así sale menor el número de viajes','Porque k = 0'],a:0,e:'Redondear tras sumar supondría compartir palés entre referencias, y eso no ocurre.'},
{t:'ud2b',lv:'d',q:'En el caso de los transelevadores, el tiempo unitario de la fórmula de vehículos es:',o:['El tiempo de ciclo','La mitad del tiempo de ciclo','El tiempo de recogida','Un valor estadístico de muchos ciclos'],a:0,e:'La diapositiva lo dice así; en general, el tiempo unitario es un promedio estadístico.'},
{t:'ud2b',lv:'d',q:'Un ciclo combinado general dura 200 s. Si se elige la salida más cercana a la entrada recién hecha, puede bajar a:',o:['160 s','180 s','100 s','120 s'],a:0,e:'Reducción del 20 %.'},
{t:'ud2b',lv:'d',q:'Ciclo de 363,3 s con 133,3 s de transporte. Si se duplica la velocidad de la remolcadora, el ciclo baja aproximadamente:',o:['Un 18 %','Un 50 %','Un 37 %','Un 9 %'],a:0,e:'El transporte pasa a 66,7 s: el ciclo queda en 296,7 s (−66,7 / 363,3 = −18 %). Como la manipulación es el 63 %, la velocidad influye poco.'},
{t:'ud2b',lv:'d',q:'Reserva y picking "diferenciados" significa que:',o:['El picking se hace en una zona propia distinta de la reserva, con reposición','Se prepara desde los mismos palés de almacenaje','Cada operario tiene su zona asignada','El picking es automático'],a:0,e:'En tus apuntes aparece como "indiferenciada" por error.'},
// ---------- 2C ----------
{t:'ud2c',lv:'n',q:'En la localización de flotas, el GNSS:',o:['Calcula la posición del vehículo por satélite','Envía la posición al sistema de la empresa','Registra los tiempos de conducción','Detecta la apertura de puertas'],a:0,e:'La transmisión la hacen las comunicaciones móviles.'},
{t:'ud2c',lv:'n',q:'El tacógrafo digital se regula en:',o:['Reglamento (CE) 165/2014','RD 2822/1998','Reglamento (UE) 2018/858','RD 563/2017'],a:0,e:'El RD 563/2017 regula las inspecciones técnicas en carretera.'},
{t:'ud2c',lv:'n',q:'"Detectar un gasto excesivo de combustible en el camión 12" es una función del FMS de:',o:['Monitorización de consumo','Registro de rutas y tiempos','Gestión de turnos','Alertas de conducción agresiva'],a:0,e:'La parada no autorizada del camión 7 es registro de rutas y tiempos.'},
{t:'ud2c',lv:'n',q:'El Big Data se caracteriza por:',o:['Volumen, variedad, velocidad y variabilidad','Volumen, valor, veracidad y visibilidad','Solo un gran volumen de datos','Datos en tiempo real de un único sensor'],a:0,e:'Las 4 V de la diapositiva.'},
{t:'ud2c',lv:'n',q:'En el ejemplo de IoT de clase, un camión de vacunas lanza una alerta si la temperatura sale de:',o:['+2 a +8 °C','−18 a −24 °C','0 a +4 °C','+8 a +15 °C'],a:0,e:'Registra la temperatura cada minuto.'},
{t:'ud2c',lv:'n',q:'Una ventaja directa de la localización en tiempo real es:',o:['Reducir los kilómetros en vacío','Eliminar la necesidad de tacógrafo','Garantizar que los datos introducidos son ciertos','Sustituir la carta de porte'],a:0,e:'También mejora la planificación de rutas y el control para empresa y cliente.'},
{t:'ud2c',lv:'d',q:'¿Cuál es la principal limitación del blockchain para la trazabilidad?',o:['No garantiza que el dato introducido fuera cierto','Los registros pueden modificarse fácilmente','No permite rastrear el origen','Es más lento que el papel'],a:0,e:'Garantiza integridad (no se altera sin que se note), no veracidad.'},
{t:'ud2c',lv:'d',q:'¿Cuál NO está entre los problemas que resuelven los sistemas telemáticos según la profesora?',o:['Falta de muelles de carga en el almacén','Desconocimiento de la ubicación de vehículos','Errores en la documentación','Dependencia del papel'],a:0,e:'La falta de muelles es un problema de capacidad física (UD 2B), no de información.'},
{t:'ud2c',lv:'d',q:'El mantenimiento predictivo aparece en clase como aplicación de:',o:['Inteligencia artificial','Blockchain','GNSS','Tacógrafo digital'],a:0,e:'Junto a la predicción de atascos en la A-3.'},

// ====================== CALCULADORAS ======================
const nf=(x,d=2)=>{if(x===null||x===undefined||!isFinite(x))return '—';return Number(x).toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:d});};
const ceil=x=>Math.ceil(x-1e-9);
const pct=x=>nf(x*100,1)+' %';
const S=(l,f,r,why)=>({l,f,r,why});
const DAYS=['dom','lun','mar','mié','jue','vie','sáb'];
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d;}
function fd(d){return DAYS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();}
function parseLista(s){return String(s).split(/[;\n]/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.split(':');return {n:(m[0]||'').trim(),v:parseFloat(String(m[1]||'0').replace(',','.'))||0};});}
function miniTable(head,rows){return '<div class="tw"><table><thead><tr>'+head.map((h,i)=>'<th'+(i?' class="n"':'')+'>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i?' class="n"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}

function rnd(a,b){return a+Math.random()*(b-a);}
function perturb(v,key,keep){if(typeof v!=='number'||keep.includes(key)||v===0)return v;const dec=(String(v).split('.')[1]||'').length;let x=v*rnd(0.7,1.35);

function randomize(id,preset){const c=CALCS[id];const keep=c.keep||[];const p=JSON.parse(JSON.stringify(preset));
for(const k in p){if(k==='rows')p.rows=p.rows.map(r=>[r[0],r[1]?perturb(r[1],'d',[]):0,r[2],r[3]?perturb(r[3],'t',[]):0]);else if(k==='lista')p.lista=parseLista(p.lista).map(a=>a.n+':'+perturb(a.v,'v',[])).join('; ');else if(k==='fecha'){p.fecha=new Date(2026,Math.floor(rnd(0,12)),Math.floor(rnd(1,28)),12).toISOString().slice(0,10);}else p[k]=perturb(p[k],k,keep);}
if(id==='nveh'&&p.k===0&&Math.random()<.5)p.k=[0.2,0.3,0.5][Math.floor(rnd(0,3))];
if(id==='forward'){['prep','plan','carga','trans'].forEach(k=>p[k]=Math.max(1,Math.round(rnd(1,4))));}
return p;}

return `<div class="tw"><table><tbody>${items.join('')}</tbody></table></div>${rows}`;}

function mountTry(w,e,c,data,orig){const asks=c?c.ask.filter(a=>c.run(data).res[a.k]!==undefined):[];
if(!c||!asks.length){w.innerHTML=`<div class="open"><label class="lbl" for="tr-${e.id}">Tu respuesta</label><textarea id="tr-${e.id}" placeholder="Escribe tu solución como en el examen…">${esc(ST.drafts['ex-'+e.id]||'')}</textarea><div><button class="btn y show">Ver solución</button></div><div class="sol" hidden></div></div>`;
$('textarea',w).oninput=ev=>{ST.drafts['ex-'+e.id]=ev.target.value;save();};
$('.show',w).onclick=()=>{const s=$('.sol',w);s.hidden=false;s.innerHTML=`<div class="model">${c?'':''}<span class="lbl">Solución</span>${e.sol}</div>`;if(c){const d=document.createElement('div');s.appendChild(d);mountCalc(d,c,data,false);}};return;}
const R=c.run(data).res;
w.innerHTML=`<div><span class="lbl">Datos</span>${dataList(c,data)}</div><div class="calc"><header><span>TUS RESULTADOS</span></header><div class="inputs">${asks.map(a=>`<label for="a-${e.id}-${a.k}">${a.l}<input id="a-${e.id}-${a.k}" inputmode="decimal" data-k="${a.k}"></label>`).join('')}</div><div class="calcout"><div><button class="btn y chk">Comprobar</button> <button class="btn ghost giveup">Ver solución sin comprobar</button></div><div class="fb"></div></div></div><div class="sol"></div>`;
const reveal=()=>{const s=$('.sol',w);s.innerHTML='<span class="lbl">Solución paso a paso</span>';const d=document.createElement('div');s.appendChild(d);mountCalc(d,c,data,false);if(orig)s.insertAdjacentHTML('beforeend',`<div class="sec" style="padding:14px 16px;margin-top:10px">${e.sol}</div>`);};
$('.chk',w).onclick=()=>{let good=0;const out=asks.map(a=>{const inp=$(`[data-k="${a.k}"]`,w);const raw=String(inp.value).trim();const v=raw.includes(',')?parseFloat(raw.replace(/\./g,'').replace(',','.')):parseFloat(raw);const r=R[a.k];let ok=false;if(isFinite(v)){ok=a.int?Math.round(v)===Math.round(r):Math.abs(v-r)<=Math.max(Math.abs(r)*(a.tol||0.01),0.011);}if(ok)good++;inp.style.borderColor=ok?'var(--ok)':'var(--bad)';return `<li>${ok?'✓':'✗'} ${a.l}: correcto <b class="mono">${a.int?r:nf(r,3)}</b>${isFinite(v)?'':' (sin respuesta)'}</li>`;});
$('.fb',w).innerHTML=`<div class="final">${good}/${asks.length} correctos</div><ul>${out.join('')}</ul>`;if(good===asks.length){ST.ex[e.id]=true;save();}reveal();};
$('.giveup',w).onclick=reveal;}

function mountCalc(w,c,p,editable){w.innerHTML=`<div class="calc"><header><span>CALCULADORA · ${c.name.toUpperCase()}</span>${editable?'<span>Cambia cualquier dato y se recalcula</span>':''}</header>${editable?`<div class="inputs">${c.inputs.map(i=>{const id='c'+Math.random().toString(36).slice(2,8);
if(i.type==='select')return `<label for="${id}">${i.l}<select id="${id}" data-k="${i.k}">${i.opts.map(o=>`<option value="${o[0]}"${p[i.k]===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label>`;
if(i.type==='text')return `<label for="${id}" style="grid-column:1/-1">${i.l}<input id="${id}" data-k="${i.k}" value="${esc(p[i.k])}"></label>`;
if(i.type==='date')return `<label for="${id}">${i.l}<input id="${id}" type="date" data-k="${i.k}" value="${p[i.k]}"></label>`;
return `<label for="${id}">${i.l}${i.u?' ('+i.u+')':''}<input id="${id}" type="number" step="any" data-k="${i.k}" value="${p[i.k]}"></label>`;}).join('')}</div>${p.rows?`<div class="tw optable"><table><thead><tr><th>Operación</th><th class="n">d (m)</th><th class="n">v (m/s)</th><th class="n">t fijo (s)</th></tr></thead><tbody>${p.rows.map((r,ri)=>`<tr><td>${esc(r[0])}</td>${[1,2,3].map(j=>`<td class="n"><input type="number" step="any" aria-label="${esc(r[0])} ${['','distancia','velocidad','tiempo fijo'][j]}" data-r="${ri}" data-j="${j}" value="${r[j]}" style="width:80px;font-family:var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:3px 5px;background:var(--surface);color:var(--ink)"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}`:''}<div class="calcout"></div></div>`;
const out=$('.calcout',w);
const calc=()=>{let r;try{r=c.run(p);}catch(err){out.innerHTML='<p>Revisa los datos.</p>';return;}
out.innerHTML=r.steps.map((s,i)=>`<div class="cstep"><span class="i">${i+1}</span><span class="l">${s.l}</span><span class="r">${s.r||''}</span>${s.f?`<span class="f">${s.f}</span>`:''}${s.why?`<div class="why">${s.why}</div>`:''}</div>`).join('')+`<div class="final">${r.final}</div>`;};
$$('.inputs [data-k]',w).forEach(inp=>inp.addEventListener('input',()=>{const i=c.inputs.find(x=>x.k===inp.dataset.k);p[i.k]=(i.type==='select'||i.type==='text'||i.type==='date')?inp.value:(parseFloat(inp.value)||0);calc();}));
$$('[data-r]',w).forEach(inp=>inp.addEventListener('input',()=>{p.rows[+inp.dataset.r][+inp.dataset.j]=parseFloat(inp.value)||0;calc();}));
calc();}

// ---------- test ----------
function shuffleIdx(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const LV={n:'Normal',d:'Difícil'};
function qCard(q,num,opts){opts=opts||{};const order=shuffleIdx(q.o.length);const L='ABCD';
const el=document.createElement('div');el.className='q';
el.innerHTML=`<div class="qh"><span class="qn">${num} · ${LV[q.lv].toUpperCase()}${opts.showTopic?' · '+TOPIC[q.t].code:''}</span><span class="qt">${q.q}</span></div><div class="opts">${order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="lt">${L[k]}</span><span>${q.o[oi]}</span></button>`).join('')}</div><div class="fb"></div>`;
$$('.opt',el).forEach(b=>b.onclick=()=>{const oi=+b.dataset.oi;
if(opts.exam){$$('.opt',el).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');opts.onPick(oi);return;}
const ok=oi===q.a;$$('.opt',el).forEach(x=>{x.disabled=true;if(+x.dataset.oi===q.a)x.classList.add('ok');});if(!ok)b.classList.add('ko');
$('.fb',el).innerHTML=`<div class="expl ${ok?'':'ko'}"><b>${ok?'Correcto.':'Incorrecto.'}</b> ${q.e}</div>`;record(q,ok);opts.after&&opts.after(ok);});
return el;}

function renderTest(body,t){let lv='all',mode='una',pool=[],idx=0,ok=0,done=0,wrong=[],answered=false;
const all=()=>QUESTIONS.filter(q=>q.t===t.id);
const filt=k=>all().filter(q=>k==='all'||(k==='pend'?!(ST.ans[q.id]&&ST.ans[q.id].ok):q.lv===k));
const newRound=()=>{const f=filt(lv);pool=shuffleIdx(f.length).map(i=>f[i]);idx=0;ok=0;done=0;wrong=[];answered=false;};
const head=()=>`<div class="qtoolbar"><div style="display:flex;gap:6px;flex-wrap:wrap">${[['all','Todas'],['n','Normal'],['d','Difícil'],['pend','Sin acertar']].map(([k,l])=>`<button class="chip" aria-pressed="${lv===k}" data-lv="${k}">${l} · ${filt(k).length}</button>`).join('')}</div><div class="seg" role="group" aria-label="Vista" style="margin-left:auto"><button aria-pressed="${mode==='una'}" data-mode="una">Una a una</button><button aria-pressed="${mode==='lista'}" data-mode="lista">Lista</button></div></div>`;
const bind=()=>{$$('[data-lv]',body).forEach(b=>b.onclick=()=>{lv=b.dataset.lv;newRound();draw();});$$('[data-mode]',body).forEach(b=>b.onclick=()=>{mode=b.dataset.mode;newRound();draw();});};
const after=(q,o)=>{done++;if(o)ok++;else wrong.push(q);answered=true;};
const draw=()=>{
if(!pool.length){body.innerHTML=head()+`<div class="empty">${lv==='pend'?'Has acertado todas las de este tema. Cambia a Todas o Difícil para repasar.':'No hay preguntas con este filtro.'}</div>`;bind();setKeys(null);return;}
if(mode==='lista'){body.innerHTML=head()+`<p class="maphint">Normal ya es exigente; Difícil busca la trampa de experto. <span class="mono" id="sc"></span></p><div class="qlist"></div>`;bind();setKeys(null);
const list=$('.qlist',body);pool.forEach((q,i)=>list.appendChild(qCard(q,i+1,{after:o=>{after(q,o);$('#sc').textContent=`· ${ok}/${done} aciertos`;}})));return;}
if(idx>=pool.length){const pc=Math.round(ok/pool.length*100);
body.innerHTML=head()+`<div class="quiz"><div class="sumgrid"><div><b>${ok}/${pool.length}</b><span>aciertos</span></div><div><b>${pc} %</b><span>de la ronda</span></div><div><b>${wrong.length}</b><span>falladas, ya en Repaso</span></div></div>
${wrong.length?`<div class="subhead"><h2>Lo que has fallado</h2></div><div class="qlist">${wrong.map((q,i)=>`<div class="q"><div class="qh"><span class="qn">${i+1} · ${LV[q.lv].toUpperCase()}</span><span class="qt">${q.q}</span></div><div class="opt ok" style="cursor:default"><span class="lt">✓</span><span>${q.o[q.a]}</span></div><div class="expl">${q.e}</div></div>`).join('')}</div>`:''}
<div class="qnav"><button class="btn y" id="again">Otra ronda</button>${wrong.length?'<button class="btn ghost" id="redo">Repetir solo las falladas</button>':''}</div></div>`;
bind();$('#again').onclick=()=>{newRound();draw();};const rd=$('#redo');if(rd)rd.onclick=()=>{pool=wrong.slice();idx=0;ok=0;done=0;wrong=[];answered=false;draw();};
setKeys(e=>{if(e.key==='Enter'){e.preventDefault();newRound();draw();}});return;}
const q=pool[idx];answered=false;
body.innerHTML=head()+`<div class="quiz"><div class="qmeta"><span>Pregunta ${idx+1} de ${pool.length}</span><span>${ok} aciertos · ${done-ok} fallos</span></div><div class="qbar"><i style="width:${idx/pool.length*100}%"></i></div><div id="qslot"></div>
<div class="qnav"><span class="hint">Teclas: 1–4 o A–D para responder · Enter para seguir</span><div style="display:flex;gap:8px;margin-left:auto"><button class="btn ghost" id="skip">Saltar</button><button class="btn y" id="next" disabled>${idx+1===pool.length?'Ver resultado':'Siguiente'} →</button></div></div></div>`;
bind();const card=qCard(q,idx+1,{after:o=>{after(q,o);$('#next').disabled=false;$('#skip').hidden=true;$('#next').focus({preventScroll:true});}});$('#qslot').appendChild(card);
const next=()=>{idx++;draw();};$('#next').onclick=next;$('#skip').onclick=()=>{pool.push(pool.splice(idx,1)[0]);draw();};
setKeys(e=>{if(e.target.matches('input,textarea,select'))return;const k=e.key.toLowerCase();const m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[k];
if(m!==undefined&&!answered){const b=$$('.opt',card)[m];if(b){e.preventDefault();b.click();}}else if((e.key==='Enter'||e.key==='ArrowRight')&&answered){e.preventDefault();next();}});};
newRound();draw();}

// ---------- desarrollo ----------
function renderOpen(body,t){body.innerHTML=`<p class="maphint">Escribe tu respuesta como en el examen (se guarda sola), despliega la respuesta modelo y marca qué puntos clave has incluido.</p><div class="qlist">${t.open.map((o,i)=>{const k=t.id+'-o'+i;const ch=ST.open[k]||[];return `<div class="open" data-k="${k}"><div class="qh"><span class="qn">PREGUNTA ${i+1}</span></div><b>${o.q}</b><label class="lbl" for="ta-${k}">Tu respuesta</label><textarea id="ta-${k}">${esc(ST.drafts[k]||'')}</textarea><div><button class="btn y show">Ver respuesta modelo</button></div><div class="model" hidden><span class="lbl">Puntos clave · ${ch.length}/${o.keys.length}</span><ul class="keys">${o.keys.map((kk,j)=>`<li><label><input type="checkbox" data-j="${j}"${ch.includes(j)?' checked':''}> ${kk}</label></li>`).join('')}</ul><span class="lbl">Respuesta modelo</span><p>${o.a}</p></div></div>`;}).join('')}</div>`;
$$('.open',body).forEach(el=>{const k=el.dataset.k;$('textarea',el).oninput=e=>{ST.drafts[k]=e.target.value;save();};$('.show',el).onclick=()=>{const m=$('.model',el);m.hidden=!m.hidden;$('.show',el).textContent=m.hidden?'Ver respuesta modelo':'Ocultar respuesta modelo';};
$$('input[type=checkbox]',el).forEach(cb=>cb.onchange=()=>{ST.open[k]=$$('input[type=checkbox]',el).filter(x=>x.checked).map(x=>+x.dataset.j);save();$('.model .lbl',el).textContent=`Puntos clave · ${ST.open[k].length}/${$$('input[type=checkbox]',el).length}`;});});}

// ---------- repaso: fallos, trampas y fichas del tema ----------
function renderRepaso(body,t){let flip={};
const draw=()=>{const qs=QUESTIONS.filter(q=>q.t===t.id&&ST.fails[q.id]);const cs=CARDS.map((c,i)=>({c,i})).filter(x=>x.c[0]===t.id);const known=cs.filter(x=>ST.cards[x.i]==='ok').length;
body.innerHTML=`<div class="subhead"><h2>Trampas</h2><span>Lo que más se falla en ${t.code}</span></div>
<ul class="traps">${(TRAPS[t.id]||[]).map(x=>`<li>${x}</li>`).join('')}</ul>
<div class="subhead"><h2>Fichas</h2><span>${known}/${cs.length} sabidas · di la respuesta antes de girar</span></div>
<div class="cards">${cs.map(({c,i})=>`<div class="card${ST.cards[i]==='ok'?' ok':''}"><span class="f">${c[1]}</span>${flip[i]?`<span class="b">${c[2]}</span>`:''}<div class="acts"><button data-flip="${i}">${flip[i]?'Ocultar':'Girar'}</button><button data-ok="${i}">${ST.cards[i]==='ok'?'✓ Sabida':'Me la sé'}</button>${ST.cards[i]==='ok'?`<button data-no="${i}">Repasar</button>`:''}</div></div>`).join('')}</div>
<div class="subhead"><h2>Tus fallos</h2><span>${qs.length?qs.length+' pendientes. Al acertarlas desaparecen.':''}</span></div>
${qs.length?'<div class="qlist" id="fl"></div>':'<div class="empty">Sin fallos pendientes en este tema.</div>'}`;
const fl=$('#fl',body);if(fl)qs.forEach((q,i)=>fl.appendChild(qCard(q,i+1)));
$$('[data-flip]',body).forEach(b=>b.onclick=()=>{flip[b.dataset.flip]=!flip[b.dataset.flip];draw();});
$$('[data-ok]',body).forEach(b=>b.onclick=()=>{ST.cards[b.dataset.ok]='ok';save();draw();});
$$('[data-no]',body).forEach(b=>b.onclick=()=>{delete ST.cards[b.dataset.no];save();draw();});};draw();}

// ---------- simulacro ----------
function renderSimulacro(app){let cfg={n:20,lv:'mix',temas:TOPICS.map(t=>t.id),pen:true};
const setup=()=>{app.innerHTML=`<header class="topichead"><h1>Simulacro</h1><p>Sin corrección hasta entregar, como en el examen. Un minuto por pregunta.</p></header>
<div class="setup"><div><span class="lbl">Preguntas</span><div class="row">${[10,20,30,40].map(n=>`<button class="chip" aria-pressed="${cfg.n===n}" data-n="${n}">${n}</button>`).join('')}</div></div>
<div><span class="lbl">Nivel</span><div class="row">${[['mix','Mezcla'],['n','Normal'],['d','Difícil']].map(([k,l])=>`<button class="chip" aria-pressed="${cfg.lv===k}" data-lv="${k}">${l}</button>`).join('')}</div></div>
<div><span class="lbl">Temas</span><div class="row">${TOPICS.map(t=>`<button class="chip" aria-pressed="${cfg.temas.includes(t.id)}" data-t="${t.id}">${t.code}</button>`).join('')}</div></div>
<div><span class="lbl">Penalización</span><div class="row"><button class="chip" aria-pressed="${cfg.pen}" data-pen="1">Restar 1/3 por fallo</button><button class="chip" aria-pressed="${!cfg.pen}" data-pen="0">Sin penalización</button></div></div>
<div><button class="btn y" id="go">Empezar</button></div></div>`;
$$('[data-n]',app).forEach(b=>b.onclick=()=>{cfg.n=+b.dataset.n;setup();});$$('[data-lv]',app).forEach(b=>b.onclick=()=>{cfg.lv=b.dataset.lv;setup();});
$$('[data-t]',app).forEach(b=>b.onclick=()=>{const t=b.dataset.t;cfg.temas=cfg.temas.includes(t)?cfg.temas.filter(x=>x!==t):[...cfg.temas,t];if(!cfg.temas.length)cfg.temas=[t];setup();});
$$('[data-pen]',app).forEach(b=>b.onclick=()=>{cfg.pen=b.dataset.pen==='1';setup();});$('#go').onclick=start;};
const start=()=>{let pool=QUESTIONS.filter(q=>cfg.temas.includes(q.t)&&(cfg.lv==='mix'||q.lv===cfg.lv));pool=shuffleIdx(pool.length).map(i=>pool[i]).slice(0,cfg.n);
const picks={};let left=pool.length*60;
app.innerHTML=`<div class="simbar"><span class="timer mono" id="tm"></span><span class="score" id="pr">0 / ${pool.length} respondidas</span><button class="btn y" id="fin">Entregar</button></div><div class="qlist"></div>`;
const list=$('.qlist',app);pool.forEach((q,i)=>list.appendChild(qCard(q,i+1,{exam:true,showTopic:true,onPick:oi=>{picks[q.id]=oi;$('#pr').textContent=`${Object.keys(picks).length} / ${pool.length} respondidas`;}})));
const tick=()=>{const m=Math.floor(left/60),s=left%60;$('#tm').textContent=`${m}:${String(s).padStart(2,'0')}`;if(left<=0){finish();}left--;};tick();timerInt=setInterval(tick,1000);
const finish=()=>{clearInterval(timerInt);let ok=0,ko=0;pool.forEach(q=>{if(picks[q.id]===undefined)return;const g=picks[q.id]===q.a;g?ok++:ko++;record(q,g);});
const blank=pool.length-ok-ko, raw=ok/pool.length*10, pen=Math.max(0,(ok-ko/3)/pool.length*10);
app.innerHTML=`<div class="result"><span class="lbl">Resultado</span><div class="big">${nf(cfg.pen?pen:raw,2)} / 10</div><p>${ok} aciertos · ${ko} fallos · ${blank} en blanco. Sin penalización: <b>${nf(raw,2)}</b>; con −1/3: <b>${nf(pen,2)}</b>.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn y" id="rep">Otro simulacro</button><a class="btn ghost" href="#inicio" style="text-decoration:none">Volver a los temas</a></div></div><div class="subhead"><h2>Corrección</h2><span>Las falladas quedan en el Repaso de su tema.</span></div><div class="qlist" id="corr"></div>`;
const corr=$('#corr');pool.forEach((q,i)=>{const pk=picks[q.id];const el=document.createElement('div');el.className='q';el.innerHTML=`<div class="qh"><span class="qn">${i+1} · ${TOPIC[q.t].code} · ${LV[q.lv]}</span><span class="qt">${q.q}</span></div><div class="opts">${q.o.map((o,oi)=>`<div class="opt ${oi===q.a?'ok':oi===pk?'ko':''}"><span class="lt">${oi===q.a?'✓':oi===pk?'✗':''}</span><span>${o}</span></div>`).join('')}</div><div class="expl ${pk===q.a?'':'ko'}">${pk===undefined?'<b>En blanco.</b> ':''}${q.e}</div>`;corr.appendChild(el);});
$('#rep').onclick=setup;renderNav('simulacro');window.scrollTo(0,0);};
$('#fin').onclick=finish;};setup();}

route();
</script></body></html>
