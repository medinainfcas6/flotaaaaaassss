id:'ud2b',code:'2B',loc:'PASILLO 2 · NIVEL B',color:'#D69A00',
title:'Operativa de almacén y dimensionamiento',
blurb:'Funciones del almacén y todo el cálculo: nº de equipos, ciclo simple y combinado, pasillo estrecho, envíos múltiples, rutas y turnos. Incluye los 12 ejercicios del Excel y la práctica de aula.',
study:[
{id:'areas',h:'Áreas operacionales y funciones logísticas',html:`
<p><b>Áreas operacionales</b> ${JH}${PR}: <b>manutención</b> (todo movimiento físico, manual o automático), <b>manipulación</b> (cambia la presentación o la unidad de carga sin cambiar el producto: etiquetado, embolsado, packs), <b>consolidación</b> (agrupar productos con destino o cliente común) y <b>disgregación</b> (separar lo recibido por destinos, típico de paquetería).</p>
<p><b>Funciones</b>, en el orden del flujo: recepción → almacenaje → preparación de pedidos → expedición.</p>
<div class="grid2">
<div class="mini"><h4>Recepción (4 fases)</h4><ol><li>Antes de la llegada: orden de compra con todos los datos, planificar muelle, medios y personal.</li><li>Verificación documental (albarán contra pedido) y visual + descarga.</li><li>Control de calidad si hay acuerdo con el proveedor (conteo, caducidad, lote; cuarentena o devolución).</li><li>Entrada y ubicación, registro en el WMS/ERP.</li></ol></div>
<div class="mini"><h4>Almacenaje (7 fases)</h4><ol><li>Transporte interno a la zona.</li><li>Asignación de ubicación: manual (fija o aleatoria) o automática por WMS.</li><li>Colocación.</li><li>Confirmación (código de barras, RFID).</li><li>Reubicaciones internas (muy costosas).</li><li>Reposición a picking.</li><li>Control de condiciones.</li></ol><p>Medios: bloque apilado, convencional, doble profundidad, compacta, dinámica, móvil, rotativos, mezzanine, autoportante.</p></div>
<div class="mini"><h4>Preparación de pedidos</h4><p>Recoger, combinar y agrupar lo que pide un cliente. Dos alternativas: reserva y picking <b>no diferenciados</b> (se prepara desde los mismos palés de almacenaje) o <b>diferenciados</b> (zona de picking propia con reposición). Fases: organización, <b>desplazamiento (hasta el 50 % del tiempo)</b>, extracción, consolidación y embalaje. Tecnologías: papel, escáner, pick-to-light, pick-to-voice.</p></div>
<div class="mini"><h4>Expedición</h4><p>Última fase. Tipos de salida (materia prima, semielaborado, acabado, auxiliar, logística inversa) que condicionan los recursos. Fases: consolidación → control documental → embalaje final → carga → salida. Regla: <b>lo que se descarga primero se carga al final</b>.</p></div>
</div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>En tus apuntes las dos alternativas de picking salen como "no diferenciada" e "indiferenciada", que significan lo mismo. La segunda es <b>diferenciada</b>: el picking se hace en un área distinta a la de reserva.</div>`},
{id:'dimen',h:'Qué se dimensiona',html:`
<p>${PR} Tres bloques de necesidades: <b>capacidades y superficies</b> (nº de muelles, recepción y expedición, volúmenes, parking, maniobras), <b>personal</b> (descarga, ubicación, movimientos internos, picking, expedición, servicios generales; todo se traduce en tiempos de trabajo) y <b>elementos de manutención</b> (carretillas, trilaterales, transelevadores, AGV, transpaletas, recogepedidos).</p>
<p>La simulación informática hace lo mismo con más detalle: parámetros iniciales → cálculo → parámetros correctores (legales y de método de trabajo).</p>`},
{id:'formula',h:'Fórmula del número de vehículos',html:`
<div class="formula">Vehículos = <span class="y">(1 + k)</span> · (Nº mov · t<sub>unitario</sub>) / Plazo disponible  →  <span class="y">redondear al alza</span></div>
<ul>
<li><b>Nº de movimientos</b>: operaciones previstas (promedio o máximo previsible).</li>
<li><b>Tiempo unitario</b>: tiempo medio por movimiento, suma de sus operaciones elementales con velocidades nominales. Es un valor <b>estadístico</b>. En transelevadores es el <b>tiempo de ciclo</b> (dato puntual de un ciclo completo).</li>
<li><b>Plazo</b>: periodo en que deben hacerse los movimientos, en la <b>misma unidad</b> que el tiempo.</li>
<li><b>k</b>: coeficiente de seguridad por interferencias y operaciones menores. Se <b>suma</b>: +30 % picking y +20 % interferencias → k = 0,5. +60 % reserva → k = 0,6.</li>
</ul>
<div class="call porque"><b>Por qué se redondea siempre al alza</b>Si te sale 4,5 carretillas, 4 no llegan a hacer el trabajo en el plazo. Redondear a 4 es infradimensionar; por eso 1,57 → 2 aunque la segunda vaya medio vacía.</div>
<div class="call ojo"><b>Utilización real</b>Utilización = valor exacto / equipos enteros (o horas de trabajo / horas disponibles). Con 1,57 → 2 carretillas, la utilización es 78,5 %. Es la pregunta crítica que suele venir detrás.</div>`},
{id:'ciclos',h:'Tiempo de ciclo simple y combinado',html:`
<p><b>Ciclo simple</b> ${JH}${PR} ("entra vacío, sale lleno" o al revés): desplazamiento E/S → ubicación, recogida, retorno, descarga. Ida ≈ vuelta y recogida ≈ descarga. Productividad = 3.600 / T (s) movimientos/hora.</p>
<p><b>Ciclo combinado</b> ("entra lleno, sale lleno"): recoge en E/S → va a ubicación → deja → va a otra ubicación → recoge → vuelve → deja. Se hace cuando hay entradas y salidas pendientes, porque aprovecha el viaje de vuelta. Puede <b>reducirse un 20 %</b> si se elige extraer la carga más cercana a la recién almacenada.</p>
<h4>Pasillo estrecho (trilateral o transelevador, elevación y traslación simultáneas)</h4>
<div class="formula">T<sub>cs</sub> = v<sub>x</sub>·Z² / (3·v<sub>z</sub>²·X) + X / v<sub>x</sub> + <span class="y">2·T<sub>rd</sub></span></div>
<div class="formula">T<sub>cd</sub> = X/(30·v<sub>x</sub>) · ( 40 + 15·v<sub>x</sub>²·Z² / (v<sub>z</sub>²·X²) − v<sub>x</sub>³·Z³ / (v<sub>z</sub>³·X³) ) + <span class="y">4·T<sub>rd</sub></span></div>
<p>X = longitud de la estantería, Z = altura, v<sub>x</sub> y v<sub>z</sub> = velocidades horizontal y vertical, T<sub>rd</sub> = tiempo de recogida o descarga. 2·T<sub>rd</sub> en el simple (recoger + dejar), 4·T<sub>rd</sub> en el combinado (dos recogidas y dos descargas).</p>
<p>Ejemplo de clase (simple): X = 60, Z = 18, v<sub>x</sub> = 3, v<sub>z</sub> = 0,8, T<sub>rd</sub> = 6 → 8,44 + 20 + 12 = <b>40,44 s → 89 ciclos/h</b>.</p>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes definen los ciclos pero no tienen ninguna fórmula. Te faltan las de pasillo estrecho, la reducción del 20 % y la diferencia tiempo unitario / tiempo de ciclo.</div>
<div class="call porque"><b>Lectura crítica de la fórmula</b>T<sub>cs</sub> supone que domina el recorrido horizontal (X/v<sub>x</sub> ≥ Z/v<sub>z</sub>). En el ejemplo de clase, Z/v<sub>z</sub> = 22,5 s es algo mayor que X/v<sub>x</sub> = 20 s y la profesora la aplica igual. En el examen aplícala tal cual; si te piden comentar, puedes mencionarlo.</div>`},
{id:'vel',h:'Velocidades de referencia',html:`
<div class="tw"><table><thead><tr><th>Carretilla</th><th class="n">Horizontal con/sin carga</th><th class="n">Elevación con/sin</th><th class="n">Descenso con/sin</th><th class="n">Tomar/dejar</th></tr></thead><tbody>
<tr><td>Retráctil</td><td class="n">2,5 / 2,8</td><td class="n">0,35 / 0,45</td><td class="n">0,45 / 0,40</td><td class="n">8 s</td></tr>
<tr><td>Recogepedidos</td><td class="n">1,8 / 2,0</td><td class="n">0,15 / 0,20</td><td class="n">0,20 / 0,25</td><td class="n">N/A</td></tr>
<tr><td>Trilateral</td><td class="n">2,0 / 2,3</td><td class="n">0,20 / 0,25</td><td class="n">0,35 / 0,40</td><td class="n">8 s</td></tr></tbody></table></div>
<p>m/s. "Velocidades más desfavorables" = las <b>con carga</b> (las más lentas). Fíjate en que con carga se sube más despacio pero se baja más rápido.</p>
<div class="call mal"><b>Erratas en la solución del SP 4</b>La tabla de solución usa 0,40 m/s para elevar 65 cm descargada (la tabla da 0,45 → 1,44 s) y pone 1,11 s al descender 65 cm cargada, cuando 0,65 / 0,45 = 1,44 s. Por eso suma 61,34 s. Con las velocidades correctas sale 61,46 s, justo el valor que usa la diapositiva siguiente. El resultado (2 carretillas) no cambia.</div>`},
{id:'linea',h:'Aprovisionamiento a línea, envíos múltiples y turnos (Excel y práctica de aula)',html:`
<p>${XL}${PR} Los ejercicios del Excel y la práctica de aula usan la misma lógica con carretillas remolcadoras, AGV o trenes:</p>
<div class="formula">Ciclo = transporte (ida + vuelta) + manipulaciones · Carga de trabajo (h) = viajes · ciclo / 3.600</div>
<div class="formula">Equipos = <span class="y">(1+k)</span> · viajes · ciclo / (horas efectivas · 3.600 · turnos) → al alza · Utilización = exacto / entero</div>
<ul>
<li><b>Viajes por referencia</b> (Datos.xlsx): demanda diaria / capacidad de la unidad de carga, <b>redondeado al alza</b> por referencia (no puedes mandar 0,3 palés). Después se suman por almacén con SUMAR.SI.CONJUNTO.</li>
<li><b>Envíos múltiples</b> (q unidades por viaje): viajes = ⌈N / q⌉; el trayecto se recorre <b>una vez</b> por viaje y la manipulación se repite <b>q veces</b>. Ganas transporte, no manipulación: cuanto más pesa la manipulación en el ciclo, menos se ahorra.</li>
<li><b>Ruta o milk-run</b> con n paradas: n + 1 tramos (almacén → P1 → … → Pn → almacén), n paradas y la carga/descarga en almacén si la hay.</li>
<li><b>Turnos</b>: repartir el trabajo en 2 turnos divide el valor exacto entre 2 y reduce <b>equipos</b>, pero <b>conductores = equipos × turnos</b>, que puede subir.</li>
<li><b>Flota por almacén vs flota única</b>: cada almacén redondea su fracción al alza y esa holgura no se comparte. Sumar horas y redondear una vez da igual o menos equipos, pero solo si las carretillas pueden moverse libremente entre almacenes.</li>
</ul>
<div class="call porque"><b>Qué falta en el ciclo teórico (pregunta j de la práctica)</b>Esperas en la botonera o en el almacén, interferencias y cruces en pasillos, picos de demanda, averías y cambio o carga de batería, pausas del conductor, maniobras de enganche y errores de suministro. Por eso en la realidad se aplica k aunque la práctica no lo haga.</div>
<div class="call mal"><b>Erratas que he visto en el Excel</b>Ejercicio 11: el enunciado dice 80 m pero la celda usa 350 m (el resultado del Excel corresponde a 350). Ejercicio 7: la manipulación por palé es 160 s (70 + 90) y omite los 70 s de dejar el vacío que sí cuenta el ejercicio 1; es un enunciado distinto, no lo mezcles. Ejercicio 11 dice "cada almacén" pero solo da el de granza.</div>`}
],

study:[
{id:'que',h:'Qué son y para qué sirven',html:`
<p>${JH}${PR} Integran <b>telecomunicaciones, informática y sensores</b> para gestionar datos de flotas, mercancías, conductores y procesos de forma <b>remota y en tiempo real</b>. Se usan en transporte, almacenes, distribución urbana, intermodalidad y logística inversa.</p>
<p>Objetivo principal: mejorar <b>eficiencia, seguridad y trazabilidad</b> y facilitar decisiones desde el centro de control o el terreno. Su valor aumenta al integrarse con <b>ERP, WMS y TMS</b>.</p>
<p>Objetivos clave: optimizar recursos; reducir tiempos, errores e incidencias; mejorar la calidad del servicio; aumentar seguridad y trazabilidad.</p>
<h4>Problemas que resuelven (identificarlos antes de implantar)</h4>
<ol><li>No saber dónde están vehículos o mercancías.</li><li>Falta de coordinación entre operadores, clientes y almacenes.</li><li>Retrasos y rutas poco eficientes.</li><li>Errores en la documentación comercial y de transporte.</li><li>Falta de trazabilidad o de datos para la mejora continua.</li><li>Dependencia del papel y de procesos manuales.</li></ol>
<div class="call porque"><b>Por qué "antes de implantar"</b>La tecnología se elige por el problema que resuelve. Un GPS no arregla un problema de documentación; un FMS no arregla una ruta mal diseñada si nadie mira los datos.</div>`},
{id:'loc',h:'Localización de flotas',html:`
<p>${JH}${PR} Localizar en tiempo real vehículos o mercancías, registrar eventos e integrarlos con ERP, TMS o FMS. Componentes:</p>
<div class="tw"><table><thead><tr><th>Componente</th><th>Qué hace</th><th>En el ejemplo del camión en Valencia</th></tr></thead><tbody>
<tr><td><b>GNSS</b> (GPS, Galileo)</td><td>Calcula la posición por satélite</td><td>Coordenadas → "calle X, Valencia"</td></tr>
<tr><td><b>Comunicaciones móviles</b></td><td>Envían los datos al sistema de la empresa</td><td>La red móvil manda la posición</td></tr>
<tr><td><b>Tacógrafo digital</b></td><td>Registra conducción y descanso (Reglamento (CE) 165/2014)</td><td>Lleva 3 h conduciendo, le queda 1 h 30 min para la pausa</td></tr>
<tr><td><b>Sensores</b></td><td>Apertura de puertas, temperatura, impactos</td><td>La carga está a 4 °C, en rango</td></tr>
</tbody></table></div>
<p>Ventajas: seguimiento continuo, mejor planificación de rutas y tiempos, <b>menos km en vacío</b> y más control para empresa y cliente.</p>
<div class="call ojo"><b>Ojo examen</b>El GNSS calcula la posición pero <b>no la transmite</b>: eso lo hacen las comunicaciones móviles. Pregunta trampa típica.</div>`},
{id:'fms',h:'Sistemas de gestión de flotas (FMS)',html:`
<p>${JH}${PR} Sistema digital que conecta datos del vehículo, del conductor y del entorno para supervisar, coordinar y optimizar la flota.</p>
<div class="tw"><table><thead><tr><th>Función</th><th>Ejemplo</th></tr></thead><tbody>
<tr><td>Registro de rutas y tiempos</td><td>Saber si el camión 7 hizo una parada no autorizada</td></tr>
<tr><td>Monitorización de consumo</td><td>Gasto excesivo de combustible en el camión 12</td></tr>
<tr><td>Alertas de conducción agresiva</td><td>Frenadas bruscas o exceso de velocidad</td></tr>
<tr><td>Gestión de turnos y asignación de servicios</td><td>Reasignar rutas si falta un conductor</td></tr>
<tr><td>Control de costes por vehículo y unidad</td><td>Comparar rentabilidad entre vehículos por ruta</td></tr></tbody></table></div>
<p>Ventajas: <b>ahorro operativo</b> (consumo y estilo de conducción → combustible, neumáticos, averías), <b>seguridad</b> del conductor, <b>cumplimiento normativo</b> (conducción y descanso) y <b>planificación dinámica</b> ante imprevistos.</p>`},
{id:'nuevas',h:'Nuevas tecnologías',html:`
<div class="tw"><table><thead><tr><th>Tecnología</th><th>Qué es</th><th>Ejemplo de clase</th><th>Aporta</th></tr></thead><tbody>
<tr><td><b>IoT</b></td><td>Sensores en vehículos, paquetes o infraestructuras (temperatura, humedad, vibración, posición)</td><td>Vacunas: temperatura cada minuto, alerta fuera de +2 / +8 °C</td><td>Trazabilidad, menos pérdidas, condiciones aseguradas</td></tr>
<tr><td><b>IA</b></td><td>Algoritmos que analizan datos</td><td>Predice atasco en la A-3 y propone alternativa; mantenimiento predictivo</td><td>Eficiencia, menos tiempo</td></tr>
<tr><td><b>Big Data</b></td><td>Datos con <b>volumen, variedad, velocidad y variabilidad</b></td><td>Millones de entregas → zonas y rutas menos rentables</td><td>Decisiones estratégicas</td></tr>
<tr><td><b>Blockchain</b></td><td>Registro distribuido, resistente a la manipulación; una transacción registrada no se modifica</td><td>Walmart y los mangos: rastrear el origen pasó de casi 7 días a 2,2 s</td><td>Trazabilidad e integridad, pero <b>no garantiza que el dato introducido sea cierto</b></td></tr>
</tbody></table></div>
<div class="call contra"><b>Contraste JH ↔ profesora</b>Tus apuntes están bien, pero les falta el TMS en la integración, las 4 V del Big Data y el límite del blockchain (garantiza que no se altera, no que sea verdad). Ese límite es carne de pregunta difícil.</div>`}
],

a:`El <b>GNSS</b> (GPS, Galileo) calcula la posición del camión, que se traduce en "calle X, Valencia". Las <b>comunicaciones móviles</b> envían esa posición al sistema de la empresa. El <b>tacógrafo digital</b> registra conducción y descanso (Reglamento CE 165/2014): sabemos que lleva 3 h conduciendo y le queda 1 h 30 min para la pausa. Los <b>sensores</b> detectan apertura de puertas, temperatura o impactos: la carga va a 4 °C, dentro de rango. Integrado con ERP o TMS, permite seguimiento continuo, mejor planificación de rutas y tiempos, menos km en vacío y más control para empresa y cliente.`},

{id:'sp1',tag:'SP 1 · PROF · EXCEL 02',title:'Retráctiles para 480 movimientos al día',
enun:`Almacén de alimentación con palés completos y carretillas retráctiles. 480 movimientos/día (entradas + salidas), 3 min por movimiento (incluye desplazamiento, elevación y colocación), plazo 8 h. k: +30 % por preparación de pedidos y +20 % por interferencias en pasillos. ¿Cuántas retráctiles hacen falta?`,
plan:`Fórmula del nº de vehículos. Los dos coeficientes se <b>suman</b>: k = 0,3 + 0,2 = 0,5 (no se multiplican 1,3 · 1,2). Pasa tiempo y plazo a la misma unidad.`,
sol:`1,5 · 480 · 180 / 28.800 = <b>4,5 → 5 retráctiles</b>. Utilización: 4,5 / 5 = 90 %. Si hubieras multiplicado (1,3 · 1,2 = 1,56) saldrían 4,68 → 5: mismo entero, pero el método está mal y en otro enunciado cambiaría el resultado.`,
calc:{id:'nveh',preset:{N:480,t:180,plazo:8,k:0.5}}},
{id:'sp2',tag:'SP 2 · PROF',title:'400 palés a la semana',
enun:`Se reciben 400 palés/semana que se almacenan en estantería convencional. Cada movimiento (ir, cargar o descargar, volver) dura 2 min. Jornada efectiva de 40 h semanales. a) Movimientos por semana. b) Tiempo con una sola carretilla. c) Carretillas necesarias sin horas extra.`,
plan:`Un palé que entra = un movimiento. El plazo es la semana (40 h). Sin coeficiente de seguridad.`,
sol:`a) <b>400 movimientos</b>. b) 400 · 2 = 800 min = <b>13,3 h</b>. c) 13,3 / 40 = 0,33 → <b>1 carretilla</b>, utilizada un 33 %. Lectura crítica: sobra capacidad; esa carretilla podría hacer también expediciones o picking.`,
calc:{id:'nveh',preset:{N:400,t:120,plazo:40,k:0}}},
{id:'sp3',tag:'SP 3 · PROF',title:'Ciclo simple de una retráctil',
enun:`Una retráctil recoge palés en convencional y los deja en la zona de picking. Desplazamiento hasta la ubicación 1 min, carga o descarga 30 s, retorno 1 min. a) Tiempo de ciclo simple. b) Movimientos por hora. c) ¿Y si el desplazamiento baja a 45 s?`,
plan:`Ciclo simple = ida + recogida + vuelta + descarga. Productividad = 3.600 / T. Para c) cambia ida y vuelta a 45 s.`,
sol:`a) 60 + 30 + 60 + 30 = <b>180 s = 3 min</b>. b) 3.600 / 180 = <b>20 mov/h</b>. c) 45 + 30 + 45 + 30 = 150 s → <b>24 mov/h</b> (+20 %). Reducir el recorrido 15 s por sentido ahorra un 17 % del ciclo: por eso se ubica lo de más rotación cerca de E/S.`,
calc:{id:'csimple',preset:{ida:60,rec:30,vuelta:60,desc:30}}},
{id:'sp4',tag:'SP 4 · PROF',title:'Retráctiles desde la cinta de fábrica (tabla de operaciones)',
enun:`Almacenar 2.150 palés/semana desde la cinta de salida de fábrica con retráctiles. La retráctil está frente a la cinta con las horquillas en el suelo; la cinta está a 65 cm; el hueco está a 35 m y 3 m de altura. 8 h/día, 7,5 efectivas. Velocidades de la tabla de la retráctil.`,
plan:`Descompón el ciclo en operaciones elementales: cada una es elevación (E), descenso (D) u horizontal (H), cargada o no. Tiempo = distancia / velocidad con la velocidad que toque. Suma los 8 s de tomar y de dejar. Plazo = 7,5 h · 5 días. La solución de la profesora aplica k = 0,6 (+60 % reserva) aunque el enunciado no lo dice.`,
sol:`Ciclo = <b>61,46 s</b> con las velocidades de la tabla (la tabla de la solución pone 61,34 por dos erratas, ver abajo). Vehículos = 1,6 · 2.150 · 61,46 / (37,5 · 3.600) = 1,6 · 0,979 = <b>1,57 → 2 retráctiles</b>. Sin k serían 0,98 → 1, al límite: una sola carretilla trabajaría al 98 % sin margen para averías ni picos. Eso justifica el coeficiente.<div class="call mal"><b>Erratas de la tabla de solución</b>La fila 1 usa 0,40 m/s para elevar descargada (la tabla de velocidades da 0,45 → 1,44 s, no 1,63) y la fila 3 pone 1,11 s para descender 0,65 m a 0,45 m/s, cuando 0,65 / 0,45 = 1,44 s. Con las velocidades correctas la suma da exactamente 61,46 s, que es el valor que la profesora usa en la diapositiva siguiente. Si en el examen te sale 61,46, está bien.</div>`,
calc:{id:'ops',preset:{N:2150,plazo:37.5,k:0.6,rows:[['Eleva 65 cm descargada',0.65,0.45,0],['Recoge el palé en la cinta',0,0,8],['Desciende 65 cm cargada',0.65,0.45,0],['Se desplaza 35 m al hueco, cargada',35,2.5,0],['Eleva 3 m cargada',3,0.35,0],['Deposita el palé',0,0,8],['Desciende 3 m descargada',3,0.40,0],['Vuelve 35 m a la cinta, descargada',35,2.8,0]]}}},
{id:'ej-cs',tag:'EJEMPLO · PROF',title:'Ciclo simple en pasillo estrecho',
enun:`Estantería de X = 60 m y Z = 18 m, v<sub>x</sub> = 3 m/s, v<sub>z</sub> = 0,8 m/s, T<sub>rd</sub> = 6 s. Tiempo de ciclo simple y ciclos por hora.`,
plan:`Fórmula T<sub>cs</sub>. Calcula por partes: término de altura, término horizontal y 2·T<sub>rd</sub>.`,
sol:`8,44 + 20 + 12 = <b>40,44 s</b> → 3.600 / 40,44 = <b>89 ciclos/h</b>.`,
calc:{id:'cs_pe',preset:{X:60,Z:18,vx:3,vz:0.8,Trd:6}}},
{id:'sp5',tag:'SP 5 · PROF',title:'Trilateral hombre arriba en ciclo combinado',
enun:`Una trilateral hombre arriba sirve palés incompletos a 4 puestos de picking: a) recoge un palé en el puesto y recorre 6 m hasta el pasillo (40 m de largo, 10 m de alto); b) con elevación y traslación simultáneas lo deja en un hueco aleatorio y retira otro; c) lleva el nuevo al puesto y lo deja. Velocidades más desfavorables. Productividad media en palés/hora.`,
plan:`Es un ciclo <b>combinado</b> en pasillo estrecho (deja uno y saca otro en el mismo viaje). "Más desfavorables" = con carga: v<sub>x</sub> = 2,0, v<sub>z</sub> = 0,20. Fuera del pasillo hay que sumar 6 m de ida y 6 m de vuelta y la recogida y el depósito en el puesto (8 + 8 s).`,
sol:`T<sub>cd</sub> = 0,667 · (40 + 93,75 − 15,63) + 4 · 8 = 78,75 + 32 = 110,75 s. + 6 s de desplazamiento + 16 s de operaciones extra = <b>132,75 s → 27 palés/h</b>.`,
calc:{id:'cd_pe',preset:{X:40,Z:10,vx:2,vz:0.2,Trd:8,dext:6,vext:2,textra:16}}},
{id:'xl01',tag:'EXCEL 01 · PA ACT. 1',title:'Ciclo de una carretilla remolcadora',
enun:`Recoge un palé lleno en el almacén (70 s), lo lleva a la estación (100 m a 1,5 m/s), deja el lleno y carga un vacío (90 s), vuelve (100 m a 1,5 m/s) y deja el vacío en el almacén (70 s). a) Tiempo de ciclo. b) % transporte y % manipulación. c) Ciclos por hora y en un turno de 7,5 h.`,
plan:`Transporte = 2 · 100 / 1,5. Manipulación = 70 + 90 + 70. Productividad = 3.600 / ciclo.`,
sol:`Transporte 133,3 s + manipulación 230 s = <b>363,3 s</b>. 36,7 % transporte, <b>63,3 % manipulación</b>. 9,9 ciclos/h y 74,3 por turno (74 completos). Lectura: casi dos tercios del ciclo es manipulación, así que mejorar la velocidad apenas ayuda; agrupar envíos solo recorta el 37 % de transporte.`,
calc:{id:'linea',preset:{trec:70,test:90,tdesc:70,d:100,v:1.5,q:1,N:0,h:7.5,turnos:1,k:0}}},
{id:'xl03',tag:'EXCEL 03',title:'Reach stackers en terminal portuaria',
enun:`Engancha el contenedor (40 s), lo lleva 150 m a 3 m/s, lo deposita y asegura (40 s) y vuelve en vacío 150 m a 3 m/s. 620 contenedores por turno de 7,5 h. a) Ciclo y contenedores/hora. b) Nº de reach stackers.`,
plan:`Aquí no hay tercera manipulación (vuelve vacío y no deja nada). Sin k.`,
sol:`100 + 80 = <b>180 s → 20 cont/h</b>. Carga: 620 · 180 / 3.600 = 31 h → 31 / 7,5 = 4,13 → <b>5 reach stackers</b>. La quinta trabaja muy poco (utilización media 83 %); si se pudiera alargar el turno 20 min, bastarían 4.`,
calc:{id:'linea',preset:{trec:40,test:40,tdesc:0,d:150,v:3,q:1,N:620,h:7.5,turnos:1,k:0}}},
{id:'xl04',tag:'EXCEL 04',title:'Congelados: dos zonas de velocidad',
enun:`Recoge el palé en muelle (50 s), recorre 60 m templados a 2 m/s, entra 80 m en cámara a 1 m/s, deja el palé (50 s), vuelve por los mismos tramos y deposita en vacío (50 s). 300 palés/día, turno de 7,5 h, k = 0,3. a) Ciclo. b) Carretillas. c) % del ciclo perdido por la velocidad reducida en cámara.`,
plan:`Tabla de operaciones con dos velocidades. Para c), compara el tiempo en cámara a 1 m/s con el que sería a 2 m/s: la diferencia es lo que se pierde.`,
sol:`Ciclo = 60 + 160 + 150 = <b>370 s</b>. Carretillas = 1,3 · 300 · 370 / 27.000 = 5,34 → <b>6</b>. c) En cámara se tarda 160 s; a 2 m/s serían 80 s: se pierden <b>80 s = 21,6 %</b> del ciclo. (En el Excel la celda pone "% del ciclo en cámara" pero calcula 80/370, que coincide con lo perdido porque 160 − 80 = 80.)`,
calc:{id:'ops',preset:{N:300,plazo:7.5,k:0.3,rows:[['Recoge en muelle',0,0,50],['Tramo templado ida',60,2,0],['Tramo cámara ida',80,1,0],['Deja el palé en cámara',0,0,50],['Tramo cámara vuelta',80,1,0],['Tramo templado vuelta',60,2,0],['Deposita en vacío en muelle',0,0,50]]}}},
{id:'xl05',tag:'EXCEL 05',title:'Cross-docking: flota por muelle o flota única',
enun:`Tres muelles con 210, 165 y 285 movimientos/día; ciclo de 180 s; 7,5 h efectivas; sin k. a) Carretillas por muelle y utilización. b) ¿Y con flota única redondeando al final?`,
plan:`Calcula horas y valor exacto por muelle, redondea cada uno, y luego suma horas y redondea una sola vez.`,
sol:`Por muelle: 1,4 → 2 · 1,1 → 2 · 1,9 → 2 = <b>6</b> (utilizaciones 70 %, 55 %, 95 %). Única: 33 h / 7,5 = 4,4 → <b>5</b>. La diferenciada pide una más porque cada muelle redondea su fracción y esa holgura no se comparte. La única solo es viable si las carretillas pueden moverse libremente entre muelles.`,
calc:{id:'flotas',preset:{ciclo:180,h:7.5,turnos:1,k:0,lista:'Muelle 1:210; Muelle 2:165; Muelle 3:285'}}},
{id:'xl06',tag:'EXCEL 06',title:'Cuatro almacenes, una o cuatro flotas',
enun:`Almacenes A1–A4 con 180, 240, 300 y 90 viajes/día; ciclo de 250 s; 7,5 h; sin k. a) Carretillas por almacén. b) Utilización. c) Flota única con un solo redondeo.`,
plan:`Igual que el anterior.`,
sol:`2 + 3 + 3 + 1 = <b>9</b> con flotas separadas; única 56,25 / 7,5 = 7,5 → <b>8</b>. Una carretilla de diferencia por los redondeos.`,
calc:{id:'flotas',preset:{ciclo:250,h:7.5,turnos:1,k:0,lista:'A1:180; A2:240; A3:300; A4:90'}}},
{id:'xl07',tag:'EXCEL 07',title:'Envíos de 1, 2, 3 y 4 palés por viaje',
enun:`1.767 palés/día a la línea. Por palé, 160 s de manipulación (70 recoger + 90 estación); el trayecto de ida y vuelta (100 m a 1,5 m/s cada sentido) se hace una vez por viaje. Turno de 7,5 h y k = 0,35. Compara las carretillas enviando de 1 en 1 hasta 4 en 4. ¿Qué se observa?`,
plan:`Viajes = ⌈1.767 / q⌉. Ciclo del viaje = 133,3 + q · 160. Equipos = (1 + k) · viajes · ciclo / 27.000.`,
sol:`26 → 21 → 19 → <b>18</b> carretillas. El ahorro es cada vez menor (−5, −2, −1) porque solo se ahorra transporte (133 s por viaje) y la manipulación, que es la mayor parte, se mantiene. Además, agrupar implica más stock en línea y carros más grandes.`,
calc:{id:'multi',preset:{N:1767,manip:160,d:100,v:1.5,tfijo:0,h:7.5,k:0.35,qmax:4,turnos:1}}},
{id:'xl08',tag:'EXCEL 08',title:'AGV en un hospital',
enun:`480 carros/día a las plantas con AGV. Manipulación de 150 s por carro; trayecto de ida y vuelta por ascensores, 200 s fijos por viaje. Turno de 7,5 h, k = 0,2. El AGV lleva hasta 3 carros. Compara 1, 2 y 3 por viaje.`,
plan:`Como el anterior, pero el transporte es un tiempo fijo de 200 s.`,
sol:`8 → 6 → <b>5 AGV</b>. Aquí el transporte pesa más (200 s frente a 150 s de manipulación), así que agrupar ahorra más que en el Excel 07.`,
calc:{id:'multi',preset:{N:480,manip:150,d:0,v:1,tfijo:200,h:7.5,k:0.2,qmax:3,turnos:1}}},
{id:'xl09',tag:'EXCEL 09',title:'Reparto en ruta a 4 puntos',
enun:`La carretilla carga 4 palés en el almacén y los reparte en ruta: deja un lleno y recoge un vacío en cada punto (70 s), y vuelve con los 4 vacíos. Tramos iguales de 30 m (también del almacén al primer punto) a 1,5 m/s. Carga o descarga en almacén: 35 s por palé. 560 palés/día, turno de 7,5 h, k = 0,3. a) Ciclo de una ruta. b) Rutas al día y carretillas.`,
plan:`Tramos = n + 1 = 5. Manipulación: carga de 4 palés en almacén (4 · 35) + 4 paradas (4 · 70) + descarga de 4 vacíos (4 · 35).`,
sol:`Transporte 5 · 20 = 100 s; manipulación 140 + 280 + 140 = 560 s; ruta = <b>660 s</b>. Rutas = 560 / 4 = 140. Carretillas = 1,3 · 140 · 660 / 27.000 = 4,45 → <b>5</b>.`,
calc:{id:'ruta',preset:{n:4,L:30,v:1.5,tparada:70,talm:35,N:560,h:7.5,k:0.3}}},
{id:'xl10',tag:'EXCEL 10',title:'Uno o dos turnos',
enun:`900 entregas/día, ciclo de 150 s, 7,5 h efectivas por turno. a) Carretillas a 1 turno. b) A 2 turnos. c) ¿Cuántas carretillas tener y cuántos operarios contratar?`,
plan:`Carga de trabajo = 900 · 150 / 3.600 = 37,5 h. Divide entre las horas que aporta cada carretilla según los turnos.`,
sol:`1 turno: 37,5 / 7,5 = <b>5 carretillas, 5 operarios</b>. 2 turnos: 2,5 → <b>3 carretillas, 6 operarios</b>. c) (el Excel lo deja en blanco) Con 2 turnos compras 2 carretillas menos pero contratas 1 operario más y la utilización baja del 100 % al 83 %. Con 1 turno vas al 100 % sin margen: cualquier incidencia rompe el servicio. Recomendaría 2 turnos con 3 carretillas, o 1 turno con 6 si la inversión en equipos es barata frente al coste de personal.`,
calc:{id:'turnos',preset:{N:900,ciclo:150,h:7.5,k:0}}},
{id:'xl11',tag:'EXCEL 11',title:'Inyectoras: granza a 350 m',
enun:`Almacén de granza, 300 palés/día. Recoge el palé (60 s), lo lleva a la inyectora (v = 2,2 m/s), deja el lleno y carga el vacío (70 s) y vuelve, donde descarga el vacío (60 s). 7,5 h, k = 0,3. a) Ciclo y carretillas de 1 en 1. b) Con 1, 2 y 4 por viaje. c) De 1 en 1 a 2 turnos. d) Implicaciones de 2 y 4. <b>Ojo</b>: el enunciado dice 80 m pero el Excel calcula con 350 m; aquí se usa 350 para cuadrar con el Excel.`,
plan:`Transporte = 2 · 350 / 2,2 = 318,2 s; manipulación = 60 + 70 + 60 = 190 s. Pon turnos = 2 para el apartado c).`,
sol:`a) 508,2 s → 7,34 → <b>8</b>. b) 1 → 8; 2 → 6; 4 → <b>4</b>. c) 2 turnos de 1 en 1: 3,67 → <b>4</b> (8 conductores). d) Con distancias largas el transporte pesa mucho (63 %) y agrupar sí compensa; a cambio hay que tener sitio en la inyectora para 2 o 4 palés y más stock en planta. Con 80 m el transporte sería 73 s y agrupar ahorraría muy poco: la distancia decide.`,
calc:{id:'multi',preset:{N:300,manip:190,d:350,v:2.2,tfijo:0,h:7.5,k:0.3,qmax:4,turnos:1}}},
{id:'xl12',tag:'EXCEL 12',title:'Milk-run de 5 estaciones a 1, 2 y 3 turnos',
enun:`Tren remolcador que sale del supermercado con 5 carros llenos (uno por estación), deja el lleno y engancha el vacío en cada parada (45 s) y vuelve con 5 vacíos. Tramos de 25 m (también del supermercado a E1 y de E5 al supermercado), 1,25 m/s. 1.500 carros/día, k = 0,2, 7,5 h por turno. Sin tiempo de operación en el supermercado. a) Ciclo. b) Vueltas al día. c) Trenes y conductores a 1, 2 y 3 turnos, y utilización.`,
plan:`6 tramos de 20 s y 5 paradas de 45 s. Vueltas = 1.500 / 5.`,
sol:`a) 120 + 225 = <b>345 s</b>. b) <b>300 vueltas</b>. c) 1 turno: 4,6 → 5 trenes, 5 conductores (92 %). 2 turnos: 2,3 → 3 trenes, 6 conductores (77 %). 3 turnos: 1,53 → 2 trenes, 6 conductores (77 %). Pasar a 3 turnos ahorra un tren respecto a 2 sin añadir conductores, pero obliga a trabajar de noche.`,
calc:{id:'ruta',preset:{n:5,L:25,v:1.25,tparada:45,talm:0,N:1500,h:7.5,k:0.2}}},
{id:'pa2',tag:'PRÁCTICA AULA · ACT. 2',title:'Viajes que genera cada almacén (Datos.xlsx)',
enun:`d) ¿Con qué columnas del Excel se obtiene el número de viajes que genera una referencia? ¿Por qué hay que redondear al alza? e) ¿Cuántos viajes diarios genera cada almacén?`,
plan:`Cada referencia ocupa un palé en su estación (almacenamiento en línea, envío directo). Un viaje lleva un palé lleno de la capacidad de su unidad de carga.`,
sol:`d) Viajes = <b>Demanda diaria (col. E) / Capacidad de la unidad de carga (col. D)</b>, redondeado al alza <b>por referencia</b> (=REDONDEAR.MAS(E/D;0)). Al alza porque si una referencia consume 2,3 palés al día, hay que hacer 3 viajes: no existe medio viaje y la línea no puede parar. La columna MOV del Excel da #¡REF! porque su fórmula apunta a una celda borrada; hay que rehacerla con E/D.<br>e) Con SUMAR.SI.CONJUNTO por almacén (T2, 211 referencias):<div class="tw" style="margin-top:6px"><table><thead><tr><th>Almacén</th><th class="n">Referencias</th><th class="n">Viajes/día</th><th class="n">Sin redondear</th></tr></thead><tbody><tr><td>Norte</td><td class="n">99</td><td class="n">828</td><td class="n">768,5</td></tr><tr><td>Este</td><td class="n">59</td><td class="n">443</td><td class="n">407,0</td></tr><tr><td>Sur</td><td class="n">32</td><td class="n">134</td><td class="n">116,6</td></tr><tr><td>Oeste</td><td class="n">21</td><td class="n">362</td><td class="n">350,7</td></tr><tr><td><b>Total</b></td><td class="n">211</td><td class="n"><b>1.767</b></td><td class="n">1.642,8</td></tr></tbody></table></div><p>Redondear por referencia añade 124 viajes (+7,6 %). Es el coste real de tener un palé completo por referencia: sumar demandas y redondear al final infradimensionaría.</p>`},
{id:'pa3',tag:'PRÁCTICA AULA · ACT. 3 y 6',title:'Remolcadoras por almacén, utilización, flota única y turnos',
enun:`Con el ciclo de la actividad 1 (363,3 s), 7,5 h efectivas y envío de uno en uno: f) carretillas por almacén; g) utilización de cada flota; h) ¿sumar horas y redondear una vez da lo mismo? Actividad 6: l) ¿cómo cambia con 2 turnos? m) ¿cuántos conductores en cada caso?`,
plan:`Usa los viajes de la actividad 2. Para la actividad 6, pon turnos = 2.`,
sol:`f) Norte 11,14 → <b>12</b> · Este 5,96 → <b>6</b> · Sur 1,80 → <b>2</b> · Oeste 4,87 → <b>5</b> = <b>25</b>. g) 92,9 % · 99,4 % · 90,2 % · 97,4 %. h) Flota única: 178,3 h / 7,5 = 23,8 → <b>24</b>, una menos, porque los redondeos de cada almacén no se comparten; solo vale si las remolcadoras pueden servir desde cualquier almacén. l) Con 2 turnos: 6 + 3 + 1 + 3 = <b>13 carretillas</b>. m) 1 turno: 25 conductores; 2 turnos: 13 · 2 = <b>26 conductores</b>. Se compran casi la mitad de equipos, pero se necesita un conductor más y la utilización media baja del 95 % al 91 %. Este al 99,4 % a un turno no tiene margen ninguno: en la realidad necesitaría k.`,
calc:{id:'flotas',preset:{ciclo:363.333,h:7.5,turnos:1,k:0,lista:'Norte:828; Este:443; Sur:134; Oeste:362'}}},
{id:'pa5',tag:'PRÁCTICA AULA · ACT. 5',title:'Envíos múltiples por almacén',
enun:`k) Envíos agrupados de 2, 3 o 4 unidades por viaje: la manipulación (70 + 90 + 70 = 230 s) se repite por unidad y el trayecto (200 m a 1,5 m/s) una vez. ¿Cuántas carretillas por almacén?`,
plan:`Cambia N por los viajes de cada almacén (Norte 828, Este 443, Sur 134, Oeste 362).`,
sol:`<div class="tw"><table><thead><tr><th>q</th><th class="n">Norte</th><th class="n">Este</th><th class="n">Sur</th><th class="n">Oeste</th><th class="n">Total</th></tr></thead><tbody><tr><td>1</td><td class="n">12</td><td class="n">6</td><td class="n">2</td><td class="n">5</td><td class="n">25</td></tr><tr><td>2</td><td class="n">10</td><td class="n">5</td><td class="n">2</td><td class="n">4</td><td class="n">21</td></tr><tr><td>3</td><td class="n">9</td><td class="n">5</td><td class="n">2</td><td class="n">4</td><td class="n">20</td></tr><tr><td>4</td><td class="n">9</td><td class="n">5</td><td class="n">2</td><td class="n">4</td><td class="n">20</td></tr></tbody></table></div><p>Pasar de 3 a 4 no ahorra nada: la manipulación (63 % del ciclo) no se reduce. Además, agrupar solo tiene sentido si las referencias del viaje van a estaciones cercanas y si la línea acepta pedir varias a la vez; si no, aparece espera hasta completar el envío.</p>`,
calc:{id:'multi',preset:{N:828,manip:230,d:100,v:1.5,tfijo:0,h:7.5,k:0,qmax:4,turnos:1}}},
{id:'pa4',tag:'PRÁCTICA AULA · ACT. 4',title:'Validación: qué no está en el ciclo',
enun:`j) La práctica no aplica coeficiente de seguridad. ¿Qué cosas reales no están en el ciclo y condicionarían el dimensionamiento?`,
plan:`Piensa en todo lo que hace que una carretilla no esté moviendo palés el 100 % de sus 7,5 h.`,
sol:`Esperas (botonera, preparación del palé en almacén, cola en el muelle), interferencias y cruces en pasillos, picos de demanda dentro del turno (la demanda no es uniforme), averías y carga o cambio de batería, pausas y relevos, maniobras de enganche de plataformas, errores de suministro y reposiciones urgentes, y variabilidad de la distancia real (100 m es una media). Todo eso es lo que cubre k. Con utilizaciones del 97–99 % (Este, Oeste) el resultado sin k no es operativo.`}
];
TOPICS.find(t=>t.id==='ud2b').open=[
{q:'Explica la fórmula del número de vehículos de manutención y el papel de cada término. ¿Por qué se redondea al alza y qué indica la utilización?',keys:['(1 + k) · Nº mov · t unitario / plazo','Nº mov: promedio o máximo previsible','t unitario: suma de operaciones elementales, valor estadístico (en transelevador = tiempo de ciclo)','Plazo en la misma unidad que el tiempo','k: seguridad por interferencias y operaciones menores, se suma (0,3 + 0,2)','Al alza: con menos no se cumple el plazo','Utilización = exacto / entero'],
a:`Vehículos = (1 + k) · Nº de movimientos · tiempo unitario / plazo disponible. El <b>número de movimientos</b> son las operaciones previstas (promedio o máximo previsible). El <b>tiempo unitario</b> es el tiempo medio por movimiento, obtenido sumando sus operaciones elementales con las velocidades nominales; es un valor estadístico, salvo en transelevadores, donde se usa el tiempo de ciclo. El <b>plazo</b> es el periodo en que deben hacerse, en la misma unidad que el tiempo. <b>k</b> es un coeficiente de seguridad por interferencias y operaciones menores; si hay varios se suman (30 % + 20 % → 0,5). El resultado se <b>redondea al alza</b> porque con un equipo menos el trabajo no cabe en el plazo. La <b>utilización</b> (exacto / entero) dice cuánto se aprovecha la flota: 1,57 → 2 da un 78,5 %, con margen; 0,98 → 1 sin k daría un 98 %, sin margen ante averías o picos.`},
{q:'Diferencia entre ciclo simple y combinado. ¿Cuándo conviene el combinado y cómo puede reducirse?',keys:['Simple: entra vacío sale lleno o al revés; ida, recogida, retorno, descarga','Combinado: entra lleno y sale lleno, almacena y extrae en el mismo viaje','Conviene con entradas y salidas pendientes','Pasillo estrecho: 2·Trd vs 4·Trd','Reducción del 20 % eligiendo la carga más cercana'],
a:`El <b>ciclo simple</b> hace una sola operación por viaje: va a la ubicación, recoge (o deja) y vuelve, así que la mitad del recorrido va en vacío. Comprende desplazamiento, recogida, retorno y descarga (en pasillo estrecho, 2·Trd). El <b>combinado</b> encadena un almacenamiento y una extracción: deja una carga en su hueco, va a otra ubicación, la recoge y vuelve (4·Trd). Conviene cuando hay a la vez entradas y salidas pendientes, porque aprovecha el viaje que en el simple iría vacío. Puede reducirse un 20 % si se elige extraer la carga más cercana a la que se acaba de almacenar.`},
{q:'En la práctica de aula, ¿por qué una flota única necesita menos remolcadoras que una flota por almacén? ¿Es siempre viable?',keys:['Cada almacén redondea al alza su fracción','Las holguras no se comparten entre almacenes','Sumar horas y redondear una vez: 25 → 24','Viable solo si los equipos pueden moverse entre almacenes','Coste: desplazamientos, coordinación, conocimiento del almacén'],
a:`Con una flota por almacén, cada uno redondea al alza su valor exacto (Norte 11,14 → 12, Este 5,96 → 6, Sur 1,80 → 2, Oeste 4,87 → 5 = 25), y las fracciones sobrantes no pueden aprovecharse en otro almacén. Si se suman las horas de todos (178,3 h) y se redondea una sola vez, salen 23,8 → 24. Pero solo es viable si las remolcadoras pueden moverse libremente entre almacenes: hay que contar el tiempo de traslado entre ellos, la coordinación de pedidos y que los conductores conozcan todos los almacenes. Si están lejos, la holgura teórica se pierde en desplazamientos.`},
{q:'¿Cuándo compensa agrupar envíos (2, 3 o 4 unidades por viaje) y qué inconvenientes tiene?',keys:['Solo se ahorra transporte (1 vez por viaje); manipulación se repite q veces','Compensa si el transporte pesa mucho en el ciclo (distancias largas)','Ejemplos: Excel 07 26→18, Excel 11 a 350 m 8→4, PA de 3 a 4 no ahorra','Inconvenientes: más stock en línea, espera para completar, espacio, estaciones cercanas'],
a:`Al agrupar, el trayecto se recorre una vez por viaje y la manipulación se repite por cada unidad, así que solo se ahorra transporte. Compensa cuando el transporte pesa mucho en el ciclo: en el Excel 11, con 350 m (63 % transporte), se pasa de 8 a 4 carretillas; en la práctica de aula, con el 63 % de manipulación, de 3 a 4 por viaje no se ahorra nada (20 y 20). Inconvenientes: hace falta espacio y stock en la línea para varias unidades, puede haber espera hasta completar el envío, y las referencias agrupadas deben ir a estaciones cercanas o la ruta se alarga.`}
];

{id:'1a-c2',tag:'CASO',title:'Cinco vehículos: categoría UE y código de construcción',
enun:`Clasifica según el Reglamento (UE) 2018/858 y el primer par de cifras del RGV:<ol><li>Furgón de 6.000 kg de MMA.</li><li>Tractocamión de 18.000 kg.</li><li>Remolque de 600 kg.</li><li>Semirremolque frigorífico de 34.000 kg.</li><li>Camión rígido de exactamente 3.500 kg.</li></ol>`,
plan:`Para cada uno: ¿personas, mercancías o remolque? → letra M, N u O. Después el tramo de MMA. Para el RGV decide antes la forma: cabina integrada (furgón 24/25/26), cabina no integrada (camión 20/21/22), tractocamión (23) o remolque/semi (40–43).`,
sol:`<div class="tw"><table><thead><tr><th>#</th><th>UE</th><th>RGV</th><th>Por qué</th></tr></thead><tbody>
<tr><td>1</td><td>N2</td><td class="n">25</td><td>Mercancías de 3,5–12 t. Cabina integrada → furgón del tramo medio.</td></tr>
<tr><td>2</td><td>N3</td><td class="n">23</td><td>&gt; 12 t. El tractocamión tiene código propio, sin tramos de MMA.</td></tr>
<tr><td>3</td><td>O1</td><td class="n">40</td><td>≤ 750 kg. Además no lleva permiso de circulación propio ni seguro aparte (1C).</td></tr>
<tr><td>4</td><td>O4</td><td class="n">43 (+ utilización 25)</td><td>&gt; 10 t. Frigorífico es la cifra de utilización, no de construcción.</td></tr>
<tr><td>5</td><td>N1</td><td class="n">20</td><td>3.500 kg exactos caen en el tramo inferior.</td></tr></tbody></table></div>
<div class="call ojo"><b>Dónde se pierde el punto</b>En el 4, mezclar construcción (43) y utilización (25). En el 5, poner 21 por pensar que 3.500 ya es "más de 3,5 t".</div>`,
calc:{id:'clasif',preset:{tipo:'merc',mma:6000,cab:'si',plazas:0}}},
{id:'1a-c3',tag:'CASO',title:'¿Es legal este vehículo o conjunto?',
enun:`Di si cumple las dimensiones y masas máximas y por qué:<ol><li>Tren de carretera de 18,90 m.</li><li>Vehículo articulado de 5 ejes, 16,40 m y 43 t.</li><li>Camión rígido de 3 ejes con 27 t.</li><li>Autobús rígido de 2 ejes de 14 m.</li><li>Camión frigorífico de 2,58 m de ancho.</li></ol>`,
plan:`Compara con la tabla: longitud (12 · 16,50 · 18,75 · 13,5 · 15 · 18,75), anchura (2,55 general; 2,60 acondicionados) y masas (rígido 3 ejes 25/26 t; articulado 5+ ejes 40/44 t).`,
sol:`<ol><li><b>No</b>: el tren de carretera tiene máximo 18,75 m.</li><li><b>Sí</b>: 16,40 ≤ 16,50 m y 43 ≤ 44 t con 5 o más ejes.</li><li><b>No</b>: un rígido de 3 ejes llega a 25 t (26 t en algunos casos). 27 t solo con 4 ejes (hasta 32).</li><li><b>No</b>: el rígido de 2 ejes llega a 13,5 m; con más de 2 ejes, 15 m.</li><li><b>Sí</b>: los vehículos acondicionados (frigoríficos) llegan a 2,60 m.</li></ol>
<div class="call porque"><b>Razonamiento</b>Las dimensiones y masas no dependen de la carga que lleve, sino del tipo de vehículo y del número de ejes. Si el enunciado no da los ejes, dilo como supuesto.</div>`},
{id:'1a-c4',tag:'CASO',title:'Clasificar el servicio',
enun:`Clasifica cada servicio (público o privado; regular o discrecional; uso general o especial):<ol><li>Línea de autobús Valencia–Castellón con horario publicado.</li><li>Excursión de un colegio contratada a una empresa de autocares.</li><li>Panadería que reparte su pan con sus propias furgonetas.</li><li>Ruta diaria de autobús de una empresa de transporte que lleva a los trabajadores de una fábrica.</li><li>Autobuses de refuerzo a la playa solo en julio y agosto.</li><li>Una familia que se va de vacaciones en su coche.</li></ol>`,
plan:`Primera pregunta: ¿por cuenta ajena con retribución? → público. ¿Lo hace una empresa para su propia actividad? → privado complementario. Después: ¿itinerario y horario fijos? → regular; ¿para un grupo homogéneo? → uso especial.`,
sol:`<ol><li>Público, regular, permanente, de uso general.</li><li>Público discrecional (sin itinerario fijo, se contrata el vehículo completo).</li><li>Privado complementario: la actividad principal no es el transporte.</li><li>Público regular de uso especial (grupo homogéneo: trabajadores).</li><li>Público regular temporal.</li><li>Privado particular.</li></ol>
<div class="call ojo"><b>Trampa</b>El 4 tiene ruta fija pero no es "uso general": lo decide el grupo de usuarios, no el recorrido.</div>`},
{id:'1a-c5',tag:'CASO',title:'¿Quién hace cada tarea en el departamento de tráfico?',
enun:`Asigna cada tarea al director de transporte, jefe de tráfico, auxiliar de tráfico, chófer o mozo de almacén:<ol><li>Recibir los pedidos de arrastre.</li><li>Controlar dietas, peajes y vacaciones de los conductores.</li><li>Negociar las tarifas con un cliente nuevo.</li><li>Llevar los elementos de aseguramiento a la plataforma de carga.</li><li>Entregar el justificante firmado de la entrega.</li><li>Vigilar que la flota pase la ITV a tiempo.</li></ol>`,
plan:`Director = estrategia y negocio. Jefe de tráfico = operación diaria y personal. Auxiliar = administración. Chófer = conducción y documentos del viaje. Mozo = logística interna.`,
sol:`<ol><li>Auxiliar de tráfico.</li><li>Jefe de tráfico.</li><li>Director de transporte.</li><li>Mozo de almacén.</li><li>Chófer.</li><li>Jefe de tráfico (el chófer cuida de su vehículo, pero la vigilancia de la flota es del jefe).</li></ol>`}
]);
addOpen('ud1a',[
{q:'Explica cómo se organiza el departamento de tráfico según el tamaño de la flota.',keys:['Pequeña (5–6 vehículos): el propietario','Mediana (6–30): persona de confianza','Grande: jefe de tráfico por delegación, con auxiliares','Más tamaño = más especialización de funciones'],
a:`En una flota <b>pequeña</b> (5–6 vehículos) el propio propietario lleva el tráfico. En una <b>mediana</b> (6–30) lo delega en una persona de confianza. En una <b>grande</b> hay un jefe de tráfico por delegación de la dirección, con auxiliares para la parte administrativa. Cuanto mayor es la flota, más se separan las funciones: estrategia (director), operación diaria (jefe), administración (auxiliar) y ejecución (chóferes y mozos).`},
{q:'Diferencia transporte público, privado complementario y privado particular, con un ejemplo de cada uno.',keys:['Público: por cuenta ajena, con retribución y autorización','Privado complementario: la empresa transporta lo suyo como parte de su actividad','Privado particular: necesidades personales, sin actividad económica','Ejemplos coherentes'],
a:`El <b>público</b> se presta por cuenta ajena a cambio de un precio y necesita autorización: una empresa de transporte que lleva palés para varios clientes. El <b>privado complementario</b> lo hace una empresa con sus vehículos como apoyo a su actividad principal, que no es el transporte: una cooperativa que lleva su fruta. El <b>privado particular</b> cubre necesidades personales sin actividad económica: una familia en su coche. El criterio no es el volumen ni el tamaño de la flota, sino de quién es la mercancía y si se cobra.`},
{q:'¿Qué información da cada cifra del código de clasificación del RGV? Pon un ejemplo completo.',keys:['1.ª pareja = construcción','2.ª pareja = utilización','Letra A/B = servicio público o privado + código de servicio (10, 12, 18…)','Ejemplo completo bien construido'],
a:`El primer par de cifras indica la <b>construcción</b> (20–22 camión, 23 tractocamión, 24–26 furgón, 40–43 remolques). El segundo, la <b>utilización</b> (24 refrigerante, 25 frigorífico, 26 calorífico, 27 cisterna). Después va el <b>servicio</b>: A público o B privado, y en su caso un código como 10 mercancías peligrosas, 12 escolar o 18 actividad económica ≤ 3.500 kg. Ejemplo: un rígido de 26 t cisterna de gasóleo de una empresa transportista sería 22 · 27 · A-10.`}
]);

addEx('ud1b',[
{id:'1b-c3',tag:'CASO',title:'Palés pesados en estantería de 12 m',
enun:`Palés de 2.200 kg, estanterías de 12 m, pasillos de 2,9 m, almacén cerrado. ¿Qué equipo usarías para ubicar? ¿Y si los pasillos fueran de 1,8 m?`,
plan:`Restricciones: peso 2,2 t, altura 12 m, pasillo 2,9 m, interior. Descarta por la más dura primero (altura).`,
sol:`<b>Retráctil</b>: llega a 14 m, carga ≤ 2,5 t y necesita pasillo de 2,8 m. La contrapesada se queda en 6–7 m y el apilador en 5,5 m. Con pasillos de <b>1,8 m</b> la retráctil ya no cabe: pasaría a <b>trilateral</b> (1,5–2,2 m, hasta 18 m). El selector también propone el 3D shuttle, pero es un salto a almacén automático con otra inversión: solo si el volumen lo justifica.`,
calc:{id:'selector',preset:{carga:'pale',peso:2200,altura:12,pasillo:2.9,lugar:'int',tarea:'almacenar'}}},
{id:'1b-c4',tag:'CASO',title:'Carga de camiones en patio exterior',
enun:`Palés de 3.000 kg que se cargan en camiones desde un patio exterior, con zona de maniobra amplia. ¿Qué equipo?`,
plan:`3 t descarta transpaleta y apilador (2 t) y retráctil (2,5 t). Exterior descarta los equipos de ruedas macizas.`,
sol:`<b>Contrapesada térmica</b> con ruedas neumáticas: más potencia y autonomía, trabaja en exterior y en uso intensivo. La eléctrica sería preferible en interior o en sectores sensibles (alimentación, farmacia) por ruido y emisiones, pero aquí manda el exterior y el peso.`,
calc:{id:'selector',preset:{carga:'pale',peso:3000,altura:1.5,pasillo:4,lugar:'ext',tarea:'muelle'}}},
{id:'1b-c5',tag:'CASO',title:'Almacén autoportante de 35 m',
enun:`Almacén autoportante de 35 m de altura, pasillos de 1,6 m, palés de 1.000 kg, alta rotación y necesidad de acceso a cualquier palé. ¿Qué sistema?`,
plan:`35 m descarta todo lo manual (trilateral 18 m). Acceso a cualquier palé = selectividad.`,
sol:`<b>Transelevador</b>: hasta 40–45 m, pasillo de 1,5–2 m, 100 % selectivo. Contrapartida: 1 pasillo = 1 equipo (baja flexibilidad) y alta inversión. El 3D shuttle llega a 20–30 m y es denso, no selectivo: no encaja con "acceso a cualquier palé".`,
calc:{id:'selector',preset:{carga:'pale',peso:1000,altura:35,pasillo:1.6,lugar:'int',tarea:'almacenar'}}},
{id:'1b-c6',tag:'CASO',title:'Alimentar una línea de montaje',
enun:`Una fábrica de automoción reparte piezas desde el almacén central a la línea en recorridos circulares cada 30 minutos. ¿Qué equipo? ¿Y si quieren eliminar el conductor?`,
plan:`Recorrido repetitivo y circular, arrastre de carros = milk-run.`,
sol:`<b>Carretilla remolcadora</b> arrastrando un tren de carros (milk-run): no eleva, arrastra hasta más de 25 t. Sin conductor: <b>AGV</b> si la ruta es fija y el entorno estable; <b>AMR</b> si cambia el layout o hay personas cruzando, porque recalcula la ruta.`,
calc:{id:'selector',preset:{carga:'pale',peso:500,altura:0.2,pasillo:3,lugar:'int',tarea:'linea'}}}
]);
addOpen('ud1b',[
{q:'Compara transelevador, miniload y 3D shuttle.',keys:['Transelevador: palés, 40–45 m, 100 % selectivo, 1 pasillo = 1 equipo','Miniload: cajas ≤ 250 kg, ≤ 20 m, picking automático','3D shuttle: 20–30 m, 3 ejes, denso, escalable','Criterio de elección: unidad de carga, altura, selectividad, flexibilidad, inversión'],
a:`Los tres son automáticos. El <b>transelevador</b> mueve palés en almacenes de hasta 40–45 m, con pasillos de 1,5–2 m; es 100 % selectivo pero rígido, porque cada pasillo tiene su máquina. El <b>miniload</b> es su versión para cajas de hasta 250 kg y unos 20 m, más rápido (250 m/min) y pensado para picking. El <b>3D shuttle</b> se mueve en tres ejes, llega a 20–30 m, es denso y escalable (añades shuttles cuando crece la demanda), pero no es selectivo y exige un WMS avanzado. Elegiría según la unidad de carga, la altura, si necesito acceso a cualquier unidad y cuánto varía la demanda.`},
{q:'¿Cómo elegirías el equipo de manutención de un almacén? Explica el método.',keys:['Unidad y peso de carga','Altura a alcanzar','Ancho de pasillo','Interior/exterior','Tipo de tarea (ubicar, muelle, picking, línea)','Elegir el menos sobredimensionado y justificar'],
a:`Cruzo restricciones de la más dura a la más blanda. Primero la <b>unidad y el peso</b> (palé de 3 t descarta transpaletas, apiladores y retráctil). Después la <b>altura</b> (5,5 m apilador, 6–7 contrapesada, 14 retráctil, 18 trilateral, 40–45 transelevador). Luego el <b>pasillo</b> (2,8 m retráctil, 1,5–2,2 trilateral) y si es <b>interior o exterior</b>. Por último la <b>tarea</b>: muelle, ubicación, picking o alimentación de línea. Si quedan varios, elijo el menos sobredimensionado y lo justifico con coste e intensidad de uso.`},
{q:'Diferencia AGV y AMR y explica cuándo usarías cada uno.',keys:['AGV: ruta fija guiada (cable, banda, láser), se detiene ante obstáculos','AMR: navegación autónoma, recalcula la ruta','AGV para recorridos repetitivos y entorno estable','AMR para entornos dinámicos o colaborativos, integración sencilla'],
a:`El <b>AGV</b> sigue una ruta predefinida (cable, banda magnética o láser con reflectores) y ante un obstáculo se para. Es fiable en recorridos repetitivos y entornos estables, como cadenas de montaje. El <b>AMR</b> navega de forma autónoma con mapas y sensores, y recalcula la ruta si algo le bloquea; se integra con más facilidad con el MES o el WMS y apenas necesita infraestructura. Usaría AMR en almacenes que cambian de layout o donde conviven con personas.`}
]);

{id:'1c-c3',tag:'CASO',title:'Furgoneta de reparto de 3.200 kg',
enun:`Furgoneta de 3.200 kg de MMA, 4 años, transporte público de paquetería dentro de la provincia, sin remolque. ¿Qué documentación lleva y qué permiso necesita el conductor?`,
plan:`3.200 kg → ligero (≤ 3,5 t). Público → autorización de ligeros. Nacional.`,
sol:`<b>Vehículo</b>: permiso de circulación, tarjeta ITV (ligero de 2–6 años: cada 2 años), seguro obligatorio, <b>autorización MDL</b> y carta de porte. <b>Conductor</b>: NIF, permiso <b>B</b> y CAP. <b>No</b> necesita tacógrafo (es para &gt; 3,5 t, y el de 2,5–3,5 t desde el 1/7/2026 es solo para internacional). <b>Carga</b>: carta de porte, DeCA electrónico, instrucciones y albarán.`,
calc:{id:'docs',preset:{tipo:'merc',mma:3200,rem:0,serv:'pub',mmpp:'no',cist:'no',ambito:'nac',edad:4,plazas:2,cont:'reg'}}},
{id:'1c-c4',tag:'CASO',title:'Camión con remolque a Francia',
enun:`Camión de 20.000 kg con remolque de 10.000 kg, 12 años, transporte público de muebles de Valencia a Lyon. ¿Documentación de vehículo, conductor y carga?`,
plan:`Pesado y con más de 10 años → ITV semestral. Remolque &gt; 750 kg → documentación propia y +E. Internacional → CMR.`,
sol:`<b>Vehículo</b>: permiso de circulación del camión <b>y del remolque</b>, ITV cada 6 meses, seguro de ambos, <b>autorización MDP</b>, contrato de transporte. <b>Conductor</b>: NIF (no hace falta pasaporte: Francia es UE), permiso <b>C+E</b>, tarjeta de tacógrafo y CAP. <b>Carga</b>: <b>CMR</b>, factura comercial, packing list y albarán.`,
calc:{id:'docs',preset:{tipo:'merc',mma:20000,rem:10000,serv:'pub',mmpp:'no',cist:'no',ambito:'int',edad:12,plazas:2,cont:'reg'}}},
{id:'1c-c5',tag:'CASO',title:'Cisterna de gasóleo',

plan:`MMPP + cisterna → el vehículo también necesita acreditación ADR.`,
sol:`Además de lo normal de un pesado (MDP, ITV anual, C, tacógrafo, CAP), lleva <b>certificado de aprobación ADR del vehículo</b> (es cisterna) y el conductor <b>autorización ADR</b>. Si fuera en <b>bidones</b>, el vehículo no necesitaría el certificado ADR; solo el conductor seguiría necesitando su autorización. En la clasificación RGV sería 22 · 27 · A-10.`,

{id:'1c-c6',tag:'CASO',title:'Autocar de excursiones',
enun:`Autocar de 55 plazas, 7 años, que una empresa alquila con conductor para excursiones y bodas. ¿Documentación?`,
plan:`Viajeros, público discrecional, &gt; 5 años.`,
sol:`<b>Vehículo</b>: permiso de circulación, ITV <b>cada 6 meses</b> (viajeros &gt; 5 años), seguro obligatorio + SOV, contrato de transporte, <b>autorización VD</b> y <b>hoja de ruta</b> (digital desde el 5/10/2026, se conserva 1 año). No lleva libro de reclamaciones: es de los servicios regulares de uso general. <b>Conductor</b>: permiso <b>D</b> (más de 17 plazas), tarjeta de tacógrafo y CAP.`,
calc:{id:'docs',preset:{tipo:'viaj',mma:18000,rem:0,serv:'pub',mmpp:'no',cist:'no',ambito:'nac',edad:7,plazas:55,cont:'disc'}}},
{id:'1c-c7',tag:'CASO',title:'¿Qué permiso de conducir?',
enun:`Indica el permiso necesario:<ol><li>Furgoneta de 3.400 kg.</li><li>Camión de 6.500 kg con remolque de 600 kg.</li><li>Camión de 6.500 kg con remolque de 4.000 kg.</li><li>Camión de 7.500 kg.</li><li>Microbús de 16 plazas con el conductor.</li><li>Camión de 18 t con semirremolque.</li></ol>`,
plan:`C1: 3.500–7.500 (sin llegar). C: &gt; 3.500 sin límite. +E si el remolque pasa de 750 kg. C1+E: conjunto ≤ 12.000 kg.`,
sol:`<ol><li>B.</li><li>C1 (remolque ≤ 750 kg).</li><li>C1+E: el camión está en el tramo de C1 y el conjunto pesa 10.500 kg ≤ 12.000. Si el conjunto pasara de 12.000 kg haría falta C+E.</li><li>C: 7.500 exactos ya no son C1.</li><li>D1 (hasta 17 plazas con el conductor).</li><li>C+E.</li></ol>`}

addOpen('ud1c',[
{q:'Explica las autorizaciones de transporte de mercancías y viajeros y qué requisitos tienen.',keys:['MDP (pesados) y MDL (ligeros): público de mercancías','MPC: privado complementario, sin distinción de peso','VD: público discrecional de viajeros; regulares por concesión','VPC: privado complementario de viajeros','Requisitos MDP: Registro General de Transportistas y competencia profesional, además de obligaciones fiscales y vehículos con ITV'],
a:`La autorización es la "licencia" para hacer la actividad. En mercancías, el transporte público necesita <b>MDP</b> si el vehículo pasa de 3,5 t y <b>MDL</b> si es ligero; el privado complementario necesita <b>MPC</b>, sin distinción de peso y sin límite de antigüedad. En viajeros, el discrecional público necesita <b>VD</b> (al solicitarla, al menos un vehículo de ≤ 2 años), los regulares funcionan por concesión y el privado complementario con <b>VPC</b>. Para MDP la empresa debe estar inscrita en el Registro General de Transportistas, acreditar competencia profesional, además de estar al corriente de obligaciones fiscales y tener vehículos con ITV.`},
{q:'¿Qué documentación es específica del transporte de viajeros?',keys:['Seguro obligatorio de viajeros (SOV)','Hoja de ruta en discrecionales (digital, 1 año)','Libro de reclamaciones en regulares de uso general','Autorización VD / concesión / VPC','Permiso D1 o D'],
a:`Además de lo común (permiso de circulación, ITV, seguro, tacógrafo, CAP), el transporte de viajeros lleva el <b>seguro obligatorio de viajeros</b>, la <b>hoja de ruta</b> en los servicios discrecionales (origen, destino, fecha, matrícula, conductor y número de viajeros; digital desde el 5/10/2026 y se conserva un año), y el <b>libro de reclamaciones</b> en los regulares de uso general. La ITV es anual los 5 primeros años y semestral después. El conductor necesita D1 (hasta 17 plazas con el conductor) o D.`},
{q:'¿Qué normativa regula los equipos de manutención y la formación de sus conductores?',keys:['Directiva 2006/42/CE (marcado CE, manual)','Reglamento (UE) 2023/1230 desde 14/1/2027','RD 1215/1997 equipos de trabajo','LPRL y UNE 58451:2016 formación','NTP 713 autorización interna'],
a:`Todo equipo de manutención debe llevar <b>marcado CE</b> y manual según la Directiva 2006/42/CE de máquinas, que será sustituida por el <b>Reglamento (UE) 2023/1230</b> a partir del 14/1/2027, y pasar revisiones periódicas. El <b>RD 1215/1997</b> obliga a formar a quienes usan equipos de trabajo; junto con la Ley de Prevención de Riesgos Laborales y la norma <b>UNE 58451:2016</b> definen la formación del carretillero. La empresa además autoriza internamente a cada conductor (NTP 713). No hay "carné de carretillero" oficial: es formación + autorización.`}
]);

{id:'2a-back',tag:'PRÁCTICA',title:'Backward: ¿cuándo tiene que estar el material?',
enun:`Has comprometido la entrega con el cliente el viernes 27/11/2026. Tránsito 1 día, carga 1 día, preparación 2 días y planificación 1 día en paralelo. ¿Cuándo debe estar disponible el material y cuándo empieza la planificación?`,
plan:`Restar desde la entrega: tránsito → salida; carga → plazo de carga; preparación → disposición. La planificación termina al empezar la carga.`,
sol:`Salida jue 26/11, carga mié 25/11, <b>disposición lun 23/11</b>, <b>planificación desde el mar 24/11</b>. Antelación total: 1 + 1 + 2 = 4 días.`,
calc:{id:'backward',preset:{fecha:'2026-11-27',trans:1,carga:1,prep:2,plan:1}}},
{id:'2a-par',tag:'TRAMPA',title:'Cuando la planificación es más larga que la preparación',
enun:`Disposición del material el lunes 1/6/2026. Preparación 2 días, planificación 3 días en paralelo, carga 1 día y tránsito 1 día. ¿Fecha de entrega?`,
plan:`El camino crítico antes de cargar es el máximo de las dos tareas en paralelo.`,
sol:`max(2, 3) = 3 → carga el jue 4/6, salida vie 5/6, <b>entrega sáb 6/6</b>. Si sumas la preparación te sale el viernes: es justo el error. Comenta que cae en sábado.`,

{id:'2a-kpi2',tag:'PRÁCTICA',title:'Nivel de servicio por debajo del objetivo',
enun:`Entregas a tiempo: el mes pasado 96 %, este mes 94 %, objetivo 97 %. Calcula las desviaciones y propón dos acciones.`,
plan:`Aquí "más es mejor". Desviaciones en puntos.`,
sol:`Frente al objetivo: 94 − 97 = <b>−3 puntos</b> (no cumple). Frente al mes anterior: <b>−2 puntos</b> (empeora; en relativo −2,1 %). Acciones: analizar las incidencias por ruta y franja para ver dónde se concentran los retrasos, revisar las restricciones de tiempo (ventanas horarias, hora punta) en el diseño de rutas y reforzar la flota en los días pico.`,
calc:{id:'kpi',preset:{actual:94,anterior:96,objetivo:97,sentido:'mas'}}},
{id:'2a-kpis',tag:'CASO',title:'Calcula y clasifica cinco indicadores',
enun:`Datos de un mes: 120 servicios con 40 h de conductor; 1.800 € de coste para 600 palés; un camión de 80 m³ viaja de media con 26 m³; 470 de 500 entregas a tiempo; 2.400 km en vacío de 12.000 km totales. Calcula cada indicador y di de qué tipo es.`,
plan:`Productividad = resultado / recurso. Coste unitario = coste / resultado. Utilización = usado / disponible. Nivel de servicio = cumplido / comprometido.`,
sol:`<div class="tw"><table><thead><tr><th>Indicador</th><th class="n">Valor</th><th>Tipo</th></tr></thead><tbody>
<tr><td>Servicios / hora de conductor</td><td class="n">3</td><td>Productividad</td></tr>
<tr><td>Coste por palé</td><td class="n">3 €</td><td>Coste unitario</td></tr>
<tr><td>Ocupación en volumen</td><td class="n">32,5 %</td><td>Utilización</td></tr>
<tr><td>Entregas a tiempo</td><td class="n">94 %</td><td>Nivel de servicio</td></tr>
<tr><td>Km en vacío</td><td class="n">20 %</td><td>Utilización (cuanto menos, mejor)</td></tr></tbody></table></div>
<div class="call porque"><b>Lectura crítica</b>El 32,5 % de ocupación es lo más llamativo: o el camión es demasiado grande para la demanda o se pueden consolidar cargas. Pero solo un valor no basta: compáralo con el objetivo y con otras rutas.</div>`},
{id:'2a-rutas',tag:'CASO',title:'¿Ruta fija, diaria o periódica?',
enun:`Elige el tipo de ruta y justifica:<ol><li>Reparto a 40 supermercados de una cadena con pedidos muy estables.</li><li>Empresa de paquetería con destinos distintos cada día.</li><li>Refuerzo de reparto de juguetes en campaña de Navidad.</li></ol>`,
plan:`Fijas = demanda estable, poco diseño. Diarias = se ajustan a la demanda, mucho diseño. Periódicas = picos concretos.`,
sol:`<ol><li><b>Fija</b>: un solo diseño por ciclo, el conductor conoce el recorrido y el cliente. Riesgo: si un día sube la demanda puede quedar mercancía sin repartir.</li><li><b>Diaria</b>: se reparte toda la mercancía ajustada a la demanda real, a cambio de mucho tiempo de diseño (necesita software).</li><li><b>Periódica</b>: se diseña para el pico de campaña y se combina con las rutas habituales.</li></ol>`}
]);
addOpen('ud2a',[
{q:'Describe las 8 etapas del proceso operativo del transporte.',keys:['1 Recepción del pedido (viabilidad, prevalidación, registro)','2 Planificación (asignar vehículo y conductor)','3 Documentación y expediente de viaje','4 Controles previos (limpieza, temperatura, equipo)','5 Carga y aseguramiento','6 Transporte y seguimiento','7 Descarga y entrega','8 Cierre (incidencias, facturación)'],
a:`1) <b>Pedido</b>: se revisa, se comprueba su viabilidad, se prevalida y se registra. 2) <b>Planificación</b>: se asignan vehículo y conductor según la mercancía, el vehículo, su localización y disponibilidad, las tarifas, el conductor y la fiabilidad. 3) <b>Documentación</b>: carta de porte, DeCA y el expediente de viaje que servirá para el seguimiento, las incidencias y las auditorías. 4) <b>Controles previos</b>: limpieza, temperatura y estado del equipo. 5) <b>Carga</b> y aseguramiento con cintas y barras. 6) <b>Transporte</b> con seguimiento. 7) <b>Descarga</b> y entrega con firma. 8) <b>Cierre</b>: incidencias, indicadores y facturación.`},
{q:'Explica las cinco fases de la gestión de flotas y qué decide cada una.',keys:['Diseño de rutas: itinerarios y objetivos','Planificación de la oferta: cuántos recursos','Planificación de servicios: quién hace qué trayecto','Planificación del personal: turnos','Gestión de la operación: ejecución diaria e incidencias'],
a:`Primero se <b>diseñan las rutas</b> (itinerarios con el objetivo de reducir tiempos, distancias y costes y ajustar la flota al volumen previsto). Con eso se <b>planifica la oferta</b>: cuántos vehículos y recursos hacen falta. Después se <b>planifican los servicios</b>: qué vehículo hace qué trayecto y cuándo. Luego el <b>personal</b>: turnos y condiciones ("Juan trabaja de lunes a viernes de mañana"). Por último, la <b>gestión de la operación</b> supervisa el día a día: entregas, recogidas, seguimiento e incidencias. El orden importa: cada fase usa lo decidido en la anterior.`},
{q:'¿Qué información necesitas para preparar una ruta?',keys:['Pedidos: clientes, cantidades, ventanas','Flota: tipo, capacidad, disponibilidad','Distancias: línea recta corregida (~20 %) o mapa informatizado','Restricciones de tiempo: hora punta, salida, última llegada','Costes y tarifas'],
a:`Información de los <b>pedidos</b> (clientes, cantidades, ventanas horarias), de la <b>flota</b> (tipos, capacidad, disponibilidad), el <b>cálculo de distancias</b> (la línea recta corregida un 20 % es rápida pero imprecisa en montaña; el mapa informatizado da distancias exactas con tipo de vía, peajes y gálibos), las <b>restricciones de tiempo</b> (hora punta, hora de salida, última llegada, descansos) y los costes. Sin todas ellas la ruta parece óptima en papel y falla en la calle.`}
]);

addEx('ud2b',[
{id:'2b-n1',tag:'PRÁCTICA',title:'Sin margen frente a con margen',
enun:`480 movimientos al día de 3 minutos cada uno, jornada efectiva de 8 h. ¿Cuántas carretillas con k = 0? ¿Y con k = 0,2?`,
plan:`Pasa todo a segundos: 3 min = 180 s; 8 h = 28.800 s.`,
sol:`k = 0: 480 · 180 / 28.800 = <b>3,0 → 3</b> carretillas al 100 % de utilización, sin margen para averías o picos. k = 0,2: 1,2 · 3 = 3,6 → <b>4</b> (utilización 90 %). La segunda es la operativa.`,
calc:{id:'nveh',preset:{N:480,t:180,plazo:8,k:0.2}}},
{id:'2b-cs2',tag:'PRÁCTICA',title:'Ciclo simple de una retráctil en pasillo estrecho',
enun:`Pasillo de 60 m de largo y 6 m de alto. Retráctil cargada: vx = 2,5 m/s, vz = 0,35 m/s. Tomar o dejar: 8 s. Calcula el ciclo simple y los ciclos por hora.`,
plan:`Tcs = vx·Z²/(3vz²X) + X/vx + 2·Trd. Comprueba antes que X/vx (24 s) &gt; Z/vz (17,1 s): domina el horizontal y la fórmula aplica bien.`,
sol:`Término vertical = 2,5 · 36 / (3 · 0,1225 · 60) = <b>4,08 s</b>; horizontal = 60 / 2,5 = <b>24 s</b>; manipulación = 16 s. Tcs = <b>44,08 s</b> → 3.600 / 44,08 = <b>81,7 ciclos/h</b>.`,
calc:{id:'cs_pe',preset:{X:60,Z:6,vx:2.5,vz:0.35,Trd:8}}},
{id:'2b-t2',tag:'PRÁCTICA',title:'¿Uno, dos o tres turnos?',
enun:`300 entregas al día, ciclo de 420 s por entrega, 7,5 h efectivas por turno, k = 0,1. Compara 1, 2 y 3 turnos.`,
plan:`Carga = 300 · 420 / 3.600 = 35 h. Para cada número de turnos: equipos = ⌈1,1 · 35 / (7,5 · turnos)⌉; conductores = equipos · turnos.`,
sol:`1 turno: 5,13 → <b>6 equipos y 6 conductores</b>. 2 turnos: 2,57 → <b>3 equipos y 6 conductores</b>. 3 turnos: 1,71 → <b>2 equipos y 6 conductores</b>. Con dos turnos se ahorra la mitad de la inversión con el mismo personal; el tercer turno ahorra un equipo más pero obliga a trabajar de noche.`,
calc:{id:'turnos',preset:{N:300,ciclo:420,h:7.5,k:0.1}}}
]);
addOpen('ud2b',[
{q:'¿Por qué el número de equipos se redondea siempre al alza y qué se comenta después?',keys:['Con menos equipos no se hace el trabajo en el plazo','Aunque salga 1,05','Comentar la utilización real (exacto / entero)','Valorar si es operativa (holgura, k)'],
a:`Porque el valor exacto es la capacidad mínima necesaria: con un equipo menos el trabajo no cabe en el plazo, aunque el exacto sea 1,05. Después hay que dar la <b>utilización</b> (exacto / entero): si sale 95 % hay poco margen ante averías o picos y conviene revisar k o los turnos; si sale 55 %, el último equipo está casi parado y se puede valorar una flota compartida o envíos múltiples.`},
{q:'Diferencia ciclo simple y ciclo combinado y explica cuándo conviene el combinado.',keys:['Simple: entra vacío sale lleno (o al revés), 2 manipulaciones','Combinado: entra lleno, sale lleno, 4 manipulaciones','Combinado aprovecha el viaje de vuelta','Conviene con entradas y salidas simultáneas; −20 % si se elige la ubicación más cercana'],
a:`En el <b>simple</b> la carretilla hace un movimiento por viaje: entra cargada y sale vacía, o al revés, con dos manipulaciones (2·Trd). En el <b>combinado</b> deja un palé y en el mismo viaje recoge otro: entra llena y sale llena, con cuatro manipulaciones (4·Trd). Por movimiento es más eficiente porque elimina viajes en vacío. Conviene cuando hay entradas y salidas a la vez; si además se elige la ubicación de recogida más cercana, el ciclo puede bajar un 20 %.`},
{q:'Explica las fases de la recepción y del almacenaje en un almacén.',keys:['Recepción: planificación previa (orden de compra, muelle), descarga, control cuantitativo y cualitativo, registro','Almacenaje: asignación de ubicación (manual fija/aleatoria o WMS), traslado, ubicación, confirmación con código de barras/RFID','Reubicaciones internas: costosas, solo si hace falta'],
a:`La <b>recepción</b> empieza antes de que llegue el camión: con la orden de compra se planifican muelle, medios y personal. Después se descarga, se controla cantidad y calidad y se registra la entrada. El <b>almacenaje</b> asigna una ubicación (de forma manual, fija o aleatoria, o automática con el WMS), traslada la mercancía, la ubica y confirma la entrada con código de barras o RFID para que el sistema sepa dónde está. Las reubicaciones internas son caras y solo se hacen cuando hay que liberar una ubicación.`}
]);

addEx('ud2c',[
{id:'2c-fms',tag:'CASO',title:'Leer el panel de un FMS',
enun:`El FMS de una flota de 4 camiones muestra este mes:<div class="tw"><table><thead><tr><th>Camión</th><th class="n">L/100 km</th><th class="n">Km en vacío</th><th class="n">Alertas de frenada brusca</th><th class="n">Paradas no previstas</th></tr></thead><tbody><tr><td>C1</td><td class="n">29</td><td class="n">12 %</td><td class="n">3</td><td class="n">1</td></tr><tr><td>C2</td><td class="n">36</td><td class="n">14 %</td><td class="n">27</td><td class="n">0</td></tr><tr><td>C3</td><td class="n">30</td><td class="n">31 %</td><td class="n">4</td><td class="n">2</td></tr><tr><td>C4</td><td class="n">31</td><td class="n">13 %</td><td class="n">5</td><td class="n">9</td></tr></tbody></table></div>¿Qué problema tiene cada camión y qué función del FMS lo detecta? ¿Qué harías?`,
plan:`Compara cada camión con la media de los demás; un indicador aislado no dice nada.`,
sol:`<ul><li><b>C2</b>: consumo un 20 % por encima y muchas alertas de frenada → conducción agresiva. Funciones: monitorización de consumo y alertas de conducción. Acción: formación en conducción eficiente.</li><li><b>C3</b>: 31 % en vacío frente a ~13 % → problema de planificación, no del conductor. Función: registro de rutas. Acción: buscar cargas de retorno o reasignar rutas.</li><li><b>C4</b>: 9 paradas no previstas. Función: registro de rutas y tiempos. Acción: revisar con el conductor si son incidencias reales o paradas no autorizadas.</li><li><b>C1</b>: referencia.</li></ul>`},
{id:'2c-cls',tag:'CASO',title:'IoT, Big Data, IA o blockchain',
enun:`Clasifica:<ol><li>Sensores en los palés envían la humedad cada 5 minutos.</li><li>Se analizan 3 años de entregas para ver qué zonas pierden dinero.</li><li>El sistema predice el retraso de mañana por obras y cambia la ruta.</li><li>Cada cambio de custodia de un lote de medicamentos queda registrado sin que nadie pueda borrarlo.</li><li>Una báscula conectada en el muelle pesa y envía el peso de cada palé.</li><li>Un algoritmo propone el orden óptimo de 60 paradas.</li></ol>`,
plan:`IoT recoge, Big Data analiza en masa, IA predice o decide, blockchain registra sin poder alterar.`,
sol:`1 IoT · 2 Big Data · 3 IA · 4 Blockchain · 5 IoT · 6 IA (optimización). Matiz: 2 y 3 se apoyan en los datos que recoge el IoT; las tecnologías se combinan.`}

addOpen('ud2c',[
{q:'Explica IoT, Big Data e inteligencia artificial en logística y cómo se complementan.',keys:['IoT: sensores que recogen datos (temperatura, posición, estado)','Big Data: análisis de grandes volúmenes (4 V)','IA: predice y propone (rutas, atascos, demanda)','Se encadenan: el IoT alimenta al Big Data y a la IA'],
a:`El <b>IoT</b> pone sensores en vehículos, palés o infraestructuras que recogen datos de forma continua, como la temperatura de unas vacunas cada minuto con alerta fuera de +2/+8 °C. El <b>Big Data</b> analiza volúmenes enormes de esos datos (volumen, variedad, velocidad, variabilidad) para encontrar patrones, por ejemplo qué zonas de reparto son menos rentables. La <b>IA</b> usa esos datos para predecir y decidir: anticipa un atasco en la A-3 y propone una ruta alternativa. Se complementan en cadena: sin datos fiables del IoT, el análisis y la predicción no valen.`},
{q:'¿Qué problemas habituales de la gestión de flotas resuelven los sistemas telemáticos?',keys:['No saber dónde está el vehículo o la mercancía → localización','Condiciones de la carga → sensores/IoT','Consumos y costes no controlados → FMS','Errores en la documentación → integración ERP/TMS y digitalización','Incumplimiento de tiempos de conducción → tacógrafo'],
a:`El desconocimiento de la <b>ubicación</b> se resuelve con localización (GNSS más comunicaciones móviles). La pérdida de control de las <b>condiciones de la carga</b>, con sensores IoT de temperatura, puertas o impactos. Los <b>costes y consumos</b> sin control, con un FMS que compara vehículos y rutas. Los <b>errores en la documentación</b>, integrando los datos en ERP o TMS y digitalizando documentos. Y el control de <b>conducción y descanso</b>, con el tacógrafo digital. El objetivo común es más eficiencia, seguridad y trazabilidad.`}
]);

{t:'ud1b',lv:'d',q:'Hay que mover palés de 1.800 kg a 6 m de altura en un almacén pequeño. ¿Por qué no vale un apilador?',o:['Porque su elevación máxima es 5,5 m, aunque el peso sí lo admitiría','Porque solo carga hasta 1.000 kg','Porque solo trabaja en exterior','Sí vale: llega a 6 m con 2.000 kg'],a:0,e:'Apilador: hasta 2.000 kg y 5,5 m. Falla la altura, no el peso.'},
